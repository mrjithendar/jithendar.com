<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="01-big-picture-title 01-big-picture-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="01-big-picture-title">One machine gives instructions, many servers follow them</title>
<desc id="01-big-picture-desc">A person, or the Jenkins build server, runs one command on a control machine. Ansible reads the written instructions in this repository and connects to each of the eight RoboShop servers on AWS over SSH: frontend, catalogue, user, cart, shipping, payment, mongodb and rabbitmq. Nothing extra is installed on the servers; they only need SSH and Python.</desc>
<rect width="720" height="420" fill="#ffffff"/>
<defs>
<marker id="01-big-picture-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="01-big-picture-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="01-big-picture-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="01-big-picture-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="01-big-picture-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="01-big-picture-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="250" height="396" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Control machine</text>
<rect x="290" y="12" width="415" height="396" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="298" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Eight RoboShop servers on AWS</text>
<polyline points="140.0,100 140.0,170" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#01-big-picture-sync)"/>
<polyline points="140.0,296 140.0,242" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#01-big-picture-sync)"/>
<polyline points="250,180.8 470,60.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#01-big-picture-sync)"/>
<polyline points="250,188.0 470,105.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#01-big-picture-sync)"/>
<polyline points="250,195.2 470,150.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#01-big-picture-sync)"/>
<polyline points="250,202.4 470,195.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#01-big-picture-sync)"/>
<polyline points="250,209.6 470,240.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#01-big-picture-sync)"/>
<polyline points="250,216.8 470,285.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#01-big-picture-sync)"/>
<polyline points="250,224.0 470,330.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#01-big-picture-sync)"/>
<polyline points="250,231.2 470,375.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#01-big-picture-sync)"/>
<rect x="30" y="44" width="220" height="56" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="140.0" y="71.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">You, or Jenkins</text>
<text x="140.0" y="87.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">types one command</text>
<rect x="30" y="170" width="220" height="72" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="140.0" y="197.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Ansible</text>
<text x="140.0" y="213.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">reads the instructions,</text>
<text x="140.0" y="229.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">then does the work</text>
<rect x="30" y="296" width="220" height="56" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="140.0" y="323.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">This repository</text>
<text x="140.0" y="339.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">the written instructions</text>
<rect x="470" y="40" width="220" height="40" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="580.0" y="59.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">frontend</text>
<text x="580.0" y="75.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">the website (nginx)</text>
<rect x="470" y="85" width="220" height="40" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="580.0" y="104.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">catalogue</text>
<text x="580.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">product list (Node.js)</text>
<rect x="470" y="130" width="220" height="40" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="580.0" y="149.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">user</text>
<text x="580.0" y="165.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">logins (Node.js)</text>
<rect x="470" y="175" width="220" height="40" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="580.0" y="194.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">cart</text>
<text x="580.0" y="210.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">shopping basket (Node.js)</text>
<rect x="470" y="220" width="220" height="40" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="580.0" y="239.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">shipping</text>
<text x="580.0" y="255.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">delivery costs (Java)</text>
<rect x="470" y="265" width="220" height="40" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="580.0" y="284.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">payment</text>
<text x="580.0" y="300.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">card payments (Python)</text>
<rect x="470" y="310" width="220" height="40" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="580.0" y="329.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">mongodb</text>
<text x="580.0" y="345.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">products and users database</text>
<rect x="470" y="355" width="220" height="40" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="580.0" y="374.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">rabbitmq</text>
<text x="580.0" y="390.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">message queue</text>
<rect x="123.5" y="126.5" width="33.0" height="17" fill="#ffffff" opacity="0.92"/>
<text x="140.0" y="138.5" text-anchor="middle" font-size="12" fill="#0f172a">runs</text>
<rect x="120.4" y="260.5" width="39.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="140.0" y="272.5" text-anchor="middle" font-size="12" fill="#0f172a">reads</text>
<rect x="306.6" y="190.2" width="26.7" height="17" fill="#ffffff" opacity="0.92"/>
<text x="320.0" y="202.2" text-anchor="middle" font-size="12" fill="#0f172a">SSH</text>
<text x="30" y="376" font-size="12" font-weight="600" fill="#475569">No agent on the servers:</text>
<text x="30" y="393" font-size="12" font-weight="600" fill="#475569">just SSH and Python.</text>
</svg>
