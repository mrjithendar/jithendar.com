<polyline points="447.5,224 447.5,244" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#02-building-blocks-sync)"/>
<polyline points="447.5,296 447.5,316" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#02-building-blocks-sync)"/>
