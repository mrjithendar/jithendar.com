<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="02-building-blocks-title 02-building-blocks-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="02-building-blocks-title">How the pieces of Ansible fit inside each other</title>
<desc id="02-building-blocks-desc">The inventory is the address book: which servers exist and what job each one has. The playbook, roboshop.yml, is the run sheet. It holds plays; each play picks a group of servers from the inventory and gives them roles. A role, such as catalogue, is a recipe card made of tasks. Each task uses one module, a ready-made tool such as dnf to install software or copy to put a file in place. A handler runs only when a task changed something. Variables fill in the blanks, and secrets come from an encrypted vault file.</desc>
<rect width="720" height="540" fill="#ffffff"/>
<defs>
<marker id="02-building-blocks-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="02-building-blocks-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="02-building-blocks-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="02-building-blocks-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="02-building-blocks-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="02-building-blocks-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
