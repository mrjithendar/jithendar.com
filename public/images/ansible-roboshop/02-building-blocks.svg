<text x="115.0" y="345.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">fill in the blanks:</text>
<text x="115.0" y="361.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">names, folders, versions</text>
<rect x="30" y="400" width="170" height="76" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="115.0" y="429.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4c0519">Vault</text>
<text x="115.0" y="445.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">secrets, locked with</text>
<text x="115.0" y="461.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">a password</text>
<rect x="275" y="100" width="345" height="52" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="447.5" y="125.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Task: install Node.js</text>
<text x="447.5" y="141.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">module: dnf (the software installer)</text>
<rect x="275" y="172" width="345" height="52" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="447.5" y="197.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Task: copy the app&#x27;s files</text>
<text x="447.5" y="213.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">module: copy</text>
<rect x="275" y="244" width="345" height="52" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="447.5" y="269.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Task: write the service settings</text>
<text x="447.5" y="285.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">module: template (fill-in-the-blanks file)</text>
<rect x="275" y="316" width="345" height="52" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="447.5" y="341.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Task: start catalogue</text>
<text x="447.5" y="357.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">module: systemd_service</text>
<rect x="275" y="408" width="345" height="72" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="447.5" y="435.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4c0519">Handler: restart catalogue</text>
<text x="447.5" y="451.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">runs once, at the end,</text>
<text x="447.5" y="467.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">only if a task above changed something</text>
<rect x="230.1" y="105.5" width="45.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="252.8" y="117.5" text-anchor="middle" font-size="12" fill="#0f172a">hosts:</text>
<rect x="625.3" y="348.5" width="45.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="648.0" y="360.5" text-anchor="middle" font-size="12" fill="#0f172a">notify</text>
</svg>
