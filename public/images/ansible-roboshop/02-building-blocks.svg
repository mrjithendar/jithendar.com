<rect x="30" y="44" width="170" height="92" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="115.0" y="73.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">Inventory</text>
<text x="115.0" y="89.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">the address book:</text>
<text x="115.0" y="105.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">which servers exist,</text>
<text x="115.0" y="121.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">grouped by job</text>
<rect x="30" y="300" width="170" height="76" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
