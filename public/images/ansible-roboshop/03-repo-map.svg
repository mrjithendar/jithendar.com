<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="03-repo-map-title 03-repo-map-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="03-repo-map-title">What each folder of the Ansible repository holds</title>
<desc id="03-repo-map-desc">roboshop.yml is the main playbook. roles holds one folder per component plus common. inventory holds the dynamic AWS inventory and a static example. group_vars holds settings shared by every server and the encrypted vault. ansible.cfg sets defaults such as the SSH user and the key file. requirements.yml lists the extra module collections. terraform builds the servers. The Jenkinsfile runs everything. examples holds beginner playbooks and extras holds reference roles that are not deployed.</desc>
<rect width="720" height="470" fill="#ffffff"/>
<defs>
<marker id="03-repo-map-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="03-repo-map-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="03-repo-map-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="03-repo-map-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="03-repo-map-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="03-repo-map-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="335" height="76" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="182.5" y="41.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">roboshop.yml</text>
<text x="182.5" y="57.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">the main playbook: the run sheet</text>
<text x="182.5" y="73.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">data tier, then apps, then the website</text>
<rect x="370" y="12" width="335" height="76" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="537.5" y="41.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">roles/</text>
<text x="537.5" y="57.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">one recipe card per component</text>
<text x="537.5" y="73.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">plus common: the shared first steps</text>
<rect x="15" y="104" width="335" height="76" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="182.5" y="133.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">inventory/</text>
<text x="182.5" y="149.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">aws_ec2.yml: asks AWS for the server list</text>
<text x="182.5" y="165.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">hosts.example.ini: a hand-written list</text>
<rect x="370" y="104" width="335" height="76" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="537.5" y="133.0" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">group_vars/all/</text>
<text x="537.5" y="149.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">main.yml: settings every server shares</text>
<text x="537.5" y="165.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">vault.yml: the secrets, encrypted</text>
<rect x="15" y="196" width="335" height="76" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="182.5" y="225.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">ansible.cfg</text>
<text x="182.5" y="241.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">defaults: log in as rocky with roboshop.pem,</text>
<text x="182.5" y="257.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">use sudo, speed up SSH</text>
<rect x="370" y="196" width="335" height="76" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="537.5" y="225.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">requirements.yml</text>
<text x="537.5" y="241.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">extra toolkits to download first:</text>
<text x="537.5" y="257.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">AWS, MySQL, RabbitMQ and more</text>
<rect x="15" y="288" width="335" height="76" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="182.5" y="317.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">terraform/</text>
<text x="182.5" y="333.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">builds the servers, network and databases</text>
<text x="182.5" y="349.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">(the subject of its own article)</text>
<rect x="370" y="288" width="335" height="76" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="537.5" y="317.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Jenkinsfile</text>
<text x="537.5" y="333.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">the push-button pipeline:</text>
<text x="537.5" y="349.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">plan, build, deploy or delete</text>
<rect x="15" y="380" width="335" height="76" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="182.5" y="409.0" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">examples/basics/</text>
<text x="182.5" y="425.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">eight small practice playbooks</text>
<text x="182.5" y="441.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">for learning, not for the shop</text>
<rect x="370" y="380" width="335" height="76" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="537.5" y="409.0" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">extras/</text>
<text x="537.5" y="425.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">older roles kept for reference:</text>
<text x="537.5" y="441.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Jenkins, Docker, ELK, Prometheus</text>
</svg>
