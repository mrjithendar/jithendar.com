<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="06-role-anatomy-title 06-role-anatomy-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="06-role-anatomy-title">Inside one role: the catalogue recipe card and what it produces</title>
<desc id="06-role-anatomy-desc">The catalogue role is a folder. meta says the common role runs first, which creates the roboshop user and its folders. defaults says where the app lives. tasks lists the steps in order: install Node.js, copy the code, install dependencies, write the service file, start it. files holds the app&#x27;s code. templates holds the service file with blanks for the folder and the database address. handlers restarts the service, but only if something changed.</desc>
