<text x="258" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Second run: nothing to do</text>
<rect x="485" y="12" width="220" height="396" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
