<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="11-push-pull-title 11-push-pull-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="11-push-pull-title">Two ways to run the same playbook</title>
<desc id="11-push-pull-desc">Push is how this repository normally runs: the control machine connects out to every server with ansible-playbook. Pull is the alternative: a single server downloads the repository from GitHub with ansible-pull and runs the playbook on itself, told which component it is with roboshop_component=cart.</desc>
<rect width="720" height="360" fill="#ffffff"/>
<defs>
<marker id="11-push-pull-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="11-push-pull-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="11-push-pull-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="11-push-pull-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="11-push-pull-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="11-push-pull-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="335" height="336" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Push: ansible-playbook (the normal way)</text>
<rect x="370" y="12" width="335" height="336" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="378" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Pull: ansible-pull (one server helps itself)</text>
<polyline points="91.0,108 77.5,250" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#11-push-pull-sync)"/>
<polyline points="182.5,108 182.5,250" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#11-push-pull-sync)"/>
<polyline points="274.0,108 287.5,250" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#11-push-pull-sync)"/>
<polyline points="537.5,220 537.5,108" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#11-push-pull-sync)"/>
<rect x="30" y="44" width="305" height="64" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="182.5" y="75.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Control machine</text>
<text x="182.5" y="91.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">ansible-playbook roboshop.yml</text>
<rect x="30" y="250" width="95" height="44" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="77.5" y="279.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">cart</text>
<rect x="135" y="250" width="95" height="44" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="182.5" y="279.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">user</text>
<rect x="240" y="250" width="95" height="44" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="287.5" y="279.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">payment</text>
<rect x="385" y="44" width="305" height="64" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="537.5" y="75.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">GitHub</text>
<text x="537.5" y="91.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">github.com/mrjithendar/Ansible</text>
<rect x="385" y="220" width="305" height="104" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="537.5" y="247.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">The cart server</text>
<text x="537.5" y="263.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">downloads the repository, then runs</text>
<text x="537.5" y="279.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">roboshop.yml on itself with</text>
<text x="537.5" y="295.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">-e roboshop_component=cart</text>
<text x="537.5" y="311.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">(no control machine needed)</text>
<rect x="169.1" y="170.5" width="26.7" height="17" fill="#ffffff" opacity="0.92"/>
<text x="182.5" y="182.5" text-anchor="middle" font-size="12" fill="#0f172a">SSH</text>
<rect x="505.4" y="155.5" width="64.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="537.5" y="167.5" text-anchor="middle" font-size="12" fill="#0f172a">git clone</text>
</svg>
