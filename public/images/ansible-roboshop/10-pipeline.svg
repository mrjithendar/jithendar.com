<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="10-pipeline-title 10-pipeline-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="10-pipeline-title">One Jenkins job, four buttons</title>
<desc id="10-pipeline-desc">The Jenkins job asks for an ACTION. Plan checks the code and shows what Terraform would change. CreateInfra checks, plans, waits for a person to approve, builds the servers, builds the shipping app and runs Ansible. DeployApp skips Terraform and runs Ansible against the servers that already exist. DeleteInfra plans the removal, waits for approval and deletes everything. Every run ends by deleting the SSH key and the plan file.</desc>
