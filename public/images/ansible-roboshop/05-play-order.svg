<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="05-play-order-title 05-play-order-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="05-play-order-title">The playbook runs in four steps, so nothing starts before what it needs</title>
<desc id="05-play-order-desc">Step one checks every server: is it a known component, does it answer, and which group is it in. Step two sets up the data tier: MongoDB and RabbitMQ. Aurora MySQL and Redis are managed by AWS and built by Terraform, so Ansible only loads data into them. Step three sets up the five application services. Step four sets up the frontend website, which forwards requests to the services.</desc>
<rect width="720" height="500" fill="#ffffff"/>
<defs>
<marker id="05-play-order-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="05-play-order-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="05-play-order-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="05-play-order-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="05-play-order-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="05-play-order-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="690" height="88" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Step 1 · every server</text>
<rect x="15" y="112" width="690" height="110" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="128" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Step 2 · data tier</text>
<rect x="15" y="234" width="690" height="110" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="250" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Step 3 · application tier</text>
<rect x="15" y="356" width="690" height="88" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="372" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Step 4 · web tier</text>
<polyline points="360.0,88 360.0,140" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#05-play-order-sync)"/>
<polyline points="360.0,204 360.0,262" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#05-play-order-sync)"/>
<polyline points="360.0,326 360.0,380" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#05-play-order-sync)"/>
<rect x="30" y="36" width="660" height="52" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="360.0" y="61.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Check in</text>
<text x="360.0" y="77.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Is it a known component? Wait until it answers. Put it in its group.</text>
<rect x="30" y="140" width="210" height="64" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="135.0" y="163.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">mongodb</text>
<text x="135.0" y="179.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">database for products</text>
<text x="135.0" y="195.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">and user accounts</text>
<rect x="255" y="140" width="210" height="64" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="360.0" y="163.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">rabbitmq</text>
<text x="360.0" y="179.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">message queue for</text>
<text x="360.0" y="195.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">payments and orders</text>
<rect x="480" y="140" width="210" height="64" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="585.0" y="163.0" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Aurora MySQL + Redis</text>
<text x="585.0" y="179.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">managed by AWS,</text>
<text x="585.0" y="195.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">built by Terraform</text>
<rect x="30" y="262" width="126" height="64" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="93.0" y="285.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">catalogue</text>
<text x="93.0" y="301.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Node.js</text>
<text x="93.0" y="317.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">products</text>
<rect x="162" y="262" width="126" height="64" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="225.0" y="285.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">user</text>
<text x="225.0" y="301.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Node.js</text>
<text x="225.0" y="317.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">logins</text>
<rect x="294" y="262" width="126" height="64" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="357.0" y="285.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">cart</text>
<text x="357.0" y="301.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Node.js</text>
<text x="357.0" y="317.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">basket</text>
<rect x="426" y="262" width="126" height="64" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="489.0" y="285.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">shipping</text>
<text x="489.0" y="301.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Java</text>
<text x="489.0" y="317.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">delivery cost</text>
<rect x="558" y="262" width="126" height="64" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="621.0" y="285.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">payment</text>
<text x="621.0" y="301.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Python</text>
<text x="621.0" y="317.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">card payments</text>
<rect x="30" y="380" width="660" height="52" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="360.0" y="405.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">frontend · nginx</text>
<text x="360.0" y="421.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">The website customers open. It forwards /api/... requests to the five services.</text>
<text x="30" y="468" font-size="12" font-weight="600" fill="#475569">Each step finishes on every server before the next one begins.</text>
</svg>
