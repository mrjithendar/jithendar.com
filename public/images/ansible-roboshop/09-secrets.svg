<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="09-secrets-title 09-secrets-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="09-secrets-title">Where the passwords live, and where they never go</title>
<desc id="09-secrets-desc">Application passwords live in group_vars/all/vault.yml, which is encrypted, so Git only ever stores scrambled text. The password that unlocks it is a Jenkins credential. The Aurora database&#x27;s admin login is read from AWS Secrets Manager at run time. The SSH key is pulled from Terraform for the run and deleted afterwards. On the servers, secrets are written to files only root can read, and Ansible hides them from its log.</desc>
<rect width="720" height="470" fill="#ffffff"/>
<defs>
<marker id="09-secrets-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="09-secrets-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="09-secrets-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="09-secrets-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="09-secrets-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="09-secrets-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="260" height="446" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Stored safely</text>
<rect x="515" y="12" width="190" height="446" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="523" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">On each server</text>
<polyline points="260,76.0 305,194.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#09-secrets-dashed)"/>
<polyline points="260,176.0 305,218.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#09-secrets-dashed)"/>
<polyline points="260,276.0 305,242.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#09-secrets-dashed)"/>
<polyline points="260,384.0 305,266.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#09-secrets-dashed)"/>
<polyline points="485,230.0 525,230.0" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#09-secrets-write)"/>
<polyline points="610.0,274 610.0,320" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#09-secrets-sync)"/>
<rect x="30" y="40" width="230" height="72" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="145.0" y="67.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4c0519">vault.yml (in Git)</text>
<text x="145.0" y="83.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">app passwords, encrypted:</text>
<text x="145.0" y="99.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">scrambled text in Git</text>
<rect x="30" y="140" width="230" height="72" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="145.0" y="167.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Jenkins credential</text>
<text x="145.0" y="183.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">the password that</text>
<text x="145.0" y="199.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">unlocks vault.yml</text>
<rect x="30" y="240" width="230" height="72" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="145.0" y="267.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">AWS Secrets Manager</text>
<text x="145.0" y="283.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">rdscreds: the Aurora</text>
<text x="145.0" y="299.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">admin login</text>
<rect x="30" y="340" width="230" height="88" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="145.0" y="367.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">SSH key</text>
<text x="145.0" y="383.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">taken from Terraform</text>
<text x="145.0" y="399.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">for the run, then deleted</text>
<text x="145.0" y="415.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">(never committed)</text>
<rect x="305" y="170" width="180" height="120" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="395.0" y="205.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Ansible run</text>
<text x="395.0" y="221.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">unlocks secrets</text>
<text x="395.0" y="237.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">in memory only</text>
<text x="395.0" y="253.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155"></text>
<text x="395.0" y="269.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">no_log: hides them</text>
<rect x="525" y="186" width="170" height="88" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="610.0" y="213.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">/etc/roboshop/</text>
<text x="610.0" y="229.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">shipping.env etc.</text>
<text x="610.0" y="245.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">readable by root only</text>
<text x="610.0" y="261.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">(mode 0600)</text>
<rect x="525" y="320" width="170" height="72" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="610.0" y="347.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">The service</text>
<text x="610.0" y="363.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">reads its passwords</text>
<text x="610.0" y="379.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">when it starts</text>
<rect x="482.3" y="209.5" width="45.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="505.0" y="221.5" text-anchor="middle" font-size="12" fill="#0f172a">writes</text>
</svg>
