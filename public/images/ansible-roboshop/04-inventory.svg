<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="720" height="450" role="img" aria-labelledby="04-inventory-title 04-inventory-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="04-inventory-title">How Ansible finds the servers without a hand-written list</title>
<desc id="04-inventory-desc">Terraform creates one server per component and labels each one with tags such as Project = roboshop and Component = cart. The dynamic inventory file inventory/aws_ec2.yml asks AWS for every running server tagged Project = roboshop and turns each Component tag into a group. The cart group then gets the application-tier play, which applies the cart role.</desc>
<rect width="720" height="450" fill="#ffffff"/>
<defs>
<marker id="04-inventory-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="04-inventory-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="04-inventory-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="04-inventory-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="04-inventory-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="04-inventory-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="160" width="690" height="128" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="176" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Groups Ansible now knows about</text>
<polyline points="225,74.0 255,74.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#04-inventory-sync)"/>
<polyline points="465,74.0 495,74.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#04-inventory-sync)" marker-start="url(#04-inventory-sync)"/>
<polyline points="612.0,118 612.0,188" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#04-inventory-sync)"/>
<polyline points="612.0,274 612,306 180,306 180.0,330" fill="none" stroke="#be123c" stroke-width="2.2" marker-end="url(#04-inventory-async)"/>
<polyline points="345,370.0 375,370.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#04-inventory-sync)"/>
<rect x="15" y="30" width="210" height="88" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="120.0" y="57.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">Terraform</text>
<text x="120.0" y="73.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">creates the servers and</text>
<text x="120.0" y="89.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">labels each one:</text>
<text x="120.0" y="105.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Component = cart</text>
<rect x="255" y="30" width="210" height="88" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="360.0" y="57.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">AWS EC2</text>
<text x="360.0" y="73.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">8 running servers,</text>
<text x="360.0" y="89.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">each with a Project</text>
<text x="360.0" y="105.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">and a Component tag</text>
<rect x="495" y="30" width="210" height="88" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="600.0" y="57.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">inventory/aws_ec2.yml</text>
<text x="600.0" y="73.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">asks AWS: running,</text>
<text x="600.0" y="89.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Project = roboshop?</text>
<text x="600.0" y="105.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">groups by Component</text>
<rect x="30" y="188" width="156" height="38" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="108.0" y="214.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">frontend</text>
<rect x="198" y="188" width="156" height="38" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="276.0" y="214.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">catalogue</text>
<rect x="366" y="188" width="156" height="38" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="444.0" y="214.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">user</text>
<rect x="534" y="188" width="156" height="38" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="612.0" y="214.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">shipping</text>
<rect x="30" y="236" width="156" height="38" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="108.0" y="262.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">payment</text>
<rect x="198" y="236" width="156" height="38" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="276.0" y="262.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">mongodb</text>
<rect x="366" y="236" width="156" height="38" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="444.0" y="262.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">rabbitmq</text>
<rect x="534" y="236" width="156" height="38" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="612.0" y="262.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4c0519">cart</text>
<rect x="15" y="330" width="330" height="80" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="180.0" y="361.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Play: &quot;Application tier&quot;</text>
<text x="180.0" y="377.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">hosts: catalogue, user, cart,</text>
<text x="180.0" y="393.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">shipping, payment</text>
<rect x="375" y="330" width="330" height="80" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="540.0" y="361.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Role: cart</text>
<text x="540.0" y="377.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">install Node.js, copy the code,</text>
<text x="540.0" y="393.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">start the cart service</text>
<rect x="217.3" y="65.5" width="45.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="240.0" y="77.5" text-anchor="middle" font-size="12" fill="#0f172a">builds</text>
<rect x="451.0" y="65.5" width="57.9" height="17" fill="#ffffff" opacity="0.92"/>
<text x="480.0" y="77.5" text-anchor="middle" font-size="12" fill="#0f172a">the list</text>
<rect x="555.0" y="144.5" width="114.1" height="17" fill="#ffffff" opacity="0.92"/>
<text x="612.0" y="156.5" text-anchor="middle" font-size="12" fill="#0f172a">one group per tag</text>
<rect x="274.9" y="297.5" width="201.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="375.6" y="309.5" text-anchor="middle" font-size="12" fill="#0f172a">the cart server joins this play</text>
<rect x="334.2" y="361.5" width="51.7" height="17" fill="#ffffff" opacity="0.92"/>
<text x="360.0" y="373.5" text-anchor="middle" font-size="12" fill="#0f172a">applies</text>
</svg>
