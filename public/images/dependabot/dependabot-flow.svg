<text x="665.0" y="323.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">then one minor + patch group per directory</text>
<text x="665.0" y="339.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">majors arrive one PR each</text>
