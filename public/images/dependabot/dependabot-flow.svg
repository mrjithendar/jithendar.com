<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 750" width="900" height="750" role="img" aria-labelledby="dependabot-flow-title dependabot-flow-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="dependabot-flow-title">How a dependency update travels from GitHub to a running system in my repositories</title>
<desc id="dependabot-flow-desc">Two things start Dependabot. A new advisory in the GitHub Advisory Database that matches the dependency graph raises a Dependabot alert. If a fixed version is reachable, Dependabot opens a security update PR for that one package, with no cooldown and no grouping; if the parent package pins the vulnerable range, the fix is made by hand with npm overrides or the alert is dismissed with a reason. The weekly schedule, Monday 06:00 New York time, starts a version update run that reads .github/dependabot.yml, skips releases younger than the 3-day cooldown and versions matched by ignore rules, and opens grouped PRs: family groups first, then one minor and patch group per directory, with each major version in its own PR. Every PR runs CI on its branch with a read-only token and no repository secrets. A failing PR gets an ignore rule and @dependabot recreate. A passing PR is reviewed by a person, because there is no auto-merge, and merging to master deploys: jithendar.com and MOKS release an image, Argo CD syncs miniKube, and tools applies Terraform.</desc>
