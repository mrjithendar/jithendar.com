<text x="345.0" y="323.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">npm overrides by hand</text>
<text x="345.0" y="339.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">or dismiss with a reason</text>
