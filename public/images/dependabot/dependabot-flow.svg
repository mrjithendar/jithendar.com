<text x="130.0" y="323.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">no cooldown, not grouped</text>
<text x="130.0" y="339.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">same labels and prefix</text>
<rect x="245" y="262" width="200" height="92" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
