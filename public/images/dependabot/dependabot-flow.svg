<text x="665.0" y="225.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">ignore: database majors, runtimes, known breaks</text>
<rect x="30" y="262" width="200" height="92" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
