<svg xmlns="http://www.w3.org/2000/svg" width="960" height="586" viewBox="0 0 960 586"><defs><marker id="arrow0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker><marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
<rect width="960" height="586" fill="#ffffff"/>
<rect x="20" y="50" width="920" height="440" rx="6" fill="#faf5ff" stroke="#6d28d9" stroke-width="1" stroke-dasharray="6 4"/>
<text x="32" y="69" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6d28d9" font-weight="bold" text-anchor="start">4 · Learning loop: an analyst reads saved runs and proposes changes to the harness</text>
<rect x="40" y="85" width="880" height="300" rx="6" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
<text x="52" y="104" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569" font-weight="bold" text-anchor="start">3 · Event-driven loop: a chat mention, a ticket change or a schedule starts a run</text>
<rect x="60" y="190" width="840" height="185" rx="6" fill="#f8fafc" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="6 4"/>
<text x="888" y="209" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1d4ed8" font-weight="bold" text-anchor="end">2 · Verification loop: a grader checks the output against a rubric and sends failures back</text>
<rect x="80" y="225" width="470" height="130" rx="6" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
<text x="538" y="244" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569" font-weight="bold" text-anchor="end">1 · Agent loop (cap on model turns)</text>
<path d="M195,175 L195,260" fill="none" stroke="#be123c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arrow0)"/>
<rect x="155.36" y="209.5" width="79.28" height="16" fill="#ffffff"/>
<text x="195" y="221.5" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">starts a run</text>
<path d="M290,300 L340,300" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow1)" marker-start="url(#arrow1)"/>
<path d="M530,300 L620,300" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow1)"/>
<rect x="553.18" y="292" width="43.64" height="16" fill="#ffffff"/>
<text x="575" y="304" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">output</text>
<path d="M750,340 L750,364 L195,364 L195,340" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow1)"/>
<rect x="397.22" y="356" width="150.56" height="16" fill="#ffffff"/>
<text x="472.5" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">gaps go back as feedback</text>
<path d="M290,437.5 L340,437.5" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="2 3" marker-end="url(#arrow2)"/>
<path d="M530,437.5 L710,437.5" fill="none" stroke="#b45309" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="2 3" marker-end="url(#arrow2)"/>
<rect x="592.24" y="429.5" width="55.52" height="16" fill="#ffffff"/>
<text x="620" y="441.5" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">proposes</text>
<path d="M815,400 L815,340" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="8 4" marker-end="url(#arrow3)"/>
<rect x="784.27" y="362" width="61.46" height="16" fill="#ffffff"/>
<text x="815" y="374" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">next runs</text>
<text x="20" y="27" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start">Four loops around an agent: each loop wraps the ones inside it</text>
<rect x="100" y="115" width="190" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="195" y="141" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Event</text>
<text x="195" y="157" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">mention, ticket, schedule</text>
<text x="330" y="139" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start">An agent on a laptop has no address an event source can call. A tunnel or a deployed endpoint</text>
<text x="330" y="152.2" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start">gives it one.</text>
<rect x="100" y="260" width="190" height="80" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="195" y="288" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Model</text>
<text x="195" y="304" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">picks the next tool call,</text>
<text x="195" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">reads the result</text>
<rect x="340" y="260" width="190" height="80" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="435" y="288" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Tools</text>
<text x="435" y="304" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">files, APIs, search:</text>
<text x="435" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">run and return results</text>
<rect x="620" y="260" width="260" height="80" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="750" y="288" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Grader</text>
<text x="750" y="304" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">pass or fail per criterion,</text>
<text x="750" y="320" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">names each gap</text>
<rect x="100" y="400" width="190" height="75" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="195" y="425.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Saved runs</text>
<text x="195" y="441.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">outputs and the</text>
<text x="195" y="457.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">grader&#x27;s reviews</text>
<rect x="340" y="400" width="190" height="75" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="435" y="425.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Analyst</text>
<text x="435" y="441.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">finds gaps that recur</text>
<text x="435" y="457.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">across many runs</text>
<rect x="710" y="400" width="210" height="75" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="815" y="425.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Harness change</text>
<text x="815" y="441.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">instructions, tools,</text>
<text x="815" y="457.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">grader rubric</text>
<text x="20" y="516" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start">Legend</text>
<rect x="90" y="506" width="22" height="14" rx="3" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="120" y="517" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Code you write</text>
<rect x="230.08" y="506" width="22" height="14" rx="3" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="260.08" y="517" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Saved results</text>
<rect x="363.44" y="506" width="22" height="14" rx="3" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="393.44" y="517" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Model or agent</text>
<rect x="503.52" y="506" width="22" height="14" rx="3" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="533.52" y="517" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Harness change</text>
<rect x="643.6" y="506" width="22" height="14" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="673.6" y="517" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Where work already happens</text>
<rect x="90" y="530" width="22" height="14" rx="3" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="120" y="541" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Grader or decision</text>
<line x1="256.96" y1="537" x2="280.96" y2="537" stroke="#475569" stroke-width="1.5"/>
<text x="286.96" y="541" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Request and response</text>
<line x1="437.36" y1="537" x2="461.36" y2="537" stroke="#be123c" stroke-width="2" stroke-dasharray="6 4"/>
<text x="467.36" y="541" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Message or event</text>
<line x1="590.88" y1="537" x2="614.88" y2="537" stroke="#b45309" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="620.88" y="541" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Scheduled or manual transfer</text>
<line x1="90" y1="561" x2="114" y2="561" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="8 4"/>
<text x="120" y="565" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Deploy, approve or observe</text>
</svg>
