<text x="260.08" y="393" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Saved results</text>
<rect x="363.44" y="382" width="22" height="14" rx="3" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="393.44" y="393" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Model or agent</text>
<rect x="503.52" y="382" width="22" height="14" rx="3" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="533.52" y="393" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Harness change</text>
<rect x="643.6" y="382" width="22" height="14" rx="3" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="673.6" y="393" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Grader or decision</text>
<line x1="90" y1="413" x2="114" y2="413" stroke="#475569" stroke-width="1.5"/>
<text x="120" y="417" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Request and response</text>
<line x1="270.4" y1="413" x2="294.4" y2="413" stroke="#b45309" stroke-width="1.5" stroke-dasharray="2 3"/>
<text x="300.4" y="417" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Scheduled or manual transfer</text>
<line x1="504.56" y1="413" x2="528.56" y2="413" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="8 4"/>
<text x="534.56" y="417" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="start">Deploy, approve or observe</text>
