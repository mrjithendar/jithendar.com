<rect x="550.66" y="312" width="138.68" height="16" fill="#ffffff"/>
<text x="620" y="324" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle">compared per criterion</text>
<text x="20" y="27" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#0f172a" font-weight="bold" text-anchor="start">Learning loop: change the instructions only when first drafts get better</text>
<rect x="20" y="60" width="180" height="90" rx="8" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
<text x="110" y="93" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Saved reviews</text>
<text x="110" y="109" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">the grader&#x27;s results</text>
<text x="110" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">from earlier runs</text>
<rect x="250" y="60" width="180" height="90" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
<text x="340" y="93" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Analyst</text>
<text x="340" y="109" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">finds gaps that recur</text>
<text x="340" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">across runs</text>
<rect x="480" y="60" width="190" height="90" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<text x="575" y="93" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Proposed instructions</text>
<text x="575" y="109" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">one change per</text>
<text x="575" y="125" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">recurring gap</text>
<rect x="250" y="200" width="180" height="90" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="340" y="225" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">First drafts: before</text>
<text x="340" y="241" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">the same 5 requirements,</text>
<text x="340" y="257" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">original instructions</text>
<text x="340" y="273" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">script: 5/15 checks</text>
<rect x="480" y="200" width="190" height="90" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
<text x="575" y="225" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">First drafts: after</text>
<text x="575" y="241" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">the same 5 requirements,</text>
<text x="575" y="257" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">proposed instructions</text>
<text x="575" y="273" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">script: 15/15 checks</text>
<rect x="740" y="130" width="200" height="100" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="840" y="168" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a" font-weight="bold" text-anchor="middle">Decision record</text>
<text x="840" y="184" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">update or keep, the reason,</text>
<text x="840" y="200" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle">the comparison, the outcome</text>
<text x="20" y="347" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start">The script adopts a proposal only if the total goes up and no criterion gets worse. The verification loop still runs; the learning loop makes its first</text>
<text x="20" y="360.2" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start">attempt pass more often.</text>
<text x="20" y="392" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a" font-weight="bold" text-anchor="start">Legend</text>
