<rect x="30" y="36" width="250" height="70" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="155.0" y="62.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Git repository</text>
<text x="155.0" y="78.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">apps, charts, overlays</text>
<text x="155.0" y="94.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">policies and NodePools too</text>
<rect x="325" y="36" width="250" height="70" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="450.0" y="62.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Argo CD or Flux</text>
<text x="450.0" y="78.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">renders Helm or Kustomize</text>
<text x="450.0" y="94.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">applies and reverts drift</text>
<rect x="620" y="36" width="250" height="70" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="745.0" y="62.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">kube-apiserver</text>
<text x="745.0" y="78.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">admission: Kyverno accepts,</text>
<text x="745.0" y="94.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">mutates or rejects each write</text>
<rect x="30" y="156" width="250" height="70" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="155.0" y="190.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Users</text>
<text x="155.0" y="206.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">HTTPS</text>
<rect x="325" y="156" width="250" height="70" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.4"/>
<text x="450.0" y="182.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">Cloud load balancer</text>
<text x="450.0" y="198.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">NLB on EKS, NodePort + proxy</text>
<text x="450.0" y="214.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">on a self-managed host</text>
<rect x="620" y="156" width="250" height="70" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.4"/>
<text x="745.0" y="182.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">Ingress or Gateway API</text>
<text x="745.0" y="198.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Istio, Traefik, Envoy Gateway</text>
<text x="745.0" y="214.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">TLS Secret from cert-manager</text>
<rect x="30" y="276" width="395" height="98" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="227.5" y="308.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Workload pods</text>
<text x="227.5" y="324.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">mesh proxy per pod (sidecar) or per node</text>
<text x="227.5" y="340.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">(ambient ztunnel, Linkerd has sidecars only)</text>
<text x="227.5" y="356.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">mTLS, retries, canary weights</text>
<rect x="475" y="276" width="395" height="98" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="672.5" y="308.0" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">Cilium on every node</text>
<text x="672.5" y="324.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">eBPF pod network and Service load balancing</text>
<text x="672.5" y="340.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">NetworkPolicy and CiliumNetworkPolicy</text>
<text x="672.5" y="356.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Hubble: who talked to whom</text>
<rect x="30" y="394" width="260" height="98" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
