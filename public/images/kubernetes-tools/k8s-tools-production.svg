<text x="557.5" y="593.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">routes alerts</text>
<text x="557.5" y="609.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">to on-call</text>
<rect x="675" y="546" width="195" height="80" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="772.5" y="577.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4c0519">Velero</text>
<text x="772.5" y="593.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">objects + volumes</text>
<text x="772.5" y="609.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">→ object storage</text>
<rect x="30" y="676" width="260" height="80" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="160.0" y="707.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">ACME CA</text>
<text x="160.0" y="723.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Let&#x27;s Encrypt</text>
<text x="160.0" y="739.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">issues certificates</text>
<rect x="320" y="676" width="260" height="80" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="450.0" y="707.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Object storage</text>
<text x="450.0" y="723.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">S3, R2, GCS</text>
<text x="450.0" y="739.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">backups land here</text>
<rect x="610" y="676" width="260" height="80" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="740.0" y="707.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Operators</text>
<text x="740.0" y="723.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">kubectl, K9s, Lens</text>
<text x="740.0" y="739.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">read through RBAC</text>
<rect x="577.9" y="50.5" width="39.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="597.5" y="62.5" text-anchor="middle" font-size="12" fill="#0f172a">apply</text>
<rect x="569.2" y="422.5" width="51.7" height="17" fill="#ffffff" opacity="0.92"/>
<text x="595.0" y="434.5" text-anchor="middle" font-size="12" fill="#0f172a">Pending</text>
