<text x="160.0" y="442.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">reads queue depth, lag,</text>
<text x="160.0" y="458.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">PromQL or cron</text>
<text x="160.0" y="474.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">feeds an HPA</text>
<rect x="320" y="394" width="260" height="98" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="450.0" y="426.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">HorizontalPodAutoscaler</text>
<text x="450.0" y="442.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">sets replicas</text>
<text x="450.0" y="458.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">new pods may be Pending</text>
<text x="450.0" y="474.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">when nodes are full</text>
<rect x="610" y="394" width="260" height="98" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="740.0" y="426.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">Karpenter</text>
<text x="740.0" y="442.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Pending pods → NodeClaim</text>
<text x="740.0" y="458.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">→ EC2 instance</text>
<text x="740.0" y="474.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">consolidates idle nodes</text>
<rect x="30" y="546" width="195" height="80" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.4"/>
<text x="127.5" y="577.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">cert-manager</text>
<text x="127.5" y="593.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">ACME HTTP-01 / DNS-01</text>
<text x="127.5" y="609.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">renews before expiry</text>
<rect x="245" y="546" width="195" height="80" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="342.5" y="577.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">Prometheus</text>
<text x="342.5" y="593.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">scrapes nodes, pods,</text>
<text x="342.5" y="609.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">mesh, KEDA, Karpenter</text>
<rect x="460" y="546" width="195" height="80" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
