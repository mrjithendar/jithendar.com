<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" role="img" aria-labelledby="k8s-tools-production-title k8s-tools-production-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="k8s-tools-production-title">How the 15 tools fit one production platform: change path, request path and telemetry</title>
<desc id="k8s-tools-production-desc">Three flows run through the platform. Change path, in amber: a commit in Git is rendered by Argo CD or Flux with Helm or Kustomize and applied to the Kubernetes API, where Kyverno admission policies accept, mutate or reject it. Request path, in grey: users reach a cloud load balancer, then an Ingress or Gateway API gateway whose TLS certificate cert-manager obtains from an ACME issuer, then pods. Inside the cluster Cilium provides the pod network, NetworkPolicy and Hubble flow logs, and an optional mesh, Istio or Linkerd, adds mutual TLS, retries and traffic splitting. KEDA feeds event metrics to an HPA; when new pods cannot be scheduled, Karpenter launches nodes from NodePools. Telemetry, dashed: Prometheus scrapes nodes, pods and mesh proxies and sends alerts to Alertmanager. Velero copies API objects and volume data to object storage. K9s and Lens are operator tools outside the request path.</desc>
<rect width="900" height="780" fill="#ffffff"/>
