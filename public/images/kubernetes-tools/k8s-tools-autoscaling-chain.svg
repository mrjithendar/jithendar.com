<polyline points="440,95.0 460,95.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#k8s-tools-autoscaling-chain-sync)"/>
<polyline points="655,95.0 675,95.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#k8s-tools-autoscaling-chain-sync)"/>
<polyline points="772.5,150 772.5,224" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#k8s-tools-autoscaling-chain-sync)"/>
<polyline points="675,279.0 655,279.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#k8s-tools-autoscaling-chain-sync)"/>
<polyline points="460,279.0 440,279.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#k8s-tools-autoscaling-chain-sync)"/>
