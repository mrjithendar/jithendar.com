<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="k8s-tools-autoscaling-chain-title k8s-tools-autoscaling-chain-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="k8s-tools-autoscaling-chain-title">From a queue backlog to a new node: KEDA scales pods, Karpenter scales nodes</title>
<desc id="k8s-tools-autoscaling-chain-desc">Messages pile up in a RabbitMQ queue. The KEDA operator polls the queue through its scaler and, through the external metrics API served by keda-operator-metrics-apiserver, feeds an HPA named keda-hpa-&lt;name&gt; that it creates and owns. The HPA raises the Deployment&#x27;s replicas between minReplicaCount and maxReplicaCount. If no node has room, the new pods stay Pending. Karpenter watches unschedulable pods, picks instance types allowed by a NodePool and its EC2NodeClass, creates a NodeClaim and launches an EC2 instance, which joins the cluster so the scheduler can bind the pods. When the queue drains, the HPA scales down after its stabilization window and Karpenter consolidates empty or underused nodes within the NodePool&#x27;s disruption budgets.</desc>
<rect width="900" height="540" fill="#ffffff"/>
<defs>
<marker id="k8s-tools-autoscaling-chain-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="k8s-tools-autoscaling-chain-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="k8s-tools-autoscaling-chain-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="k8s-tools-autoscaling-chain-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="k8s-tools-autoscaling-chain-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="k8s-tools-autoscaling-chain-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
