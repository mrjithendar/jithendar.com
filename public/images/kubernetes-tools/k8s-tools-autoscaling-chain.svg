<text x="23" y="212" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Node scaling: Karpenter</text>
<rect x="15" y="380" width="870" height="148" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="396" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Scale down</text>
