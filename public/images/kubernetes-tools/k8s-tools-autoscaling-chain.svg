<rect x="30" y="40" width="195" height="110" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="127.5" y="78.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4c0519">RabbitMQ queue</text>
<text x="127.5" y="94.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">roboshop.shipping.orders</text>
<text x="127.5" y="110.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">backlog grows</text>
<text x="127.5" y="126.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">e.g. 120 messages</text>
<rect x="245" y="40" width="195" height="110" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="342.5" y="78.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">KEDA operator</text>
<text x="342.5" y="94.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">polls every 15 s</text>
<text x="342.5" y="110.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">metrics API server</text>
<text x="342.5" y="126.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">exposes the value</text>
<rect x="460" y="40" width="195" height="110" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="557.5" y="78.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">HPA keda-hpa-*</text>
<text x="557.5" y="94.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">owned by KEDA</text>
<text x="557.5" y="110.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">target 20 per replica</text>
<text x="557.5" y="126.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">→ wants 6, max 4</text>
<rect x="675" y="40" width="195" height="110" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="772.5" y="78.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Deployment</text>
<text x="772.5" y="94.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">replicas 1 → 4</text>
<text x="772.5" y="110.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">new pods created</text>
<text x="772.5" y="126.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">scheduler runs</text>
<rect x="30" y="224" width="195" height="110" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="127.5" y="262.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">EC2 instance</text>
<text x="127.5" y="278.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">joins as a node</text>
<text x="127.5" y="294.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">scheduler binds</text>
<text x="127.5" y="310.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">the Pending pods</text>
<rect x="245" y="224" width="195" height="110" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="342.5" y="262.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">NodeClaim</text>
<text x="342.5" y="278.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">one per launch</text>
<text x="342.5" y="294.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">status shows</text>
<text x="342.5" y="310.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">launch errors</text>
<rect x="460" y="224" width="195" height="110" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="557.5" y="262.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">Karpenter</text>
<text x="557.5" y="278.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">batches Pending pods</text>
<text x="557.5" y="294.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">fits NodePool rules</text>
<text x="557.5" y="310.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">cheapest that fits</text>
<rect x="675" y="224" width="195" height="110" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="772.5" y="262.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Pending pods</text>
<text x="772.5" y="278.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">no node has room</text>
<text x="772.5" y="294.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">FailedScheduling</text>
<text x="772.5" y="310.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">event on each pod</text>
<rect x="30" y="404" width="400" height="108" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="230.0" y="441.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Pods</text>
<text x="230.0" y="457.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">queue drains; the HPA waits out</text>
<text x="230.0" y="473.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">its scale-down stabilization window</text>
<text x="230.0" y="489.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">cooldownPeriod applies only to 1 → 0</text>
<rect x="470" y="404" width="400" height="108" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="670.0" y="441.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">Nodes</text>
<text x="670.0" y="457.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Karpenter consolidates empty or</text>
<text x="670.0" y="473.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">underused nodes, one budget at a time</text>
<text x="670.0" y="489.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">PodDisruptionBudgets still apply</text>
</svg>
