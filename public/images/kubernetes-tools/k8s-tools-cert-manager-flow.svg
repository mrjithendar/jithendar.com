<polyline points="740.0,334 740.0,386" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#k8s-tools-cert-manager-flow-dashed)"/>
<polyline points="450.0,334 450,334 450,356 520,356 520.0,386" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#k8s-tools-cert-manager-flow-dashed)"/>
<polyline points="470,418.0 310,418 310.0,502" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#k8s-tools-cert-manager-flow-write)"/>
