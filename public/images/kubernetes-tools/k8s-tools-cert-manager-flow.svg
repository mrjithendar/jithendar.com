<rect x="30" y="36" width="400" height="62" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.4"/>
<text x="230.0" y="58.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">Ingress or Gateway</text>
<text x="230.0" y="74.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">annotation cert-manager.io/cluster-issuer</text>
<text x="230.0" y="90.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">cert-manager creates the Certificate</text>
<rect x="470" y="36" width="400" height="62" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.4"/>
<text x="670.0" y="66.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">or write a Certificate yourself</text>
<text x="670.0" y="82.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">dnsNames, secretName, issuerRef</text>
<rect x="30" y="148" width="260" height="80" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="160.0" y="179.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Certificate</text>
<text x="160.0" y="195.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">desired: names, Secret,</text>
<text x="160.0" y="211.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">duration, renewBefore</text>
<rect x="320" y="148" width="260" height="80" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="450.0" y="179.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">CertificateRequest</text>
<text x="450.0" y="195.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">a CSR signed by the</text>
<text x="450.0" y="211.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">new private key</text>
<rect x="610" y="148" width="260" height="80" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="740.0" y="179.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Order (ACME)</text>
<text x="740.0" y="195.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">one per request</text>
<text x="740.0" y="211.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">lists the challenges</text>
<rect x="320" y="248" width="260" height="86" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="450.0" y="282.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">HTTP-01 Challenge</text>
<text x="450.0" y="298.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">solver pod + temporary route</text>
<text x="450.0" y="314.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">public port 80 must reach it</text>
<rect x="610" y="248" width="260" height="86" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="740.0" y="282.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">DNS-01 Challenge</text>
<text x="740.0" y="298.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">TXT _acme-challenge.&lt;name&gt;</text>
<text x="740.0" y="314.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">needs DNS API token; wildcards</text>
<rect x="470" y="386" width="400" height="64" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="670.0" y="417.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Let&#x27;s Encrypt (ACME)</text>
<text x="670.0" y="433.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">validates the challenge, signs the certificate</text>
<rect x="30" y="502" width="400" height="74" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="230.0" y="530.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">Secret type kubernetes.io/tls</text>
<text x="230.0" y="546.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">tls.crt + tls.key, same name as</text>
<text x="230.0" y="562.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">secretName / certificateRefs</text>
<rect x="470" y="502" width="400" height="74" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.4"/>
<text x="670.0" y="530.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">Ingress controller or gateway</text>
<text x="670.0" y="546.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">serves the new certificate;</text>
<text x="670.0" y="562.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">renewal at 2/3 of lifetime by default</text>
<rect x="325.3" y="397.5" width="45.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="348.0" y="409.5" text-anchor="middle" font-size="12" fill="#0f172a">signed</text>
<rect x="116.4" y="397.6" width="39.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="136.0" y="409.6" text-anchor="middle" font-size="12" fill="#0f172a">renew</text>
</svg>
