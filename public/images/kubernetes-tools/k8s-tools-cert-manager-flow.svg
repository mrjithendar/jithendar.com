<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="k8s-tools-cert-manager-flow-title k8s-tools-cert-manager-flow-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="k8s-tools-cert-manager-flow-title">How cert-manager obtains and renews a Let&#x27;s Encrypt certificate</title>
<desc id="k8s-tools-cert-manager-flow-desc">An Ingress or Gateway annotated with a ClusterIssuer, or a Certificate written by hand, starts the flow. cert-manager creates a private key Secret and a CertificateRequest. For an ACME issuer it creates an Order and one Challenge per DNS name. With HTTP-01 it starts a solver pod and a temporary route so Let&#x27;s Encrypt can fetch a token from http://&lt;domain&gt;/.well-known/acme-challenge/; with DNS-01 it writes a TXT record at _acme-challenge.&lt;domain&gt; through a DNS provider API, which also supports wildcards. After validation Let&#x27;s Encrypt signs the certificate and cert-manager stores it in a kubernetes.io/tls Secret that the ingress controller or gateway serves. By default renewal starts two thirds of the way through the certificate&#x27;s lifetime and repeats the same flow.</desc>
<rect width="900" height="600" fill="#ffffff"/>
<defs>
<marker id="k8s-tools-cert-manager-flow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="k8s-tools-cert-manager-flow-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="k8s-tools-cert-manager-flow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="k8s-tools-cert-manager-flow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="k8s-tools-cert-manager-flow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="k8s-tools-cert-manager-flow-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="870" height="96" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">You declare</text>
<rect x="15" y="124" width="870" height="222" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="140" text-anchor="start" font-size="12" font-weight="600" fill="#475569">cert-manager controllers</text>
<rect x="15" y="362" width="870" height="100" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="378" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Outside</text>
<rect x="15" y="478" width="870" height="110" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="494" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Result</text>
<polyline points="160.0,98 160.0,148" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#k8s-tools-cert-manager-flow-sync)"/>
<polyline points="520.0,98 520,116 238,116 238.0,148" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#k8s-tools-cert-manager-flow-sync)"/>
<polyline points="290,188.0 320,188.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#k8s-tools-cert-manager-flow-sync)"/>
<polyline points="580,188.0 610,188.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#k8s-tools-cert-manager-flow-sync)"/>
<polyline points="740.0,228 740.0,248" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#k8s-tools-cert-manager-flow-sync)"/>
