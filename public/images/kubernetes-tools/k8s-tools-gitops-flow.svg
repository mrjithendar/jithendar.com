<text x="23" y="148" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Argo CD, namespace argocd</text>
<rect x="15" y="354" width="870" height="76" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="370" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Kubernetes API</text>
