<polyline points="470,71.0 430,71.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#k8s-tools-gitops-flow-dashed)"/>
<polyline points="290,192.8 320,192.8" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#k8s-tools-gitops-flow-sync)"/>
<polyline points="610,192.8 580,192.8" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#k8s-tools-gitops-flow-dashed)"/>
