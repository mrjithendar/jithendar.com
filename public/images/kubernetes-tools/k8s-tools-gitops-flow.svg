<rect x="30" y="36" width="400" height="70" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="230.0" y="62.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">GitHub repository</text>
<text x="230.0" y="78.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Applications, charts/, overlays/</text>
<text x="230.0" y="94.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">every change is a reviewed commit</text>
<rect x="470" y="36" width="400" height="70" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="670.0" y="62.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">CI pipeline</text>
<text x="670.0" y="78.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">builds and pushes the image</text>
<text x="670.0" y="94.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">may commit the new tag back to Git</text>
<rect x="30" y="156" width="260" height="92" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="160.0" y="185.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">argocd-repo-server</text>
<text x="160.0" y="201.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">clones Git, runs helm template</text>
<text x="160.0" y="217.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">or kustomize build</text>
<text x="160.0" y="233.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">output: plain manifests</text>
<rect x="320" y="156" width="260" height="92" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="450.0" y="185.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">application-controller</text>
<text x="450.0" y="201.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">diffs rendered vs live objects</text>
<text x="450.0" y="217.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Synced / OutOfSync + health</text>
<text x="450.0" y="233.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">applies on sync: manual or auto</text>
<rect x="610" y="156" width="260" height="92" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="740.0" y="185.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">argocd-server</text>
<text x="740.0" y="201.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">UI, API and CLI endpoint</text>
<text x="740.0" y="217.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">SSO, projects, RBAC</text>
<text x="740.0" y="233.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">diff and sync history</text>
<rect x="30" y="262" width="260" height="64" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="160.0" y="285.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">ApplicationSet controller</text>
<text x="160.0" y="301.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">creates Applications from</text>
<text x="160.0" y="317.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">lists, Git dirs or clusters</text>
<rect x="30" y="376" width="840" height="46" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="450.0" y="398.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">kube-apiserver</text>
<text x="450.0" y="414.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">stores objects; admission webhooks (Kyverno, cert-manager, mesh injectors) run on every write</text>
<rect x="30" y="470" width="400" height="80" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="230.0" y="501.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Workloads</text>
<text x="230.0" y="517.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Deployments, Services, ConfigMaps</text>
<text x="230.0" y="533.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">what Git declares</text>
<rect x="470" y="470" width="400" height="80" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="670.0" y="493.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Drift</text>
<text x="670.0" y="509.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">kubectl edit, scale, hot fixes</text>
<text x="670.0" y="525.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">selfHeal reverts fields Git owns</text>
<text x="670.0" y="541.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">HPA-owned replicas need ignoreDifferences</text>
<rect x="167.9" y="108.8" width="64.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="200.0" y="120.8" text-anchor="middle" font-size="12" fill="#0f172a">git fetch</text>
<rect x="414.8" y="50.5" width="70.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="450.0" y="62.5" text-anchor="middle" font-size="12" fill="#0f172a">tag commit</text>
<rect x="460.4" y="303.5" width="39.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="480.0" y="315.5" text-anchor="middle" font-size="12" fill="#0f172a">apply</text>
<rect x="389.8" y="489.5" width="120.3" height="17" fill="#ffffff" opacity="0.92"/>
<text x="450.0" y="501.5" text-anchor="middle" font-size="12" fill="#0f172a">changes live state</text>
<text x="15" y="592" font-size="12" fill="#475569">Flux runs the same loop as controllers: source-controller fetches, kustomize-controller and</text>
<text x="15" y="610" font-size="12" fill="#475569">helm-controller apply. Pick one controller per workload; two would fight over the same objects.</text>
</svg>
