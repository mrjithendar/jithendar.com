<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="k8s-tools-gitops-flow-title k8s-tools-gitops-flow-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="k8s-tools-gitops-flow-title">How Argo CD turns a Git commit into running workloads, and how drift is detected</title>
<desc id="k8s-tools-gitops-flow-desc">A GitHub repository holds Applications, Helm charts and Kustomize overlays; CI builds and pushes images and may commit a new tag. In namespace argocd, the repo-server clones Git and renders manifests with helm template or kustomize build. The application-controller compares the rendered manifests with live objects, reports Synced or OutOfSync and a health status, and applies changes through the Kubernetes API on a manual or automated sync. argocd-server serves the UI, API, CLI, SSO and RBAC. The ApplicationSet controller generates Applications from lists, Git directories or registered clusters. Changes made directly in the cluster, such as kubectl edit, are drift; selfHeal reverts fields that Git owns. Flux runs the same loop with source-, kustomize- and helm-controller and no built-in UI.</desc>
<rect width="900" height="640" fill="#ffffff"/>
<defs>
<marker id="k8s-tools-gitops-flow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="k8s-tools-gitops-flow-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="k8s-tools-gitops-flow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="k8s-tools-gitops-flow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="k8s-tools-gitops-flow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="k8s-tools-gitops-flow-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
