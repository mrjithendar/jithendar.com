<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="k8s-tools-prometheus-flow-title k8s-tools-prometheus-flow-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="k8s-tools-prometheus-flow-title">How Prometheus discovers, scrapes, stores and alerts on Kubernetes metrics</title>
<desc id="k8s-tools-prometheus-flow-desc">Targets expose metrics over HTTP: the kubelet and cAdvisor for nodes and containers, applications on their own /metrics endpoint, and exporters such as kube-state-metrics for object state like restarts. kubernetes_sd_configs asks the API for nodes, pods or EndpointSlices and relabel rules pick the targets; the optional Prometheus Operator turns ServiceMonitor and PodMonitor objects into that scrape configuration. Prometheus pulls every target on its scrape interval, stores samples in its local TSDB, evaluates recording and alerting rules, and can remote_write to long-term storage. Alertmanager groups and routes alerts to people; Grafana queries PromQL for dashboards. Logs and traces travel through separate systems such as Loki and Jaeger.</desc>
