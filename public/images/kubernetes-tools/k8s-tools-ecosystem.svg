<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-labelledby="k8s-tools-ecosystem-title k8s-tools-ecosystem-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="k8s-tools-ecosystem-title">The 15 Kubernetes tools in this series, grouped by the problem each one solves</title>
<desc id="k8s-tools-ecosystem-desc">Five rows group the tools. Deliver: Helm 4.3, Kustomize 5.8, Argo CD 3.6 and Flux 2.10. Operate and observe: kubectl as the baseline, K9s 0.51, Lens from Mirantis and Prometheus 3.16. These two rows are Part 1. Scale: KEDA 2.21 and Karpenter 1.15, with the built-in HPA and Cluster Autoscaler as alternatives. Connect: Cilium 1.20, Istio 1.31 and Linkerd 2.20. Secure and recover: cert-manager 1.21, Kyverno 1.19 and Velero 1.18. These three rows are Part 2. Each box gives the CNCF status checked on 8 November 2026.</desc>
<rect width="900" height="660" fill="#ffffff"/>
<defs>
<marker id="k8s-tools-ecosystem-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="k8s-tools-ecosystem-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
