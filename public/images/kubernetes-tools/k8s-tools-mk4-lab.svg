<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" role="img" aria-labelledby="k8s-tools-mk4-lab-title k8s-tools-mk4-lab-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="k8s-tools-mk4-lab-title">What runs on the mk4 Minikube lab on 8 November 2026, and what does not</title>
<desc id="k8s-tools-mk4-lab-desc">One Hetzner server with 16 vCPU and 32 GB RAM runs Docker and the Minikube profile mk4: eight nodes on Kubernetes v1.37.0 with the kindnet CNI, sharing the host&#x27;s CPU and memory. Delivery: Argo CD v3.5.5 from Helm chart 10.10.5 with 35 live Applications synced by hand except Harbor; Helm charts and Kustomize directories as Argo sources; jithendar.com applied with kubectl apply -k. Edge and TLS: Traefik v3.7.14, cert-manager v1.20.4 with two Let&#x27;s Encrypt ClusterIssuers and four Certificates, Harbor 2.15.4 as the registry. Observability: Prometheus v3.15.0 with hand-written scrape jobs and no Alertmanager or Operator, Grafana, Loki, Alloy, Jaeger and an OpenTelemetry Collector. Present but broken: Velero CRDs, an R2 storage location and a daily schedule with no Velero server since 1 November, and 29 Applications for the deleted EKS cluster in status Unknown. Not installed: Flux, Karpenter, KEDA, Istio, Linkerd, Cilium, Kyverno and kube-state-metrics. kubectl and K9s run on a laptop with a kubeconfig from the tools repository.</desc>
