<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="k8s-tools-service-mesh-title k8s-tools-service-mesh-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="k8s-tools-service-mesh-title">Control plane and data plane in Istio sidecar mode, Istio ambient mode and Linkerd</title>
<desc id="k8s-tools-service-mesh-desc">Istio&#x27;s control plane, istiod, issues workload certificates and pushes routing and policy configuration to proxies over xDS. In sidecar mode every pod gets an Envoy container that handles mTLS and layer 7 routing. In ambient mode a ztunnel DaemonSet on each node handles mTLS and layer 4 policy for enrolled namespaces, and optional waypoint proxies, one Envoy Deployment per namespace or service account, add layer 7 features. Linkerd&#x27;s control plane has destination, identity and proxy-injector components, and every meshed pod gets the Rust linkerd2-proxy sidecar. In all three, application traffic flows proxy to proxy, and the control plane is not in the request path.</desc>
<rect width="900" height="600" fill="#ffffff"/>
