<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="moks-crewai-build-deploy-title moks-crewai-build-deploy-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="moks-crewai-build-deploy-title">One commit, two images: only the CrewAI worker runs the image that carries crewai</title>
<desc id="moks-crewai-build-deploy-desc">Top: GitHub Actions on a push to master. The check job runs the backend suite on the default pins and the crewai job runs it again on the CrewAI dependency set. release builds and pushes moks:latest. release-crewai needs both test jobs, builds the same commit with the build argument MOKS_CREWAI=true, proves crewai imports on a read-only root with no network, and pushes moks-crewai:latest. Both images go to the Harbor registry. deploy runs only when MK4_DEPLOY is true and asks Argo CD to sync and restart. In the cluster, the api, worker, executor and terminal Deployments run moks:latest; the Deployment moks-crewai runs moks-crewai:latest with MOKS_WORKER_CLASSES=crewai and is rendered by the Argo CD app moks-crewai only when crewai.enabled is true.</desc>
