<text x="450.0" y="205.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">flag off: 404</text>
<text x="450.0" y="221.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">no worker or no model: 503</text>
