<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-labelledby="moks-crewai-request-path-title moks-crewai-request-path-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="moks-crewai-request-path-title">How a CrewAI investigation travels through MOKS, next to the default LangGraph path</title>
<desc id="moks-crewai-request-path-desc">Top to bottom. The Investigate page asks GET /investigate/config whether CrewAI is available and posts to POST /investigations/crewai, which answers 404 with the flag off and 503 with no CrewAI worker or no model. start_investigation checks permission and scope and queues a row whose first event carries a crewai block. In PostgreSQL sit the component_versions row the CrewAI worker keeps fresh, the evidence and audit rows, and the queue. Two kinds of worker claim from the queue with FOR UPDATE SKIP LOCKED: the CrewAI worker on the moks-crewai image takes only rows with a crewai block and runs the crew; the default worker takes the rest and runs the LangGraph graph. Both end in the same checks: validate_claims, verify_causes, the relevance check, the stored report and the reply in the conversation.</desc>
<rect width="900" height="660" fill="#ffffff"/>
