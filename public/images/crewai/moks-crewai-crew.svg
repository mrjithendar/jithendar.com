<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="moks-crewai-crew-title moks-crewai-crew-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="moks-crewai-crew-title">Three agents in sequence, with MOKS code between the model and the cluster and after the answer</title>
<desc id="moks-crewai-crew-desc">Top row: the CrewAI crew, a sequential process of three agents. The workload investigator has nine read-only tools for pods, events, logs, metrics and alerts. The change investigator has five for rollouts, configuration, Git commits and runbooks. The incident reviewer has only evidence_list and writes one JSON report. Second row: every tool call passes bind(), which fixes the namespace, workload and time window in code and refuses anything else, then the ToolExecutor, which checks RBAC and scope, applies the timeout, redacts and truncates, and audits. The result is stored as evidence and listed in the evidence registry with an excerpt. Third row: the live systems the tools read. Bottom row: the reviewer&#x27;s JSON goes through validate(), which rejects invented citations, removes uncited claims and caps confidence, then through the checks every MOKS report passes, and is stored with a crewai block.</desc>
<rect width="900" height="640" fill="#ffffff"/>
<defs>
<marker id="moks-crewai-crew-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="moks-crewai-crew-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="moks-crewai-crew-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="moks-crewai-crew-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="moks-crewai-crew-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="moks-crewai-crew-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
