<polyline points="165.0,164 165.0,234" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#moks-crewai-crew-sync)"/>
<polyline points="396.0,164 396,192 230,192 230.0,234" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#moks-crewai-crew-sync)"/>
