<rect x="30" y="40" width="270" height="124" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="165.0" y="77.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">1. Workload investigator</text>
<text x="165.0" y="93.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">namespace_health, workload_status,</text>
<text x="165.0" y="109.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">workload_pods, describe_pod,</text>
<text x="165.0" y="125.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">recent_events, pod_logs, search_logs,</text>
<text x="165.0" y="141.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">pod_metrics, firing_alerts</text>
<rect x="315" y="40" width="270" height="124" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="450.0" y="85.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">2. Change investigator</text>
<text x="450.0" y="101.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">rollout_history, config_audit,</text>
<text x="450.0" y="117.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">recent_commits, deployed_commit,</text>
<text x="450.0" y="133.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">search_runbooks</text>
<rect x="600" y="40" width="270" height="124" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="735.0" y="85.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">3. Incident reviewer</text>
<text x="735.0" y="101.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">evidence_list only</text>
<text x="735.0" y="117.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">writes one JSON report</text>
<text x="735.0" y="133.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">cites ids, never quotes</text>
<rect x="30" y="234" width="270" height="92" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="165.0" y="271.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">bind(): target fixed in code</text>
<text x="165.0" y="287.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">namespace, workload, time window</text>
<text x="165.0" y="303.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">another namespace or pod: refused</text>
<rect x="315" y="234" width="270" height="92" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="450.0" y="271.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">ToolExecutor.run()</text>
<text x="450.0" y="287.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">RBAC + scope, timeout,</text>
<text x="450.0" y="303.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">redaction, truncation, audit</text>
<rect x="600" y="234" width="270" height="92" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="735.0" y="271.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">Evidence registry</text>
<text x="735.0" y="287.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">E1, E2, … with excerpts</text>
<text x="735.0" y="303.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">cut from the stored rows</text>
<rect x="30" y="396" width="840" height="58" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="450.0" y="424.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Kubernetes API · Loki · Prometheus · Git · knowledge base</text>
<text x="450.0" y="440.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">no exec, apply, patch, delete, scale or Secret read</text>
<rect x="30" y="524" width="270" height="92" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="165.0" y="553.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">validate()</text>
<text x="165.0" y="569.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">invented citation: rejected</text>
<text x="165.0" y="585.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">uncited claim: removed</text>
<text x="165.0" y="601.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">confidence capped by evidence</text>
<rect x="315" y="524" width="270" height="92" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="450.0" y="561.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">validate_claims + verify_causes</text>
<text x="450.0" y="577.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">the checks every MOKS</text>
<text x="450.0" y="593.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">LLM report passes</text>
<rect x="600" y="524" width="270" height="92" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="735.0" y="561.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">Stored report</text>
<text x="735.0" y="577.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">facts, causes, missing evidence,</text>
<text x="735.0" y="593.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">next steps + a crewai block</text>
<rect x="92.9" y="190.5" width="64.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="125.0" y="202.5" text-anchor="middle" font-size="12" fill="#0f172a">tool call</text>
<rect x="744.4" y="190.5" width="89.1" height="17" fill="#ffffff" opacity="0.92"/>
<text x="789.0" y="202.5" text-anchor="middle" font-size="12" fill="#0f172a">evidence_list</text>
<rect x="483.2" y="473.5" width="76.6" height="17" fill="#ffffff" opacity="0.92"/>
<text x="521.5" y="485.5" text-anchor="middle" font-size="12" fill="#0f172a">JSON answer</text>
<text x="245" y="222" font-size="12" font-weight="600" fill="#475569">MOKS code between the model and the cluster</text>
<text x="245" y="512" font-size="12" font-weight="600" fill="#475569">After the crew: checks in code</text>
</svg>
