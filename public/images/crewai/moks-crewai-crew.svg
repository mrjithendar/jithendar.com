<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">CrewAI crew: Process.sequential, max_iter 5, no delegation, memory, planning or cache</text>
<rect x="15" y="206" width="870" height="134" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="222" text-anchor="start" font-size="12" font-weight="600" fill="#475569"></text>
<rect x="15" y="368" width="870" height="100" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="384" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Live systems: 14 read-only tools on the allowlist</text>
<rect x="15" y="496" width="870" height="132" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="512" text-anchor="start" font-size="12" font-weight="600" fill="#475569"></text>
