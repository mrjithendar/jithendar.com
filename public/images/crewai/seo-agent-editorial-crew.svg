<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="seo-agent-editorial-crew-title seo-agent-editorial-crew-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="seo-agent-editorial-crew-title">The Editorial Crew: four agents write, and code assembles the draft</title>
<desc id="seo-agent-editorial-crew-desc">Top row: four agents in sequence. The researcher runs on Sonnet with up to ten turns and holds vector_search, read_article and fetch_allowlisted_docs. The technical writer runs on Opus with up to six turns and holds read_article. The technical reviewer runs on Opus with up to eight turns and holds fetch_allowlisted_docs. The SEO editor runs on Sonnet with up to four turns, holds gsc_queries_for_topic and vector_search, and returns metadata only. Second row, in code: every URL a tool fetched is recorded; the body is the reviewer&#x27;s corrected text; the editor&#x27;s answer is parsed as the Pydantic model SeoMetadata. Bottom: NewArticleDraft is assembled from the body, the metadata, the code blocks extracted from the body and the fact-check flags, including one for each cited source the crew never fetched.</desc>
<rect width="900" height="430" fill="#ffffff"/>
<defs>
<marker id="seo-agent-editorial-crew-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="seo-agent-editorial-crew-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="seo-agent-editorial-crew-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="seo-agent-editorial-crew-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="seo-agent-editorial-crew-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="seo-agent-editorial-crew-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="870" height="160" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Editorial Crew: Process.sequential, one worker thread</text>
<rect x="15" y="200" width="870" height="130" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="216" text-anchor="start" font-size="12" font-weight="600" fill="#475569"></text>
<polyline points="225,98.0 245,98.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#seo-agent-editorial-crew-sync)"/>
<polyline points="440,98.0 460,98.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#seo-agent-editorial-crew-sync)"/>
<polyline points="655,98.0 675,98.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#seo-agent-editorial-crew-sync)"/>
<polyline points="127.5,156 127.5,228" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#seo-agent-editorial-crew-dashed)"/>
<polyline points="557.5,156 557.5,228" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#seo-agent-editorial-crew-sync)"/>
<polyline points="772.5,156 772.5,228" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#seo-agent-editorial-crew-sync)"/>
<polyline points="165.0,316 165.0,358" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#seo-agent-editorial-crew-dashed)"/>
<polyline points="450.0,316 450.0,358" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#seo-agent-editorial-crew-write)"/>
<polyline points="735.0,316 735.0,358" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#seo-agent-editorial-crew-write)"/>
<rect x="30" y="40" width="195" height="116" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="127.5" y="81.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">Researcher</text>
<text x="127.5" y="97.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Sonnet, up to 10 turns</text>
<text x="127.5" y="113.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">vector_search, read_article,</text>
<text x="127.5" y="129.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">fetch_allowlisted_docs</text>
<rect x="245" y="40" width="195" height="116" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="342.5" y="81.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">Technical writer</text>
<text x="342.5" y="97.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Opus, up to 6 turns</text>
<text x="342.5" y="113.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">read_article</text>
<text x="342.5" y="129.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">writes the full MDX body</text>
<rect x="460" y="40" width="195" height="116" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="557.5" y="81.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">Technical reviewer</text>
<text x="557.5" y="97.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Opus, up to 8 turns</text>
<text x="557.5" y="113.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">fetch_allowlisted_docs</text>
<text x="557.5" y="129.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">corrects, flags unsourced</text>
<rect x="675" y="40" width="195" height="116" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="772.5" y="81.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">SEO editor</text>
<text x="772.5" y="97.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Sonnet, up to 4 turns</text>
<text x="772.5" y="113.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">gsc_queries_for_topic,</text>
<text x="772.5" y="129.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">vector_search</text>
<rect x="30" y="228" width="270" height="88" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="165.0" y="263.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">fetched[] (on_source hook)</text>
<text x="165.0" y="279.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">every URL a tool returned</text>
<text x="165.0" y="295.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">during this run</text>
<rect x="315" y="228" width="270" height="88" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="450.0" y="263.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">body_mdx</text>
<text x="450.0" y="279.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">the reviewer&#x27;s corrected body:</text>
<text x="450.0" y="295.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">text before NEEDS_FACT_CHECK:</text>
<rect x="600" y="228" width="270" height="88" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="735.0" y="263.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">SeoMetadata (Pydantic)</text>
<text x="735.0" y="279.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">title, slug, meta, outline,</text>
<text x="735.0" y="295.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">sources, links: never a body</text>
<rect x="30" y="358" width="840" height="58" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="450.0" y="386.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">NewArticleDraft</text>
<text x="450.0" y="402.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">body + metadata + code blocks extracted from the body + fact-check flags (unsourced claims, sources never fetched)</text>
<text x="180" y="216" font-size="12" font-weight="600" fill="#475569">Assembled in code, not by an agent</text>
</svg>
