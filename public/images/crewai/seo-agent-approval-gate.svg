<text x="745.0" y="371.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">publish_flow</text>
<text x="745.0" y="387.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">apply_changes: the accepted</text>
