<text x="450.0" y="253.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">seo_draft_approvals</text>
<rect x="620" y="190" width="250" height="80" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="745.0" y="221.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">The approval</text>
<text x="745.0" y="237.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">approver, accepted change ids,</text>
<text x="745.0" y="253.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">7-day expiry, single use</text>
<rect x="30" y="340" width="250" height="80" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="155.0" y="371.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">POST /review/{id}/decision</text>
