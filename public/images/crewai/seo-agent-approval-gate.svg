<text x="745.0" y="79.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">The flow ends</text>
<text x="745.0" y="95.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">final state in seo_flow_runs</text>
