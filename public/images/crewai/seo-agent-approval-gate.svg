<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="seo-agent-approval-gate-title seo-agent-approval-gate-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="seo-agent-approval-gate-title">The human gate: a drafting flow ends, and only a recorded approval can start publish_flow</title>
<desc id="seo-agent-approval-gate-desc">Four rows. Drafting: a crew writes a draft with read-only tools, save_draft sets the status ready_for_review, and the flow ends with its final state in seo_flow_runs; nothing waits in memory. Web app, hours or days later: a person accepts, rejects or edits each change, Approve runs a preflight and writes a row in seo_draft_approvals with the approver, the accepted change ids, a seven-day expiry and a single use. seo-agent: POST /review/{id}/decision is the only code that sets triggered_by to approval; check_kickoff answers 403 to publish_flow from cron, a manual kickoff, MCP or a child run; publish_flow applies the accepted changes. Web app again: cms_publish calls publishWithApproval, which re-checks and consumes the approval; verify_live tries three times; if it passes, the URL is submitted, reindexed and scheduled for measurement, and if it fails there is an alert with a one-click rollback and nothing is submitted.</desc>
<rect width="900" height="600" fill="#ffffff"/>
<defs>
<marker id="seo-agent-approval-gate-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="seo-agent-approval-gate-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="seo-agent-approval-gate-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="seo-agent-approval-gate-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="seo-agent-approval-gate-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="seo-agent-approval-gate-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
