<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 512" width="900" height="512" role="img" aria-labelledby="seo-agent-new-article-flow-title seo-agent-new-article-flow-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="seo-agent-new-article-flow-title">new_article_flow as CrewAI sees it: one start method, three listeners per outcome, two routers</title>
<desc id="seo-agent-new-article-flow-desc">Top row: load_brief, the start method, reads the calendar brief from the web app. draft listens to it and to the router label to_retry; it runs the Editorial Crew and counts the attempt. The router after_draft returns to_paused when the budget stopped the crew, otherwise to_validate. Second row: validate_draft sends the document to the web app&#x27;s validators. The router after_validate returns to_ok, to_retry (once) or to_fail. failed marks the draft generation_failed. Third row: save_draft is the flow&#x27;s only write and ends with outcome draft_ready; paused marks the draft with the budget reason. Bottom: after every method PgFlowPersistence.save_state writes the state, the step name, tokens and cost into the run&#x27;s row in seo_flow_runs.</desc>
<rect width="900" height="512" fill="#ffffff"/>
<defs>
<marker id="seo-agent-new-article-flow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="seo-agent-new-article-flow-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="seo-agent-new-article-flow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="seo-agent-new-article-flow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="seo-agent-new-article-flow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="seo-agent-new-article-flow-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="870" height="400" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">NewArticleFlow(SeoFlow[NewArticleState])</text>
<polyline points="260,80.0 335,80.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#seo-agent-new-article-flow-sync)"/>
<polyline points="565,80.0 640,80.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#seo-agent-new-article-flow-sync)"/>
<polyline points="755.0,120 755.0,170" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#seo-agent-new-article-flow-sync)"/>
<polyline points="640,210.0 565,210.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#seo-agent-new-article-flow-sync)"/>
<polyline points="450.0,170 450.0,120" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#seo-agent-new-article-flow-sync)"/>
<polyline points="335,210.0 260,210.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#seo-agent-new-article-flow-sync)"/>
<polyline points="450.0,250 450.0,300" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#seo-agent-new-article-flow-sync)"/>
<polyline points="870,80.0 878,80 878,340 870,340.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#seo-agent-new-article-flow-sync)"/>
<rect x="30" y="40" width="230" height="80" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="145.0" y="79.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">@start load_brief</text>
<text x="145.0" y="95.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">calendar brief from the web app</text>
<rect x="335" y="40" width="230" height="80" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="450.0" y="71.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">@listen draft</text>
<text x="450.0" y="87.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Editorial Crew, attempts += 1</text>
<text x="450.0" y="103.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">BudgetExceeded: paused_budget</text>
<rect x="640" y="40" width="230" height="80" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="755.0" y="79.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">@router after_draft</text>
<text x="755.0" y="95.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">to_paused or to_validate</text>
<rect x="30" y="170" width="230" height="80" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="145.0" y="201.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">@listen failed</text>
<text x="145.0" y="217.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">draft: generation_failed</text>
<text x="145.0" y="233.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">with the validator&#x27;s errors</text>
<rect x="335" y="170" width="230" height="80" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="450.0" y="201.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">@router after_validate</text>
<text x="450.0" y="217.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">to_ok, to_retry or to_fail</text>
<text x="450.0" y="233.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">MAX_ATTEMPTS = 2</text>
<rect x="640" y="170" width="230" height="80" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="755.0" y="201.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">@listen validate_draft</text>
<text x="755.0" y="217.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">the web app&#x27;s validators</text>
<text x="755.0" y="233.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">errors: validator_feedback</text>
<rect x="335" y="300" width="230" height="80" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="450.0" y="331.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">@listen save_draft</text>
<text x="450.0" y="347.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">the flow&#x27;s only write</text>
<text x="450.0" y="363.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">outcome: draft_ready</text>
<rect x="640" y="300" width="230" height="80" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="755.0" y="331.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">@listen paused</text>
<text x="755.0" y="347.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">draft: generation_failed</text>
<text x="755.0" y="363.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Paused: LLM budget reached</text>
<rect x="30" y="440" width="840" height="58" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="450.0" y="468.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">After every method: PgFlowPersistence.save_state()</text>
<text x="450.0" y="484.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">writes state_json, current_step, tokens and cost_usd into the run&#x27;s seo_flow_runs row (never SQLite)</text>
<rect x="668.7" y="136.5" width="76.6" height="17" fill="#ffffff" opacity="0.92"/>
<text x="707.0" y="148.5" text-anchor="middle" font-size="12" fill="#0f172a">to_validate</text>
<rect x="383.0" y="136.5" width="57.9" height="17" fill="#ffffff" opacity="0.92"/>
<text x="412.0" y="148.5" text-anchor="middle" font-size="12" fill="#0f172a">to_retry</text>
<rect x="271.7" y="201.5" width="51.7" height="17" fill="#ffffff" opacity="0.92"/>
<text x="297.5" y="213.5" text-anchor="middle" font-size="12" fill="#0f172a">to_fail</text>
<rect x="400.4" y="266.5" width="39.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="420.0" y="278.5" text-anchor="middle" font-size="12" fill="#0f172a">to_ok</text>
<rect x="805.9" y="266.5" width="64.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="838.0" y="278.5" text-anchor="middle" font-size="12" fill="#0f172a">to_paused</text>
</svg>
