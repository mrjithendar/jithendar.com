<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="seo-agent-crewai-kickoff-title seo-agent-crewai-kickoff-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="seo-agent-crewai-kickoff-title">Three triggers, one kickoff: how a flow run starts and where its work goes</title>
<desc id="seo-agent-crewai-kickoff-desc">Top: three triggers. CronJobs named seo-flow-* run python -m app.trigger, the admin UI has Run now buttons and the review decision, and the admin MCP server has a kickoff_flow tool limited to an allowlist. All three call POST /flows/{name}/kickoff. Middle, inside the single seo-agent pod: FlowRunner.kickoff applies the start policy, validates the inputs against a strict model, creates the run row, takes the lock and starts a background task. The CrewAI Flow runs its start, listen and router methods, with data steps in plain Python. A Crew runs in a worker thread, sequentially, with read-only tools, a token cap and a wall clock. ClaudeCrewLLM, a CrewAI BaseLLM, sends each call through the budget guard to the Anthropic SDK. Bottom: PostgreSQL holds seo_flow_runs with the state after every step, the lock and the usage rows; the web app&#x27;s callback API serves articles, validators and the draft API; the Anthropic API answers the model calls.</desc>
