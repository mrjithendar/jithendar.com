<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="deploy-k8s-rollout-title deploy-k8s-rollout-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="deploy-k8s-rollout-title">A rolling update with no downtime</title>
<desc id="deploy-k8s-rollout-desc">Five steps: Kubernetes starts one extra pod with the new image while both old pods keep serving. The new pod applies migrations under an advisory lock, its startup probe passes on /api/health, and its readiness probe adds it to the Service. Then one old pod is removed from the Service, sleeps five seconds in preStop so in-flight requests finish, and stops. If the startup probe never passes, the rollout stalls and the old pods keep serving.</desc>
<rect width="900" height="330" fill="#ffffff"/>
<defs>
<marker id="deploy-k8s-rollout-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="deploy-k8s-rollout-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="deploy-k8s-rollout-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="deploy-k8s-rollout-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="deploy-k8s-rollout-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="deploy-k8s-rollout-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<polyline points="178,97.0 188,97.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#deploy-k8s-rollout-sync)"/>
<polyline points="356,97.0 366,97.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#deploy-k8s-rollout-sync)"/>
<polyline points="534,97.0 544,97.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#deploy-k8s-rollout-sync)"/>
<polyline points="712,97.0 722,97.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#deploy-k8s-rollout-sync)"/>
<polyline points="450.0,134 450.0,200" fill="none" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#deploy-k8s-rollout-reject)"/>
<rect x="10" y="60" width="168" height="74" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="94.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">1. New pod starts</text>
<text x="94.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">maxSurge: 1</text>
<text x="94.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">maxUnavailable: 0</text>
<rect x="188" y="60" width="168" height="74" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="272.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">2. Migrations run</text>
<text x="272.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">under a pg advisory</text>
<text x="272.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">lock, once per release</text>
<rect x="366" y="60" width="168" height="74" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="450.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">3. Startup probe OK</text>
<text x="450.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">GET /api/health</text>
<text x="450.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">up to 60 s (30 × 2 s)</text>
<rect x="544" y="60" width="168" height="74" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="628.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">4. Receives traffic</text>
<text x="628.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">readiness probe passes</text>
<text x="628.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Service adds the pod</text>
<rect x="722" y="60" width="168" height="74" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="806.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">5. Old pod drains</text>
<text x="806.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">preStop: sleep 5</text>
<text x="806.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">SIGTERM, 30 s grace</text>
<rect x="366" y="200" width="168" height="74" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="450.0" y="228.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Never becomes ready</text>
<text x="450.0" y="244.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">rollout stalls; the old</text>
<text x="450.0" y="260.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">pods keep serving</text>
<rect x="430.4" y="158.5" width="39.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="450.0" y="170.5" text-anchor="middle" font-size="12" fill="#0f172a">fails</text>
<text x="10" y="222" font-size="12" fill="#475569">Steps 1 to 5 repeat for</text>
<text x="10" y="244" font-size="12" fill="#475569">each replica in turn.</text>
<text x="540" y="222" font-size="12" fill="#475569">kubectl rollout status deploy/moks-cms</text>
<text x="540" y="244" font-size="12" fill="#475569">kubectl rollout undo deploy/moks-cms</text>
</svg>
