<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img" aria-labelledby="deploy-eks-architecture-title deploy-eks-architecture-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="deploy-eks-architecture-title">Moks CMS on Amazon EKS with RDS</title>
<desc id="deploy-eks-architecture-desc">Route 53 points the domain at an Application Load Balancer in the public subnets, which ends TLS with an ACM certificate and sends traffic straight to the web pods&#x27; IP addresses. The pods run on a Graviton managed node group in two private subnets. The AWS Load Balancer Controller creates the ALB from an Ingress, and External Secrets Operator copies the app&#x27;s settings from Secrets Manager into a Kubernetes Secret. Pods pull the image from ECR, store media in object storage, and connect to Amazon RDS for PostgreSQL, Multi-AZ, in private database subnets. A NAT gateway carries outbound traffic.</desc>
