<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="deploy-k8s-architecture-title deploy-k8s-architecture-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="deploy-k8s-architecture-title">Moks CMS on a k3s Kubernetes cluster</title>
<desc id="deploy-k8s-architecture-desc">The reader&#x27;s browser reaches Traefik, the ingress controller bundled with k3s, on ports 80 and 443. Traefik terminates TLS with a certificate that cert-manager obtained from Let&#x27;s Encrypt over HTTP-01 and stored in a Secret. It routes to the Service in namespace moks-cms, which balances over two web pods. The pods read their settings from a Secret, store media in R2 or S3, and connect to a CloudNativePG cluster: a primary behind the postgres-rw Service and a streaming replica.</desc>
