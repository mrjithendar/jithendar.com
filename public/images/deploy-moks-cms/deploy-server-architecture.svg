<text x="770.0" y="84.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">docker buildx --push</text>
<rect x="60" y="175" width="250" height="74" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="185.0" y="203.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Caddy 2 (ports 80, 443)</text>
<text x="185.0" y="219.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">automatic Let&#x27;s Encrypt TLS</text>
<text x="185.0" y="235.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">volume caddy_data</text>
<rect x="60" y="295" width="250" height="74" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="185.0" y="323.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">web: Moks CMS (Next.js)</text>
<text x="185.0" y="339.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">node server.js, port 3000</text>
<text x="185.0" y="355.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">read-only, user 1000</text>
<rect x="60" y="415" width="250" height="74" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="185.0" y="443.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">postgres:18-alpine</text>
<text x="185.0" y="459.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">port 5432, not published</text>
<text x="185.0" y="475.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">volume pgdata</text>
<rect x="350" y="415" width="250" height="74" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="475.0" y="443.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">backup.sh (cron, 03:00)</text>
<text x="475.0" y="459.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">pg_dump -Fc</text>
<text x="475.0" y="475.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">→ S3, 30-day lifecycle</text>
<rect x="670" y="175" width="200" height="74" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="770.0" y="203.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Image registry</text>
<text x="770.0" y="219.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">GHCR or Amazon ECR</text>
<text x="770.0" y="235.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">tag = git commit</text>
<rect x="670" y="295" width="200" height="74" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="770.0" y="323.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Object storage</text>
<text x="770.0" y="339.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">media uploads</text>
<text x="770.0" y="355.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Cloudflare R2 or S3</text>
<rect x="670" y="415" width="200" height="74" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="770.0" y="443.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">S3 bucket</text>
<text x="770.0" y="459.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">database dumps</text>
<text x="770.0" y="475.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">versioned, private</text>
