<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-labelledby="deploy-server-architecture-title deploy-server-architecture-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="deploy-server-architecture-title">Moks CMS on one Linux server with Docker Compose</title>
<desc id="deploy-server-architecture-desc">A reader&#x27;s browser looks up the domain in DNS, which points at the server&#x27;s Elastic IP. On the server, Docker Compose runs three containers: Caddy terminates HTTPS with a Let&#x27;s Encrypt certificate and proxies to the Next.js container on port 3000, which talks to PostgreSQL on port 5432. CI builds the image and pushes it to a registry, and the server pulls it. Media uploads go to R2 or S3, and a nightly pg_dump is copied to an S3 bucket.</desc>
<rect width="900" height="620" fill="#ffffff"/>
<defs>
<marker id="deploy-server-architecture-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="deploy-server-architecture-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="deploy-server-architecture-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="deploy-server-architecture-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="deploy-server-architecture-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="deploy-server-architecture-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
