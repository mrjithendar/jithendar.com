<text x="532.5" y="215.5" text-anchor="middle" font-size="12" fill="#0f172a">docker pull</text>
<text x="50" y="542" font-size="12" fill="#475569">Security group: 80 and 443 from anywhere, 22 from your IP only (or SSM, no port 22).</text>
<text x="50" y="564" font-size="12" fill="#475569">Only Caddy publishes ports. web and postgres talk over the Compose network.</text>
