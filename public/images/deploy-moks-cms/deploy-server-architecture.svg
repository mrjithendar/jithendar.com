<rect x="60" y="40" width="250" height="58" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="185.0" y="68.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Reader&#x27;s browser</text>
<text x="185.0" y="84.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">https://your-domain</text>
<rect x="350" y="40" width="250" height="58" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="475.0" y="68.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">DNS (Route 53 or Cloudflare)</text>
<text x="475.0" y="84.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">A record → Elastic IP</text>
<rect x="670" y="40" width="200" height="58" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
