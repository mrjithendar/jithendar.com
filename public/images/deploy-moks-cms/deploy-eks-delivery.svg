<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="deploy-eks-delivery-title deploy-eks-delivery-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="deploy-eks-delivery-title">From a merged pull request to running pods on EKS</title>
<desc id="deploy-eks-delivery-desc">Five steps: a GitHub Actions job gets a short-lived AWS session through OIDC with no stored keys, builds an arm64 image on an arm runner and pushes it to ECR tagged with the commit. It then updates its kubeconfig through an EKS access entry limited to namespace moks-cms, sets the new image on the Deployment and waits for the rollout, and finally runs the smoke test. A failed rollout is undone with kubectl rollout undo.</desc>
<rect width="900" height="330" fill="#ffffff"/>
<defs>
<marker id="deploy-eks-delivery-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="deploy-eks-delivery-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="deploy-eks-delivery-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="deploy-eks-delivery-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="deploy-eks-delivery-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="deploy-eks-delivery-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<polyline points="178,97.0 188,97.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#deploy-eks-delivery-sync)"/>
<polyline points="356,97.0 366,97.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#deploy-eks-delivery-sync)"/>
<polyline points="534,97.0 544,97.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#deploy-eks-delivery-sync)"/>
<polyline points="712,97.0 722,97.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#deploy-eks-delivery-sync)"/>
<polyline points="628.0,134 628.0,200" fill="none" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#deploy-eks-delivery-reject)"/>
<rect x="10" y="60" width="168" height="74" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="94.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">1. OIDC to AWS</text>
<text x="94.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">AssumeRoleWith-</text>
<text x="94.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">WebIdentity, 1 hour</text>
<rect x="188" y="60" width="168" height="74" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="272.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">2. Build + push</text>
<text x="272.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">ubuntu-24.04-arm</text>
<text x="272.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">ECR tag: commit SHA</text>
<rect x="366" y="60" width="168" height="74" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="450.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">3. kubeconfig</text>
<text x="450.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">EKS access entry</text>
<text x="450.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">namespace moks-cms</text>
<rect x="544" y="60" width="168" height="74" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="628.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">4. Set image</text>
<text x="628.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">rollout status</text>
<text x="628.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">--timeout 5m</text>
<rect x="722" y="60" width="168" height="74" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="806.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">5. Smoke test</text>
<text x="806.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">health, sitemap,</text>
<text x="806.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">redirects</text>
<rect x="544" y="200" width="168" height="74" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="628.0" y="228.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Roll back</text>
<text x="628.0" y="244.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">kubectl rollout undo</text>
<text x="628.0" y="260.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">(immutable tags)</text>
<rect x="608.4" y="158.5" width="39.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="628.0" y="170.5" text-anchor="middle" font-size="12" fill="#0f172a">fails</text>
<text x="10" y="222" font-size="12" fill="#475569">No AWS keys are stored in GitHub: the role trusts only</text>
<text x="10" y="244" font-size="12" fill="#475569">this repository&#x27;s default branch.</text>
</svg>
