<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="deploy-server-release-title deploy-server-release-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="deploy-server-release-title">Releasing a new version on the server</title>
<desc id="deploy-server-release-desc">Five steps from left to right: CI builds an image tagged with the commit and pushes it. On the server you set the new tag in .env and run docker compose up, which replaces the web container. On start the app applies database migrations under an advisory lock, then the health check calls /api/health. If the check fails, you set the previous tag and run compose up again.</desc>
<rect width="900" height="330" fill="#ffffff"/>
<defs>
<marker id="deploy-server-release-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="deploy-server-release-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="deploy-server-release-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="deploy-server-release-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="deploy-server-release-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="deploy-server-release-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<polyline points="178,97.0 188,97.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#deploy-server-release-sync)"/>
<polyline points="356,97.0 366,97.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#deploy-server-release-sync)"/>
<polyline points="534,97.0 544,97.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#deploy-server-release-sync)"/>
<polyline points="712,97.0 722,97.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#deploy-server-release-sync)"/>
<polyline points="806.0,134 806.0,200" fill="none" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#deploy-server-release-reject)"/>
<rect x="10" y="60" width="168" height="74" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="94.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">1. Build the image</text>
<text x="94.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">tag: git commit SHA</text>
<text x="94.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">linux/arm64 or amd64</text>
<rect x="188" y="60" width="168" height="74" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="272.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">2. Push it</text>
<text x="272.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">GHCR or ECR</text>
<text x="272.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">keep old tags</text>
<rect x="366" y="60" width="168" height="74" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="450.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">3. compose up -d</text>
<text x="450.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">IMAGE=...:&lt;new sha&gt;</text>
<text x="450.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">web is replaced</text>
<rect x="544" y="60" width="168" height="74" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="628.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">4. Migrations run</text>
<text x="628.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">on start, under a</text>
<text x="628.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">pg advisory lock</text>
<rect x="722" y="60" width="168" height="74" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="806.0" y="88.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">5. Health check</text>
<text x="806.0" y="104.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">GET /api/health</text>
<text x="806.0" y="120.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">status ok + version</text>
<rect x="722" y="200" width="168" height="74" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="806.0" y="228.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Roll back</text>
<text x="806.0" y="244.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">IMAGE=...:&lt;old sha&gt;</text>
<text x="806.0" y="260.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">compose up -d again</text>
<rect x="786.4" y="158.5" width="39.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="806.0" y="170.5" text-anchor="middle" font-size="12" fill="#0f172a">fails</text>
<text x="10" y="222" font-size="12" fill="#475569">The web container restarts, so a release on one server costs a few seconds of 502s.</text>
<text x="10" y="244" font-size="12" fill="#475569">Migrations only move forward: the previous image must still run on the new schema.</text>
<text x="10" y="266" font-size="12" fill="#475569">Postgres and Caddy keep running; only the web container changes.</text>
</svg>
