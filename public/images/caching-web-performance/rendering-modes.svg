<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="rendering-modes-title rendering-modes-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="rendering-modes-title">Three ways to make the HTML of a page</title>
<desc id="rendering-modes-desc">SSG builds every page once with next build and serves the files until the next build. ISR serves pages from a cache and re-renders a page in the background after its revalidate time or at once when its data changes. Dynamic rendering builds the page from the database on every request, which is what jithendar.com did before: about half a second of server work for every visit.</desc>
<rect width="720" height="470" fill="#ffffff"/>
<defs>
<marker id="rendering-modes-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="rendering-modes-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="rendering-modes-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="rendering-modes-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="rendering-modes-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="rendering-modes-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="690" height="132" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">SSG: static site generation</text>
<rect x="15" y="160" width="690" height="150" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="176" text-anchor="start" font-size="12" font-weight="600" fill="#475569">ISR: incremental static regeneration (jithendar.com now)</text>
<rect x="15" y="326" width="690" height="132" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="342" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Dynamic rendering (jithendar.com before)</text>
<polyline points="220,84.0 265,84.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#rendering-modes-sync)"/>
<polyline points="455,84.0 500,84.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#rendering-modes-sync)"/>
<polyline points="220,228.0 265,228.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#rendering-modes-sync)"/>
<polyline points="455,228.0 500,228.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#rendering-modes-sync)"/>
<polyline points="220,398.0 265,398.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#rendering-modes-sync)"/>
<polyline points="455,398.0 500,398.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#rendering-modes-sync)"/>
<polyline points="360.0,260 360,288 125,288 125.0,260" fill="none" stroke="#be123c" stroke-width="2.2" marker-end="url(#rendering-modes-async)"/>
<rect x="30" y="52" width="190" height="64" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="125.0" y="83.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">next build</text>
<text x="125.0" y="99.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">renders every page once</text>
<rect x="265" y="52" width="190" height="64" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="360.0" y="83.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">HTML files</text>
<text x="360.0" y="99.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">frozen until the next build</text>
<rect x="500" y="52" width="190" height="64" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="595.0" y="75.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Every request</text>
<text x="595.0" y="91.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">served as is: fastest</text>
<text x="595.0" y="107.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">new content needs a build</text>
<rect x="30" y="196" width="190" height="64" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="125.0" y="227.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">First visit or warm-up</text>
<text x="125.0" y="243.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">renders the page once</text>
<rect x="265" y="196" width="190" height="64" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="360.0" y="219.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Page cache</text>
<text x="360.0" y="235.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">in memory, per pod</text>
<text x="360.0" y="251.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">≤ 64 MB, LRU</text>
<rect x="500" y="196" width="190" height="64" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="595.0" y="219.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Every request</text>
<text x="595.0" y="235.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">served from memory</text>
<text x="595.0" y="251.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">5–9 ms</text>
<rect x="30" y="366" width="190" height="64" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="125.0" y="397.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Every request</text>
<text x="125.0" y="413.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">no reuse between visitors</text>
<rect x="265" y="366" width="190" height="64" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="360.0" y="389.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">PostgreSQL + render</text>
<text x="360.0" y="405.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">MDX, React, HTML</text>
<text x="360.0" y="421.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">≈ 0.49 s each time</text>
<rect x="500" y="366" width="190" height="64" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="595.0" y="389.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Response</text>
<text x="595.0" y="405.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Cache-Control: private,</text>
<text x="595.0" y="421.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">no-store</text>
<rect x="129.3" y="291.5" width="226.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="242.5" y="303.5" text-anchor="middle" font-size="12" fill="#0f172a">after 300 s or on change: re-render</text>
</svg>
