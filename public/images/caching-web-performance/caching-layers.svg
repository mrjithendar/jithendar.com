<polyline points="540.0,100 540.0,148" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#caching-layers-dashed)"/>
<polyline points="187.5,200 187.5,248" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#caching-layers-sync)"/>
