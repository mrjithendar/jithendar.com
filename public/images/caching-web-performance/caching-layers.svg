<rect x="30" y="36" width="315" height="64" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="187.5" y="59.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Browser cache</text>
<text x="187.5" y="75.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">/_next/static/*: 1 year, immutable</text>
<text x="187.5" y="91.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">optimised images: 1 year · icon: 1 day</text>
<rect x="390" y="36" width="300" height="64" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="540.0" y="59.0" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">CDN (not deployed)</text>
<text x="540.0" y="75.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">could honour s-maxage=300</text>
<text x="540.0" y="91.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">stale-while-revalidate ≤ 1 day</text>
<rect x="30" y="148" width="660" height="52" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.4"/>
<text x="360.0" y="173.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">Istio ingress gateway</text>
<text x="360.0" y="189.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">TLS, Brotli/zstd compression (an article: 1.1 MB of HTML → 108 KB)</text>
<rect x="30" y="248" width="315" height="64" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="187.5" y="271.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Next.js proxy (middleware)</text>
<text x="187.5" y="287.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">410 Gone, redirects, maintenance mode</text>
<text x="187.5" y="303.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">runs before the cache</text>
<rect x="30" y="346" width="315" height="80" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="187.5" y="369.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">ISR page cache (in memory)</text>
<text x="187.5" y="385.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">cache-handler.mjs, ≤ 64 MB, LRU</text>
<text x="187.5" y="401.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">hit: 5–9 ms · refresh after 300 s</text>
<text x="187.5" y="417.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">cleared at once when content changes</text>
<rect x="30" y="460" width="315" height="64" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="187.5" y="483.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Render on a miss</text>
<text x="187.5" y="499.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">React Server Components + MDX</text>
<text x="187.5" y="515.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">≈ 0.49 s for an article</text>
<rect x="30" y="558" width="315" height="64" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="187.5" y="589.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">Content cache (per process)</text>
<text x="187.5" y="605.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">30 s TTL + bus invalidation</text>
<rect x="390" y="346" width="300" height="80" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="540.0" y="369.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Image optimiser (next/image)</text>
<text x="540.0" y="385.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">sharp: AVIF / WebP, quality 75</text>
<text x="540.0" y="401.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">widths 96–1920 px</text>
<text x="540.0" y="417.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">disk cache 30 days, ≤ 200 MB</text>
<rect x="390" y="558" width="300" height="64" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="540.0" y="581.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4c0519">Cache bus (Valkey pub/sub)</text>
<text x="540.0" y="597.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">{kind, origin} messages only</text>
<text x="540.0" y="613.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">every pod clears its page cache</text>
<rect x="30" y="680" width="315" height="52" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="187.5" y="705.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">PostgreSQL</text>
<text x="187.5" y="721.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">posts, pages, settings, categories</text>
<rect x="390" y="680" width="300" height="52" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="540.0" y="705.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Cloudflare R2</text>
<text x="540.0" y="721.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">original uploads (e.g. an 860 KB JPEG)</text>
