<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760" role="img" aria-labelledby="caching-layers-title caching-layers-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="caching-layers-title">The caching layers of jithendar.com, from the browser to the database</title>
<desc id="caching-layers-desc">A request first meets the browser cache, which keeps Next.js static files and optimised images for a year. An optional CDN could honour s-maxage=300 but is not deployed. The Istio ingress terminates TLS and compresses responses. In the Next.js pod the proxy runs first, then pages come from the in-memory ISR page cache in 5 to 9 milliseconds; a miss renders the page in about half a second from the per-process content cache and PostgreSQL. Images go to the next/image optimiser, which encodes AVIF or WebP with sharp, keeps the result on disk for 30 days and reads the original from Cloudflare R2 only on a miss. The cache bus over Valkey clears the page cache on every pod when content changes.</desc>
<rect width="720" height="760" fill="#ffffff"/>
<defs>
<marker id="caching-layers-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="caching-layers-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="caching-layers-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="caching-layers-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="caching-layers-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="caching-layers-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="345" height="100" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Reader&#x27;s device</text>
<rect x="375" y="12" width="330" height="100" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="383" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Edge (optional)</text>
<rect x="15" y="124" width="690" height="88" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="140" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Cluster ingress</text>
<rect x="15" y="224" width="690" height="420" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
