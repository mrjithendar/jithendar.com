<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="pod-warmup-title pod-warmup-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="pod-warmup-title">Static generation without a build-time database</title>
<desc id="pod-warmup-desc">The build has no database, so pages are not prerendered at build time. When a pod starts it runs migrations, connects the cache bus and warms the content cache. Once it answers its health check, the warm-up reads the pod&#x27;s own sitemap and requests every page, two at a time, so the page cache is full before readers arrive. When the cache is cleared, the warm-up runs again ten seconds later; a burst of edits leads to one pass.</desc>
<rect width="720" height="520" fill="#ffffff"/>
<defs>
<marker id="pod-warmup-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="pod-warmup-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="pod-warmup-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="pod-warmup-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="pod-warmup-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="pod-warmup-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<polyline points="230,62.0 260,62.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#pod-warmup-sync)"/>
<polyline points="460,62.0 490,62.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#pod-warmup-sync)"/>
<polyline points="590.0,94 590.0,150" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#pod-warmup-sync)"/>
<polyline points="490,182.0 460,182.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#pod-warmup-sync)"/>
<polyline points="260,182.0 230,182.0" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#pod-warmup-write)"/>
<polyline points="130.0,214 130.0,300" fill="none" stroke="#be123c" stroke-width="2.2" marker-end="url(#pod-warmup-async)"/>
<polyline points="230,332.0 260,332.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#pod-warmup-sync)"/>
<polyline points="460,332.0 490,332.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#pod-warmup-sync)"/>
<polyline points="590.0,300 590.0,214" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#pod-warmup-sync)"/>
<polyline points="590.0,364 590,456 580,456.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#pod-warmup-dashed)"/>
<rect x="30" y="30" width="200" height="64" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="130.0" y="53.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Pod starts</text>
<text x="130.0" y="69.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">image from CI, no database</text>
<text x="130.0" y="85.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">used at build time</text>
<rect x="260" y="30" width="200" height="64" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="360.0" y="53.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">instrumentation.ts</text>
<text x="360.0" y="69.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">migrations, cache bus,</text>
<text x="360.0" y="85.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">content cache warm-up</text>
<rect x="490" y="30" width="200" height="64" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="590.0" y="61.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Server ready</text>
<text x="590.0" y="77.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">GET /api/health → 200</text>
<rect x="490" y="150" width="200" height="64" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="590.0" y="173.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Warm-up</text>
<text x="590.0" y="189.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">GET /sitemap.xml on 127.0.0.1</text>
<text x="590.0" y="205.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">+ feeds, search index</text>
<rect x="260" y="150" width="200" height="64" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="360.0" y="173.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Render every page</text>
<text x="360.0" y="189.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">2 at a time</text>
<text x="360.0" y="205.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">≈ 0.5 s each on a cold pod</text>
<rect x="30" y="150" width="200" height="64" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="130.0" y="173.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">Page cache full</text>
<text x="130.0" y="189.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">readers get HITs</text>
<text x="130.0" y="205.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">from the first request</text>
<rect x="30" y="300" width="200" height="64" rx="7" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
<text x="130.0" y="323.0" text-anchor="middle" font-size="14" font-weight="600" fill="#4c0519">Cache cleared</text>
<text x="130.0" y="339.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">publish, edit, settings</text>
<text x="130.0" y="355.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">(this pod or another)</text>
<rect x="260" y="300" width="200" height="64" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="360.0" y="331.0" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Wait 10 s</text>
<text x="360.0" y="347.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">more clears restart the timer</text>
<rect x="490" y="300" width="200" height="64" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="590.0" y="331.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Warm-up again</text>
<text x="590.0" y="347.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">one pass per burst</text>
<rect x="140" y="420" width="440" height="72" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="360.0" y="447.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Prometheus + Grafana</text>
<text x="360.0" y="463.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">jithendar_page_cache_{hits,misses,clears}_total</text>
<text x="360.0" y="479.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">jithendar_page_warmups_total, _duration_seconds</text>
<rect x="593.9" y="248.5" width="64.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="626.0" y="260.5" text-anchor="middle" font-size="12" fill="#0f172a">same pass</text>
</svg>
