<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" role="img" aria-labelledby="image-pipeline-title image-pipeline-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="image-pipeline-title">From an 860 KB upload to a 9 KB card image</title>
<desc id="image-pipeline-desc">An author uploads an image; the site checks its real type and size and stores the original in Cloudflare R2. A reader&#x27;s browser picks a width from the srcset and says which formats it accepts. The next/image optimiser reads the original once, resizes and encodes it with sharp, keeps the result on disk for 30 days and sends it with a one-year cache lifetime. Measured on the live site: 860 KB original, 116 KB JPEG, 86 KB WebP or 47 KB AVIF at 1200 pixels, 9 KB AVIF at 384 pixels.</desc>
<rect width="720" height="600" fill="#ffffff"/>
<defs>
<marker id="image-pipeline-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="image-pipeline-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="image-pipeline-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="image-pipeline-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="image-pipeline-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="image-pipeline-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="690" height="100" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Upload (once)</text>
<rect x="15" y="128" width="690" height="300" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="144" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Every image request</text>
<rect x="15" y="444" width="690" height="144" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="460" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Measured on jithendar.com (one cover image)</text>
<polyline points="220,68.0 265,68.0" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#image-pipeline-write)"/>
<polyline points="455,68.0 500,68.0" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#image-pipeline-write)"/>
<polyline points="220,222.0 265,222.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#image-pipeline-sync)"/>
<polyline points="455,222.0 500,222.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#image-pipeline-sync)"/>
<polyline points="557.0,100 557,140 360,140 360.0,176" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#image-pipeline-dashed)"/>
<polyline points="360.0,268 360.0,330" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#image-pipeline-sync)"/>
<polyline points="265,356.0 125,356 125.0,268" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#image-pipeline-dashed)"/>
<rect x="30" y="36" width="190" height="64" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="125.0" y="67.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Author</text>
<text x="125.0" y="83.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">admin media library</text>
<rect x="265" y="36" width="190" height="64" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="360.0" y="59.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Upload check</text>
<text x="360.0" y="75.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">real type from the bytes</text>
<text x="360.0" y="91.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">≤ 10 MB</text>
<rect x="500" y="36" width="190" height="64" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="595.0" y="67.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Cloudflare R2</text>
<text x="595.0" y="83.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">original kept as uploaded</text>
<rect x="30" y="176" width="190" height="92" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="125.0" y="205.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Reader&#x27;s browser</text>
<text x="125.0" y="221.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">srcset + sizes: picks a width</text>
<text x="125.0" y="237.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Accept: image/avif, webp</text>
<text x="125.0" y="253.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">lazy, async decoding</text>
<rect x="265" y="176" width="190" height="92" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="360.0" y="205.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">next/image optimiser</text>
<text x="360.0" y="221.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">sharp: resize + encode</text>
<text x="360.0" y="237.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">AVIF → WebP → original</text>
<text x="360.0" y="253.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">quality 75</text>
<rect x="500" y="176" width="190" height="92" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="595.0" y="213.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">Optimised-image cache</text>
<text x="595.0" y="229.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">pod disk, 30 days</text>
<text x="595.0" y="245.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">≤ 200 MB, per pod</text>
<rect x="265" y="330" width="425" height="52" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="477.5" y="355.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Response</text>
<text x="477.5" y="371.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Cache-Control: public, max-age=31536000 · the browser asks once</text>
<rect x="30" y="480" width="150" height="92" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="105.0" y="517.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Original</text>
<text x="105.0" y="533.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">JPEG</text>
<text x="105.0" y="549.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">860 KB</text>
<rect x="200" y="480" width="150" height="92" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="275.0" y="509.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">1200 px</text>
<text x="275.0" y="525.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">JPEG 116 KB</text>
<text x="275.0" y="541.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">WebP 86 KB</text>
<text x="275.0" y="557.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">AVIF 47 KB</text>
<rect x="370" y="480" width="150" height="92" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="445.0" y="509.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">384 px (cards)</text>
<text x="445.0" y="525.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">AVIF 9 KB</text>
<text x="445.0" y="541.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">≈ 1 % of the</text>
<text x="445.0" y="557.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">original</text>
<rect x="540" y="480" width="150" height="92" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="615.0" y="517.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Saving</text>
<text x="615.0" y="533.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">≈ 95 % at 1200 px</text>
<text x="615.0" y="549.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">AVIF vs the upload</text>
<rect x="219.8" y="201.5" width="45.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="242.5" y="213.5" text-anchor="middle" font-size="12" fill="#0f172a">w=1200</text>
<rect x="464.1" y="201.5" width="26.7" height="17" fill="#ffffff" opacity="0.92"/>
<text x="477.5" y="213.5" text-anchor="middle" font-size="12" fill="#0f172a">hit</text>
<rect x="371.9" y="121.5" width="95.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="419.5" y="133.5" text-anchor="middle" font-size="12" fill="#0f172a">miss: original</text>
<rect x="75.8" y="347.5" width="70.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="111.0" y="359.5" text-anchor="middle" font-size="12" fill="#0f172a">AVIF 47 KB</text>
</svg>
