<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img" aria-labelledby="isr-request-lifecycle-title isr-request-lifecycle-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="isr-request-lifecycle-title">One page over time: a miss, hits, then a background refresh</title>
<desc id="isr-request-lifecycle-desc">The first request misses the page cache, renders the page from PostgreSQL in about half a second and stores it. The next requests are answered from memory in milliseconds. After 300 seconds the entry is stale: the next visitor still gets it at once, while Next.js re-renders the page in the background and replaces the entry. A change in the admin clears the cache before that, so the next request renders the new version.</desc>
<rect width="720" height="640" fill="#ffffff"/>
<defs>
<marker id="isr-request-lifecycle-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="isr-request-lifecycle-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="isr-request-lifecycle-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="isr-request-lifecycle-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="isr-request-lifecycle-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="isr-request-lifecycle-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<line x1="105.0" y1="66" x2="105.0" y2="624" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="275.0" y1="66" x2="275.0" y2="624" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="445.0" y1="66" x2="445.0" y2="624" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="615.0" y1="66" x2="615.0" y2="624" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<polyline points="105.5,100.0 274.5,100.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#isr-request-lifecycle-sync)"/>
<polyline points="275.5,132.0 444.5,132.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#isr-request-lifecycle-sync)"/>
<polyline points="275.5,164.0 614.5,164.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#isr-request-lifecycle-sync)"/>
<polyline points="275.5,208.0 444.5,208.0" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#isr-request-lifecycle-write)"/>
<polyline points="274.5,240.0 105.5,240.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#isr-request-lifecycle-dashed)"/>
<polyline points="105.5,292.0 274.5,292.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#isr-request-lifecycle-sync)"/>
<polyline points="275.5,324.0 444.5,324.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#isr-request-lifecycle-sync)"/>
<polyline points="274.5,356.0 105.5,356.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#isr-request-lifecycle-dashed)"/>
<polyline points="105.5,468.0 274.5,468.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#isr-request-lifecycle-sync)"/>
<polyline points="274.5,500.0 105.5,500.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#isr-request-lifecycle-dashed)"/>
<polyline points="275.5,532.0 614.5,532.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#isr-request-lifecycle-sync)"/>
<polyline points="275.5,576.0 444.5,576.0" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#isr-request-lifecycle-write)"/>
<rect x="30" y="16" width="150" height="50" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="105.0" y="48.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Visitor</text>
<rect x="200" y="16" width="150" height="50" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="275.0" y="48.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Next.js server</text>
<rect x="370" y="16" width="150" height="50" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="445.0" y="40.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">ISR page cache</text>
<text x="445.0" y="56.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">in memory</text>
<rect x="540" y="16" width="150" height="50" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="615.0" y="48.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">PostgreSQL</text>
<rect x="357" y="384" width="176" height="44" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="445.0" y="405.0" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">300 s later</text>
<text x="445.0" y="421.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">the entry is stale</text>
<rect x="79.9" y="78.5" width="220.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="190.0" y="90.5" text-anchor="middle" font-size="12" fill="#0f172a">1. GET /blog/my-post (first visit)</text>
<rect x="315.4" y="110.5" width="89.1" height="17" fill="#ffffff" opacity="0.92"/>
<text x="360.0" y="122.5" text-anchor="middle" font-size="12" fill="#0f172a">2. get → miss</text>
<rect x="366.1" y="142.5" width="157.8" height="17" fill="#ffffff" opacity="0.92"/>
<text x="445.0" y="154.5" text-anchor="middle" font-size="12" fill="#0f172a">3. read the post, render</text>
<rect x="290.5" y="186.5" width="139.0" height="17" fill="#ffffff" opacity="0.92"/>
<text x="360.0" y="198.5" text-anchor="middle" font-size="12" fill="#0f172a">4. set (generation g)</text>
<rect x="117.4" y="218.5" width="145.3" height="17" fill="#ffffff" opacity="0.92"/>
<text x="190.0" y="230.5" text-anchor="middle" font-size="12" fill="#0f172a">5. 200, MISS, ≈ 0.49 s</text>
<rect x="123.6" y="270.5" width="132.8" height="17" fill="#ffffff" opacity="0.92"/>
<text x="190.0" y="282.5" text-anchor="middle" font-size="12" fill="#0f172a">6. GET /blog/my-post</text>
<rect x="318.6" y="302.5" width="82.9" height="17" fill="#ffffff" opacity="0.92"/>
<text x="360.0" y="314.5" text-anchor="middle" font-size="12" fill="#0f172a">7. get → hit</text>
<rect x="126.7" y="334.5" width="126.6" height="17" fill="#ffffff" opacity="0.92"/>
<text x="190.0" y="346.5" text-anchor="middle" font-size="12" fill="#0f172a">8. 200, HIT, 5–9 ms</text>
<rect x="123.6" y="446.5" width="132.8" height="17" fill="#ffffff" opacity="0.92"/>
<text x="190.0" y="458.5" text-anchor="middle" font-size="12" fill="#0f172a">9. GET /blog/my-post</text>
<rect x="86.2" y="478.5" width="207.7" height="17" fill="#ffffff" opacity="0.92"/>
<text x="190.0" y="490.5" text-anchor="middle" font-size="12" fill="#0f172a">10. 200, the stale copy, at once</text>
<rect x="344.3" y="510.5" width="201.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="445.0" y="522.5" text-anchor="middle" font-size="12" fill="#0f172a">11. re-render in the background</text>
<rect x="293.6" y="554.5" width="132.8" height="17" fill="#ffffff" opacity="0.92"/>
<text x="360.0" y="566.5" text-anchor="middle" font-size="12" fill="#0f172a">12. set: fresh entry</text>
</svg>
