<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="lets-encrypt-acme-flow-title lets-encrypt-acme-flow-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="lets-encrypt-acme-flow-title">How an ACME client obtains a certificate from Let&#x27;s Encrypt</title>
<desc id="lets-encrypt-acme-flow-desc">Five rows, the ACME client on the left and Let&#x27;s Encrypt on the right. The client registers an account key, creates an order for its names and receives one challenge token per name. It publishes the proof over HTTP or DNS, Let&#x27;s Encrypt validates it from several networks, the client sends a CSR, and Let&#x27;s Encrypt returns the signed certificate with its intermediate chain. Renewal repeats the same steps.</desc>
<rect width="900" height="560" fill="#ffffff"/>
<defs>
<marker id="lets-encrypt-acme-flow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="lets-encrypt-acme-flow-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="lets-encrypt-acme-flow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="lets-encrypt-acme-flow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="lets-encrypt-acme-flow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="lets-encrypt-acme-flow-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="420" height="536" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Your server: ACME client (Certbot, cert-manager, Caddy)</text>
<rect x="465" y="12" width="420" height="536" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="473" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Let&#x27;s Encrypt (ACME server)</text>
<polyline points="420,78.0 480,78.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#lets-encrypt-acme-flow-sync)"/>
<polyline points="420,180.0 480,180.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#lets-encrypt-acme-flow-sync)"/>
<polyline points="480,282.0 420,282.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#lets-encrypt-acme-flow-dashed)"/>
<polyline points="420,384.0 480,384.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#lets-encrypt-acme-flow-sync)"/>
<polyline points="480,486.0 420,486.0" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#lets-encrypt-acme-flow-write)"/>
<polyline points="225.0,116 225.0,142" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#lets-encrypt-acme-flow-dashed)"/>
<polyline points="225.0,218 225.0,244" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#lets-encrypt-acme-flow-dashed)"/>
<polyline points="225.0,320 225.0,346" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#lets-encrypt-acme-flow-dashed)"/>
<polyline points="225.0,422 225.0,448" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#lets-encrypt-acme-flow-dashed)"/>
<polyline points="675.0,218 675.0,244" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#lets-encrypt-acme-flow-dashed)"/>
<polyline points="675.0,422 675.0,448" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#lets-encrypt-acme-flow-dashed)"/>
<rect x="30" y="40" width="390" height="76" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="225.0" y="77.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">1. Register an account</text>
<text x="225.0" y="93.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">account key pair signs every request</text>
<rect x="30" y="142" width="390" height="76" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="225.0" y="179.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">2. Create an order</text>
<text x="225.0" y="195.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">names: example.com, www.example.com</text>
<rect x="30" y="244" width="390" height="76" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="225.0" y="281.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">4. Publish the proof</text>
<text x="225.0" y="297.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">HTTP path or DNS TXT record</text>
<rect x="30" y="346" width="390" height="76" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="225.0" y="383.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">6. Finalize with a CSR</text>
<text x="225.0" y="399.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">certificate private key stays here</text>
<rect x="30" y="448" width="390" height="76" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="225.0" y="485.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">8. Install certificate + chain</text>
<text x="225.0" y="501.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">reload the server; renew = repeat</text>
<rect x="480" y="40" width="390" height="76" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="675.0" y="77.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Account stored</text>
<text x="675.0" y="93.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">public key only</text>
<rect x="480" y="142" width="390" height="76" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="675.0" y="179.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">3. Return challenges</text>
<text x="675.0" y="195.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">one random token per name</text>
<rect x="480" y="244" width="390" height="76" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="675.0" y="281.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">5. Validate</text>
<text x="675.0" y="297.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">fetches the proof from several networks</text>
<rect x="480" y="346" width="390" height="76" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="675.0" y="383.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">7. Sign the certificate</text>
<text x="675.0" y="399.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">logged to Certificate Transparency</text>
<rect x="480" y="448" width="390" height="76" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="675.0" y="485.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Certificate + intermediate</text>
<text x="675.0" y="501.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">90 days today, 45 days by Feb 2028</text>
</svg>
