<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="lets-encrypt-challenge-types-title lets-encrypt-challenge-types-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="lets-encrypt-challenge-types-title">HTTP-01 proves control of a web server, DNS-01 proves control of the DNS zone</title>
<desc id="lets-encrypt-challenge-types-desc">Two columns. HTTP-01: the ACME client writes a token file, and Let&#x27;s Encrypt fetches it from port 80 of the server at /.well-known/acme-challenge. It needs a public port 80 and cannot issue wildcards. DNS-01: the ACME client calls the DNS provider&#x27;s API to create a TXT record at _acme-challenge, and Let&#x27;s Encrypt looks it up. It needs a DNS API token, works for private hosts and is the only way to get a wildcard certificate.</desc>
<rect width="900" height="440" fill="#ffffff"/>
<defs>
<marker id="lets-encrypt-challenge-types-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="lets-encrypt-challenge-types-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="lets-encrypt-challenge-types-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="lets-encrypt-challenge-types-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="lets-encrypt-challenge-types-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="lets-encrypt-challenge-types-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="420" height="416" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">HTTP-01: needs public port 80, no wildcards</text>
<rect x="465" y="12" width="420" height="416" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="473" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">DNS-01: needs a DNS API token, wildcards allowed</text>
<polyline points="225.0,116 225.0,180" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#lets-encrypt-challenge-types-dashed)"/>
<polyline points="225.0,320 225.0,256" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#lets-encrypt-challenge-types-write)"/>
<polyline points="675.0,116 675.0,180" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#lets-encrypt-challenge-types-dashed)"/>
<polyline points="675.0,320 675.0,256" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#lets-encrypt-challenge-types-write)"/>
<rect x="30" y="40" width="390" height="76" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="225.0" y="69.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Let&#x27;s Encrypt validators</text>
<text x="225.0" y="85.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">GET http://example.com/.well-known/</text>
<text x="225.0" y="101.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">acme-challenge/&lt;token&gt;</text>
<rect x="30" y="180" width="390" height="76" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.4"/>
<text x="225.0" y="209.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">Your server or ingress, port 80</text>
<text x="225.0" y="225.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">serves the token file</text>
<text x="225.0" y="241.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">redirects to HTTPS are followed</text>
<rect x="30" y="320" width="390" height="76" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="225.0" y="349.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">ACME client</text>
<text x="225.0" y="365.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">writes the token before validation</text>
<text x="225.0" y="381.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">removes it afterwards</text>
<rect x="480" y="40" width="390" height="76" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="675.0" y="69.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Let&#x27;s Encrypt validators</text>
<text x="675.0" y="85.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">TXT lookup</text>
<text x="675.0" y="101.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">_acme-challenge.example.com</text>
<rect x="480" y="180" width="390" height="76" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="675.0" y="209.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">Authoritative DNS (your provider)</text>
<text x="675.0" y="225.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">holds the TXT record</text>
<text x="675.0" y="241.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">the web server is never contacted</text>
<rect x="480" y="320" width="390" height="76" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="675.0" y="349.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">ACME client</text>
<text x="675.0" y="365.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">creates the record over the DNS API</text>
<text x="675.0" y="381.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">token scoped to one zone</text>
<rect x="235.4" y="139.5" width="39.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="255.0" y="151.5" text-anchor="middle" font-size="12" fill="#0f172a">fetch</text>
<rect x="235.4" y="279.5" width="39.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="255.0" y="291.5" text-anchor="middle" font-size="12" fill="#0f172a">token</text>
<rect x="685.4" y="139.5" width="39.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="705.0" y="151.5" text-anchor="middle" font-size="12" fill="#0f172a">query</text>
<rect x="687.6" y="279.5" width="26.7" height="17" fill="#ffffff" opacity="0.92"/>
<text x="701.0" y="291.5" text-anchor="middle" font-size="12" fill="#0f172a">TXT</text>
</svg>
