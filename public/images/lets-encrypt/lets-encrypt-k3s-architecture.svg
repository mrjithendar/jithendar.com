<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="lets-encrypt-k3s-architecture-title lets-encrypt-k3s-architecture-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="lets-encrypt-k3s-architecture-title">TLS on mk4: cert-manager issues one wildcard certificate over DNS-01 and the Istio gateway serves it</title>
<desc id="lets-encrypt-k3s-architecture-desc">Outside the cluster: a visitor, Cloudflare DNS for the zone jithendar.com and Let&#x27;s Encrypt. A Hetzner load balancer named mk4-edge forwards ports 80 and 443 with a PROXY protocol header to the Istio ingress gateway in the k3s cluster, which terminates TLS with the Secret jithendar-com-gateway-tls. In namespace cert-manager, cert-manager v1.20.4 uses the ClusterIssuer letsencrypt-dns and the Secret cloudflare-api-token to write a TXT record through the Cloudflare API, Let&#x27;s Encrypt looks the record up and signs, and cert-manager writes the certificate into the gateway Secret. A second Certificate, jithendar-com-wildcard in namespace jithendar, holds the same names. No HTTP route is involved in issuance or renewal.</desc>
