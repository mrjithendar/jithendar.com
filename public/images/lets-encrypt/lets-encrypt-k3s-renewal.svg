<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="lets-encrypt-k3s-renewal-title lets-encrypt-k3s-renewal-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="lets-encrypt-k3s-renewal-title">How cert-manager renews the wildcard certificate with no manual step</title>
<desc id="lets-encrypt-k3s-renewal-desc">A loop of eight steps. The Certificate is Ready and cert-manager records a renewal time two thirds of the way through the certificate&#x27;s lifetime, day 60 of 90. When that time passes it marks the Certificate as Issuing, generates a new private key and a CertificateRequest, and creates an ACME Order with a DNS-01 Challenge. It writes a TXT record through the Cloudflare API and checks it over DNS over HTTPS. Let&#x27;s Encrypt validates and signs. cert-manager replaces tls.crt and tls.key in the same Secret, and the Istio gateway picks the Secret up without a restart. If a step fails, cert-manager retries with a backoff from 1 hour up to 32 hours while the old certificate keeps working for about 30 more days.</desc>
<rect width="900" height="520" fill="#ffffff"/>
<defs>
<marker id="lets-encrypt-k3s-renewal-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="lets-encrypt-k3s-renewal-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="lets-encrypt-k3s-renewal-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="lets-encrypt-k3s-renewal-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="lets-encrypt-k3s-renewal-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="lets-encrypt-k3s-renewal-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="870" height="130" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">cert-manager decides</text>
<rect x="15" y="158" width="870" height="130" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="174" text-anchor="start" font-size="12" font-weight="600" fill="#475569">ACME DNS-01 round trip</text>
<rect x="15" y="304" width="870" height="204" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="320" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Result</text>
<polyline points="300,84.0 315,84.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#lets-encrypt-k3s-renewal-sync)"/>
<polyline points="585,84.0 600,84.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#lets-encrypt-k3s-renewal-sync)"/>
<polyline points="735.0,128 735.0,186" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#lets-encrypt-k3s-renewal-sync)"/>
<polyline points="600,230.0 585,230.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#lets-encrypt-k3s-renewal-sync)"/>
<polyline points="315,230.0 300,230.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#lets-encrypt-k3s-renewal-sync)"/>
<polyline points="165.0,274 165.0,332" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#lets-encrypt-k3s-renewal-write)"/>
<polyline points="300,376.0 315,376.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#lets-encrypt-k3s-renewal-sync)"/>
<polyline points="735.0,274 735.0,332" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#lets-encrypt-k3s-renewal-dashed)"/>
<polyline points="30,376.0 22,376 22,84 30,84.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#lets-encrypt-k3s-renewal-dashed)"/>
<rect x="30" y="40" width="270" height="88" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="165.0" y="75.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">1. Certificate Ready</text>
<text x="165.0" y="91.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">status.renewalTime set at</text>
<text x="165.0" y="107.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">2/3 of the lifetime (day 60 of 90)</text>
<rect x="315" y="40" width="270" height="88" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="450.0" y="75.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">2. Renewal time passes</text>
<text x="450.0" y="91.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">condition Issuing = True</text>
<text x="450.0" y="107.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">no cron job, no human</text>
<rect x="600" y="40" width="270" height="88" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="735.0" y="75.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">3. New key + CertificateRequest</text>
<text x="735.0" y="91.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">rotationPolicy Always by default</text>
<text x="735.0" y="107.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">since cert-manager v1.18</text>
<rect x="600" y="186" width="270" height="88" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="735.0" y="229.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">4. Order + DNS-01 Challenge</text>
<text x="735.0" y="245.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">one authorization per name</text>
<rect x="315" y="186" width="270" height="88" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="450.0" y="221.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">5. TXT record via Cloudflare API</text>
<text x="450.0" y="237.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">self-check over DNS over HTTPS</text>
<text x="450.0" y="253.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">(pods cannot reach port 53)</text>
<rect x="30" y="186" width="270" height="88" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="165.0" y="221.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">6. Let&#x27;s Encrypt validates</text>
<text x="165.0" y="237.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">looks up the TXT record</text>
<text x="165.0" y="253.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">signs the certificate</text>
<rect x="30" y="332" width="270" height="88" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="165.0" y="375.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">7. Secret updated in place</text>
<text x="165.0" y="391.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">same name, new tls.crt + tls.key</text>
<rect x="315" y="332" width="270" height="88" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.4"/>
<text x="450.0" y="367.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">8. Istio gateway reloads</text>
<text x="450.0" y="383.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Envoy gets the Secret over SDS</text>
<text x="450.0" y="399.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">no pod restart</text>
<rect x="600" y="332" width="270" height="88" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="735.0" y="367.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">If a step fails</text>
<text x="735.0" y="383.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">retry: 1 h, doubling up to 32 h</text>
<text x="735.0" y="399.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">old certificate still valid ~30 days</text>
<text x="30" y="464" font-size="12" fill="#475569">The loop restarts with the new certificate. With 45-day certificates the same rule renews on day 30.</text>
<text x="30" y="486" font-size="12" fill="#475569">Nothing in the Certificate sets renewBefore, so the timing follows whatever lifetime Let&#x27;s Encrypt issues.</text>
</svg>
