# When flows start: cron in the schedule's time zone. A schedule's flow cannot change on import (rename it instead).
schedules:
  - name: ask-gaps
    flow: ask_gaps_flow
    description: Weekly Ask the Blog gap clustering.
    cron: 30 4 * * 1
    timezone: Etc/UTC
    inputs: {}
    enabled: true
  - name: content-ideas
    flow: content_ideas_flow
    description: Weekly content ideas from Search Console demand and Reddit threads.
    cron: 20 5 * * 2
    timezone: Etc/UTC
    inputs: {}
    enabled: true
  - name: ga4-sync
    flow: ga4_sync_flow
    description: Daily GA4 sync.
    cron: 20 6 * * *
    timezone: Etc/UTC
    inputs: {}
    enabled: true
  - name: gsc-sync
    flow: gsc_sync_flow
    description: Daily Search Console sync.
    cron: 10 6 * * *
    timezone: Etc/UTC
    inputs: {}
    enabled: true
  - name: internal-linking
    flow: internal_linking_flow
    description: Weekly internal links merged into open drafts, after the weekly drafts.
    cron: 0 9 * * 1
    timezone: Etc/UTC
    inputs: {}
    enabled: true
  - name: news-dispatch
    flow: news_dispatch_flow
    description: "Content flows: daily clean-up and gauges. The content flows themselves start on their own times (the one dispatcher)."
    cron: "*/15 * * * *"
    timezone: Etc/UTC
    inputs: {}
    enabled: true
  - name: news-style-review
    flow: news_style_review_flow
    description: Weekly writing-profile proposal from last week's edits (never applied automatically).
    cron: 30 3 * * 1
    timezone: Etc/UTC
    inputs: {}
    enabled: true
  - name: news-train
    flow: news_train_flow
    description: Weekly retraining of the news topic classifier and, with enough feedback, the ranker.
    cron: 30 2 * * 0
    timezone: Etc/UTC
    inputs: {}
    enabled: true
  - name: promotion
    flow: promotion_flow
    description: Daily channel scores and post drafts for newly published articles, after the Search Console sync.
    cron: 40 7 * * *
    timezone: Etc/UTC
    inputs: {}
    enabled: true
  - name: reindex
    flow: reindex_flow
    description: Weekly incremental reindex of the article embeddings (publishing also reindexes each article).
    cron: 17 3 * * 0
    timezone: Etc/UTC
    inputs: {}
    enabled: true
  - name: report-monthly
    flow: report_flow
    description: Monthly report and PDF, on the 2nd.
    cron: 0 8 2 * *
    timezone: Etc/UTC
    inputs:
      period: monthly
    enabled: true
  - name: report-weekly
    flow: report_flow
    description: Weekly report and PDF.
    cron: 0 8 * * 1
    timezone: Etc/UTC
    inputs:
      period: weekly
    enabled: true
  - name: seo-ml
    flow: seo_ml_flow
    description: Weekly SEO models (decay, query clusters, intent, priority, related) and the retrieval eval, after the reindex.
    cron: 47 4 * * 0
    timezone: Etc/UTC
    inputs: {}
    enabled: true
  - name: tech-audit
    flow: tech_audit_flow
    description: Weekly technical audit.
    cron: 0 3 * * 1
    timezone: Etc/UTC
    inputs: {}
    enabled: true
  - name: weekly-recommendations
    flow: weekly_recommendations_flow
    description: Weekly rules, scoring and the top drafts, after the syncs and the audit.
    cron: 0 7 * * 1
    timezone: Etc/UTC
    inputs: {}
    enabled: true
  - name: website-full-backup
    flow: backup_flow
    description: Creates a complete recoverable backup of jithendar.com
    cron: 0 2 * * *
    timezone: Asia/Kolkata
    inputs:
      type: full
      notify: always
    enabled: true
