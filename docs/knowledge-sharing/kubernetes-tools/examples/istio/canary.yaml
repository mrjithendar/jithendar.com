apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: shop-web
  namespace: shop
spec:
  host: shop-web
  subsets:
    - name: stable
      labels:
        version: v1
    - name: canary
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: shop-web
  namespace: shop
spec:
  hosts:
    - shop-web
  http:
    - route:
        - destination:
            host: shop-web
            subset: stable
          weight: 90
        - destination:
            host: shop-web
            subset: canary
          weight: 10
      retries:
        attempts: 2
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure
