apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop
resources:
  - ../../base
images:
  - name: registry.example.com/shop/web
    newTag: "1.5.0"
patches:
  - path: replicas.yaml
configMapGenerator:
  - name: shop-web-config
    behavior: merge
    literals:
      - LOG_LEVEL=warn
