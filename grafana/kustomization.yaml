# jithendar.com dashboards (Grafana folder "Jithendar.com"); each site has its own folder, sites/<domain>/grafana/, and
# its own ConfigMap name. Argo CD's `grafana` Application reads this folder, sites/jithendar.com/grafana
# (tools: deploy/minikube/applications/grafana.yaml); Grafana's file provider mounts the ConfigMap read-only and
# picks up changes within 30 s, no restart. Not part of kubernetes/: the deploy workflow never applies it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- name: grafana-dashboards-jithendar
  namespace: monitoring
  files:
  - jithendar-com-observability.json
  - jithendar-com-overview.json
  - jithendar-com-logs.json
  - jithendar-com-seo.json
  - jithendar-com-seo-agent.json
  - jithendar-com-news.json
  options:
    disableNameSuffixHash: true
    annotations:
      # ~90 KiB of JSON; client-side apply would store it again in an annotation.
      argocd.argoproj.io/sync-options: ServerSideApply=true
