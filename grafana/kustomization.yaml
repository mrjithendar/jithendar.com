# jithendar.com dashboards (Grafana folder "Jithendar.com"). Argo CD's `grafana` Application reads this folder
# (tools: deploy/minikube/applications/grafana.yaml); Grafana's file provider mounts the ConfigMap read-only and
# picks up changes within 30 s, no restart. Not part of minikube/: ./deploy.sh and CI never apply it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
- name: grafana-dashboards-jithendar
  namespace: monitoring
  files:
  - jithendar-com-observability.json
  - jithendar-com-overview.json
  - jithendar-com-logs.json
  options:
    disableNameSuffixHash: true
    annotations:
      # ~90 KiB of JSON; client-side apply would store it again in an annotation.
      argocd.argoproj.io/sync-options: ServerSideApply=true
