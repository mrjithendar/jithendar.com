# Traefik's default certificate for every namespace: routes for jithendar.com without their own
# secretName are served the certificate from 50-certificate.yaml. Only one `default` TLSStore may
# exist across the namespaces Traefik watches.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: jithendar
spec:
  defaultCertificate:
    secretName: jithendar-com-tls
