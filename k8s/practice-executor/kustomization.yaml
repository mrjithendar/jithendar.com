# Python practice executor on mk4, in namespace jithendar next to the site. NOT part of ../kustomization.yaml
# on purpose (./deploy.sh never applies it): apply it by hand, only after gVisor is installed
# (scripts/install-gvisor-mk4.sh), then prove isolation with scripts/verify-practice-sandbox.sh:
#   kubectl --context mk4 apply -k k8s/practice-executor
# After that first apply, CI (ci-practice-executor.yml, job "deploy") pins the image digests on every release, once
# repository variable PRACTICE_EXECUTOR_DEPLOY is "true". A later manual apply resets the images to :latest and the
# sandbox runtime to its placeholder: re-run the workflow afterwards to pin them again.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 05-runtimeclass.yaml
  - 10-rbac.yaml
  - 15-admission.yaml
  - 20-quota.yaml
  - 30-redis.yaml
  - 40-executor.yaml
  - 50-networkpolicies.yaml
