# Everything runs in namespace jithendar, next to the site. The dispatcher may create, read, read logs of and
# delete pods there; 15-admission.yaml limits that to sandbox pods (it cannot start a pod that mounts the
# site's Secrets, or delete the site's pods). Sandbox pods run as a service account with no permissions and no
# mounted token.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: practice-dispatcher
  namespace: jithendar
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: practice-api
  namespace: jithendar
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: practice-sandbox
  namespace: jithendar
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: practice-dispatcher
  namespace: jithendar
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: practice-dispatcher
  namespace: jithendar
subjects:
  - kind: ServiceAccount
    name: practice-dispatcher
    namespace: jithendar
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: practice-dispatcher
