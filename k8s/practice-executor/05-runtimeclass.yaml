# gVisor with networking disabled. The handler `runsc-nonet` must exist in containerd on every node
# (scripts/install-gvisor-mk4.sh): runsc with `network = "none"`, so sandbox pods only ever see a loopback
# interface — this does not depend on NetworkPolicy enforcement (mk4's kindnet does not enforce it).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor-nonet
  labels:
    app.kubernetes.io/part-of: python-practice
handler: runsc-nonet
overhead:
  podFixed:
    cpu: 50m
    memory: 64Mi
