# jithendar.com on mk4: kubectl --context mk4 apply -k k8s/
# Secrets (jithendar-com-env, jithendar-postgres, jithendar-redis, ecr-pull) are created separately and never committed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: jithendar

resources:
- 00-namespace.yaml
- 10-postgres.yaml
- 20-redis.yaml
- 30-jithendar-com.yaml
- 40-middlewares.yaml
- 50-certificate.yaml
- 60-ingress.yaml
- 70-observability.yaml

# Release: change only this digest (the image in 30-jithendar-com.yaml is replaced by it), e.g.
#   cd k8s && kustomize edit set image jithendar-com=881026659929.dkr.ecr.us-east-1.amazonaws.com/jithendar-com@sha256:<digest>
images:
- name: 881026659929.dkr.ecr.us-east-1.amazonaws.com/jithendar-com
  digest: sha256:850150f370b625c7ad5f927036da96ca58df3fe1eba004e912dc31b42d3bc836
