# Traefik middlewares: compression, HTTP to HTTPS and www to apex redirects
# Exported from the live mk4 cluster (namespace jithendar) on 2026-10-29; cluster-generated fields removed.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: jithendar
spec:
  compress:
    encodings:
    - zstd
    - br
    - gzip
    includedContentTypes:
    - text/html
    - text/css
    - text/plain
    - text/xml
    - text/javascript
    - application/javascript
    - application/json
    - application/xml
    - application/rss+xml
    - application/manifest+json
    - image/svg+xml
    minResponseBodyBytes: 1024
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: jithendar
spec:
  redirectScheme:
    permanent: true
    scheme: https
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-redirect
  namespace: jithendar
spec:
  redirectRegex:
    permanent: true
    regex: "^https?://www\\.jithendar\\.com/(.*)"
    replacement: https://jithendar.com/${1}
