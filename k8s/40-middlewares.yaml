# Traefik middlewares: compression, HTTP to HTTPS and www to apex redirects, stripping client trace headers
# Exported from the live mk4 cluster (namespace jithendar) on 2026-10-29; cluster-generated fields removed.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: jithendar
spec:
  compress:
    encodings:
    - zstd
    - br
    - gzip
    includedContentTypes:
    - text/html
    - text/css
    - text/plain
    - text/xml
    - text/javascript
    - application/javascript
    - application/json
    - application/xml
    - application/rss+xml
    - application/manifest+json
    - image/svg+xml
    minResponseBodyBytes: 1024
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  namespace: jithendar
spec:
  redirectScheme:
    permanent: true
    scheme: https
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-redirect
  namespace: jithendar
spec:
  redirectRegex:
    permanent: true
    regex: "^https?://www\\.jithendar\\.com/(.*)"
    replacement: https://jithendar.com/${1}
---
# Tracing headers from the internet are dropped: Next.js continues any incoming W3C trace context, so a visitor
# could pick the trace id that becomes their error reference, or send "-00" to switch off the trace, request
# metrics and request log line for their own requests. An empty value removes the header.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-trace-headers
  namespace: jithendar
spec:
  headers:
    customRequestHeaders:
      traceparent: ""
      tracestate: ""
      baggage: ""
