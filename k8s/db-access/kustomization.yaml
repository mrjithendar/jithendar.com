# Database access from outside the cluster, for two client IPs only (see README.md in this folder):
#   - https://jithendar.com/db/       Adminer web UI
#   - db.jithendar.com:443            PostgreSQL over TLS (Traefik terminates TLS, forwards to jithendar-postgres)
# Not part of ../kustomization.yaml, so ./deploy.sh never applies it. Apply on purpose:
#   kubectl --context mk4 apply -k k8s/db-access        remove: kubectl --context mk4 delete -k k8s/db-access
# Needs: client IPs reaching Traefik (tools: traefik proxyProtocol + expose-ingress.sh send-proxy-v2), the DNS record
# db.jithendar.com, and the login created by scripts/create-db-remote-user.sh.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- allowlist.yaml
- adminer.yaml
- postgres-tls.yaml
