# The only client addresses allowed to reach /db and db.jithendar.com. Edit both lists together.
#   122.177.247.138  the owner's Mac (public IP on 2026-11-04; home connections can change it: update and re-apply)
#   46.224.38.14     the Hetzner host itself (connections it makes to jithendar.com)
# Traefik sees real addresses only with the PROXY protocol on (DB_ACCESS.md). Without it every client looks like a
# minikube node (192.168.49.x), which is not listed, so everything is refused: the lists fail closed.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: db-allowlist
  namespace: jithendar
spec:
  ipAllowList:
    sourceRange:
    - 122.177.247.138/32
    - 46.224.38.14/32
---
apiVersion: traefik.io/v1alpha1
kind: MiddlewareTCP
metadata:
  name: db-allowlist
  namespace: jithendar
spec:
  ipAllowList:
    sourceRange:
    - 122.177.247.138/32
    - 46.224.38.14/32
