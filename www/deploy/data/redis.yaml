# Redis for jithendar.com: cache, session and rate-limit storage only. No persistence (the site
# falls back to Postgres if Redis restarts), so no volume and no node pinning.
apiVersion: v1
kind: Service
metadata:
  name: jithendar-redis
  labels:
    app: jithendar-redis
spec:
  selector:
    app: jithendar-redis
  ports:
  - name: redis
    port: 6379
    targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jithendar-redis
  labels:
    app: jithendar-redis
    app.kubernetes.io/part-of: jithendar-com
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jithendar-redis
  template:
    metadata:
      labels:
        app: jithendar-redis
        app.kubernetes.io/part-of: jithendar-com
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        image: redis:7.4-alpine
        command: ["sh", "-c"]
        args:
        - exec redis-server --requirepass "$REDIS_PASSWORD" --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no --protected-mode yes
        ports:
        - name: redis
          containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jithendar-redis
              key: password
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: jithendar-redis
              key: password
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          exec: &ping
            command: ["redis-cli", "ping"]
          periodSeconds: 10
        livenessProbe:
          exec: *ping
          periodSeconds: 30
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jithendar-redis
spec:
  podSelector:
    matchLabels:
      app: jithendar-redis
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: jithendar-com
    ports:
    - port: 6379
      protocol: TCP
  egress: []
