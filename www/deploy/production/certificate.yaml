# Canonical jithendar.com certificate. Formerly owned by the WordPress chart (SEO_AUDIT AUD-003);
# other namespaces reuse jithendar-com-tls through the Traefik TLSStore in this namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jithendar-com
spec:
  secretName: jithendar-com-tls
  dnsNames:
  - jithendar.com
  - www.jithendar.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
    group: cert-manager.io
