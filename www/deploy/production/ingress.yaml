# "/" is the lowest-priority route on jithendar.com: Traefik ranks longer rules first,
# so /argocd, /grafana, /prometheus and /roboshop keep their own ingresses.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jithendar-com
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: jithendar-compress@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - jithendar.com
    secretName: jithendar-com-tls
  rules:
  - host: jithendar.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jithendar-com
            port:
              name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jithendar-com-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: jithendar-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: jithendar.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jithendar-com
            port:
              name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jithendar-com-www
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: jithendar-www-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - www.jithendar.com
    secretName: jithendar-com-tls
  rules:
  - host: www.jithendar.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: jithendar-com
            port:
              name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jithendar-com-www-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: jithendar-www-redirect@kubernetescrd
spec:
  ingressClassName: traefik
