apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# www and http://www go straight to https://jithendar.com in one hop.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: www-redirect
spec:
  redirectRegex:
    regex: ^https?://www\.jithendar\.com/(.*)
    replacement: https://jithendar.com/${1}
    permanent: true
---
# Response compression at the edge (Next.js compression is off: next.config.ts `compress: false`).
# Text only: AVIF/WebP/PNG are already compressed and would only waste CPU.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
spec:
  compress:
    encodings: [zstd, br, gzip]
    minResponseBodyBytes: 1024
    includedContentTypes:
    - text/html
    - text/css
    - text/plain
    - text/xml
    - text/javascript
    - application/javascript
    - application/json
    - application/xml
    - application/rss+xml
    - application/manifest+json
    - image/svg+xml
