apiVersion: apps/v1
kind: Deployment
metadata:
  name: jithendar-com
  labels:
    app: jithendar-com
    app.kubernetes.io/part-of: jithendar-com
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: jithendar-com
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: jithendar-com
        app.kubernetes.io/part-of: jithendar-com
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
      - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: jithendar-com
      containers:
      - name: web
        image: jithendar-com
        ports:
        - name: http
          containerPort: 3000
        # DATABASE_URL, REDIS_URL, BETTER_AUTH_SECRET, SETTINGS_ENCRYPTION_KEY, ADMIN_BOOTSTRAP_TOKEN,
        # TURNSTILE_SITE_KEY/SECRET_KEY, optional SMTP_URL/MAIL_FROM, METRICS_TOKEN (scripts/create-secrets.sh);
        # R2_ACCOUNT_ID, R2_BUCKET, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, optional R2_PUBLIC_BASE_URL,
        # optional GEMINI_API_KEY + GEMINI_IMAGE_MODEL (scripts/set-media-config.sh).
        envFrom:
        - secretRef:
            name: jithendar-com-env
        # Public identifiers (search-engine verification, GA4, AdSense, ads.txt, IndexNow key), not secrets.
        # Optional: created by scripts/set-public-config.sh; the site runs without it.
        - configMapRef:
            name: jithendar-com-public
            optional: true
        env:
        - name: APP_ENV
          value: production
        - name: SITE_URL
          value: https://jithendar.com
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4318
        - name: OTEL_SERVICE_NAME
          value: jithendar-com
        - name: LOG_LEVEL
          value: info
        # Gemini "Generate image" limits (the feature is off until GEMINI_API_KEY/GEMINI_IMAGE_MODEL exist).
        - name: GEMINI_IMAGE_SIZE
          value: 1K
        - name: GEMINI_IMAGE_TIMEOUT_MS
          value: "90000"
        - name: GEMINI_IMAGE_USER_HOURLY_LIMIT
          value: "10"
        - name: GEMINI_IMAGE_USER_CONCURRENCY
          value: "1"
        - name: GEMINI_IMAGE_DAILY_LIMIT
          value: "50"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "1"
            # Image uploads (≤ 10 MB) are buffered and the optimiser (sharp) decodes originals in memory.
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet: &health
            path: /api/health
            port: http
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet: *health
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet: *health
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          # Let Traefik drop the endpoint before the server stops accepting connections.
          preStop:
            exec:
              command: ["sleep", "5"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: next-cache
          mountPath: /app/.next/cache
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: next-cache
        emptyDir:
          sizeLimit: 256Mi
