<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" width="620" height="620" role="img" aria-labelledby="roboshop-sequence-assistant-title roboshop-sequence-assistant-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="roboshop-sequence-assistant-title">AI-assisted shopping request</title>
<desc id="roboshop-sequence-assistant-desc">The widget posts a message to moks through web. moks checks the Origin and session, then calls ai-gateway /api/chat with a service token and the user&#x27;s session. ai-gateway loads saved history, the active LLM configuration and unavailable SKUs, then calls moks /internal/chat. moks reads the catalogue, retrieves evidence, confirms the configuration revision and calls the provider. ai-gateway reapplies stock and saves the turn.</desc>
<rect width="620" height="620" fill="#ffffff"/>
<defs>
<marker id="roboshop-sequence-assistant-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="roboshop-sequence-assistant-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
