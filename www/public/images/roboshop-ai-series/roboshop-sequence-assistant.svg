<rect x="460" y="16" width="130" height="50" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="525.0" y="40.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">catalogue</text>
<text x="525.0" y="56.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">/ provider</text>
<rect x="294" y="182" width="176" height="46" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="382.0" y="204.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Role and 10/min limit</text>
<text x="382.0" y="220.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">history, LLM snapshot</text>
<rect x="294" y="268" width="176" height="46" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="382.0" y="290.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Unavailable SKUs</text>
<text x="382.0" y="306.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">from the ledger</text>
<rect x="140" y="392" width="196" height="46" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="238.0" y="414.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">Retrieve 4 at most</text>
<text x="238.0" y="430.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">build evidence</text>
<rect x="75.1" y="74.5" width="182.7" height="17" fill="#ffffff" opacity="0.92"/>
<text x="166.5" y="86.5" text-anchor="middle" font-size="12" fill="#0f172a">1. POST /moks/chat {message}</text>
<rect x="246.7" y="106.5" width="126.6" height="17" fill="#ffffff" opacity="0.92"/>
<text x="310.0" y="118.5" text-anchor="middle" font-size="12" fill="#0f172a">2. GET /api/auth/me</text>
<rect x="234.2" y="129.0" width="151.5" height="32" fill="#ffffff" opacity="0.92"/>
<text x="310.0" y="141.0" text-anchor="middle" font-size="12" fill="#0f172a">3. POST /api/chat</text>
<text x="310.0" y="156.0" text-anchor="middle" font-size="12" fill="#0f172a">service token + rs_auth</text>
<rect x="384.0" y="236.5" width="139.0" height="17" fill="#ffffff" opacity="0.92"/>
<text x="453.5" y="248.5" text-anchor="middle" font-size="12" fill="#0f172a">4. GET catalogue, 2 s</text>
<rect x="218.6" y="326.5" width="182.7" height="17" fill="#ffffff" opacity="0.92"/>
<text x="310.0" y="338.5" text-anchor="middle" font-size="12" fill="#0f172a">5. POST /internal/chat, 18 s</text>
<rect x="315.1" y="360.5" width="132.8" height="17" fill="#ffffff" opacity="0.92"/>
<text x="381.5" y="372.5" text-anchor="middle" font-size="12" fill="#0f172a">6. GET /api/products</text>
<rect x="221.8" y="448.5" width="176.5" height="17" fill="#ffffff" opacity="0.92"/>
<text x="310.0" y="460.5" text-anchor="middle" font-size="12" fill="#0f172a">7. GET /internal/llm/config</text>
<rect x="280.8" y="480.5" width="201.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="381.5" y="492.5" text-anchor="middle" font-size="12" fill="#0f172a">8. Converse or Ollama /api/chat</text>
<rect x="234.2" y="512.5" width="151.5" height="17" fill="#ffffff" opacity="0.92"/>
<text x="310.0" y="524.5" text-anchor="middle" font-size="12" fill="#0f172a">9. answer, cards, usage</text>
<rect x="81.6" y="544.5" width="313.8" height="17" fill="#ffffff" opacity="0.92"/>
<text x="238.5" y="556.5" text-anchor="middle" font-size="12" fill="#0f172a">10. stock re-applied, turn saved: JSON, no stream</text>
</svg>
