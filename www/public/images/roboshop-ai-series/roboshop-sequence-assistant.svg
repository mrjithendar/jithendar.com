<rect x="30" y="16" width="130" height="50" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="95.0" y="40.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Widget</text>
<text x="95.0" y="56.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">browser</text>
<rect x="173" y="16" width="130" height="50" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="238.0" y="48.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">moks</text>
<rect x="317" y="16" width="130" height="50" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
