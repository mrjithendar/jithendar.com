<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 640" width="620" height="640" role="img" aria-labelledby="roboshop-sequence-checkout-title roboshop-sequence-checkout-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="roboshop-sequence-checkout-title">Checkout, payment and order events</title>
<desc id="roboshop-sequence-checkout-desc">The signed-in browser posts an order with an idempotency key. ai-gateway reserves stock in its ledger, then asks payment-service to create a Razorpay order and returns public checkout options. After payment the browser sends the signature for verification; payment-service verifies it and fetches the capture. ai-gateway marks the order paid and its outbox publishes to RabbitMQ for shipping-service and kafka-bridge. A signed webhook gives Razorpay a separate route to the same result.</desc>
<rect width="620" height="640" fill="#ffffff"/>
<defs>
<marker id="roboshop-sequence-checkout-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="roboshop-sequence-checkout-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="roboshop-sequence-checkout-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="roboshop-sequence-checkout-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="roboshop-sequence-checkout-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="roboshop-sequence-checkout-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
