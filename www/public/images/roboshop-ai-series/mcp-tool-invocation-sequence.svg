<polyline points="382.5,412.0 524.5,412.0" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#mcp-tool-invocation-sequence-write)"/>
<polyline points="524.5,446.0 382.5,446.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#mcp-tool-invocation-sequence-dashed)"/>
<polyline points="381.5,480.0 238.5,480.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#mcp-tool-invocation-sequence-dashed)"/>
<polyline points="237.5,566.0 95.5,566.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#mcp-tool-invocation-sequence-dashed)"/>
<rect x="30" y="16" width="130" height="50" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="95.0" y="48.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">MCP client</text>
<rect x="173" y="16" width="130" height="50" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="238.0" y="48.0" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">mcp-server</text>
<rect x="317" y="16" width="130" height="50" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="382.0" y="48.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">ai-gateway</text>
<rect x="460" y="16" width="130" height="50" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="525.0" y="40.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">cart-service</text>
<text x="525.0" y="56.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Redis</text>
<rect x="148" y="108" width="180" height="46" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="238.0" y="130.0" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">Transport guards</text>
<text x="238.0" y="146.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Host, Origin, 256 KiB</text>
<rect x="148" y="232" width="180" height="46" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="238.0" y="254.0" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">Tool guards</text>
<text x="238.0" y="270.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">role, schema, admission</text>
<rect x="284" y="334" width="196" height="46" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="382.0" y="356.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Session and Origin</text>
<text x="382.0" y="372.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">ownership, stock, pending</text>
<rect x="148" y="490" width="180" height="46" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4"/>
<text x="238.0" y="512.0" text-anchor="middle" font-size="14" font-weight="600" fill="#134e4a">Shape the result</text>
<text x="238.0" y="528.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">validate output schema</text>
<rect x="59.5" y="74.5" width="213.9" height="17" fill="#ffffff" opacity="0.92"/>
<text x="166.5" y="86.5" text-anchor="middle" font-size="12" fill="#0f172a">1. tools/call update_cart, Bearer</text>
<rect x="215.5" y="164.5" width="189.0" height="17" fill="#ffffff" opacity="0.92"/>
<text x="310.0" y="176.5" text-anchor="middle" font-size="12" fill="#0f172a">2. GET /api/auth/me, no cache</text>
<rect x="246.7" y="198.5" width="126.6" height="17" fill="#ffffff" opacity="0.92"/>
<text x="310.0" y="210.5" text-anchor="middle" font-size="12" fill="#0f172a">3. user id and role</text>
<rect x="237.4" y="287.0" width="145.3" height="32" fill="#ffffff" opacity="0.92"/>
<text x="310.0" y="299.0" text-anchor="middle" font-size="12" fill="#0f172a">4. POST /api/cart</text>
<text x="310.0" y="314.0" text-anchor="middle" font-size="12" fill="#0f172a">cookie rs_auth, origin</text>
<rect x="387.1" y="390.5" width="132.8" height="17" fill="#ffffff" opacity="0.92"/>
<text x="453.5" y="402.5" text-anchor="middle" font-size="12" fill="#0f172a">5. replace(revision)</text>
<rect x="402.7" y="424.5" width="101.6" height="17" fill="#ffffff" opacity="0.92"/>
<text x="453.5" y="436.5" text-anchor="middle" font-size="12" fill="#0f172a">6. new revision</text>
<rect x="228.0" y="458.5" width="164.0" height="17" fill="#ffffff" opacity="0.92"/>
<text x="310.0" y="470.5" text-anchor="middle" font-size="12" fill="#0f172a">7. cart JSON, up to 1 MiB</text>
<rect x="65.8" y="544.5" width="201.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="166.5" y="556.5" text-anchor="middle" font-size="12" fill="#0f172a">8. structured result or isError</text>
<text x="30" y="612" font-size="12" fill="#475569">A write is never retried. A read may be retried once, inside the 10 s tool deadline.</text>
</svg>
