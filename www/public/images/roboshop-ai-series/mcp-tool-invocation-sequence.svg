<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 640" width="620" height="640" role="img" aria-labelledby="mcp-tool-invocation-sequence-title mcp-tool-invocation-sequence-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="mcp-tool-invocation-sequence-title">MCP tool invocation sequence for update_cart</title>
<desc id="mcp-tool-invocation-sequence-desc">An MCP client sends tools/call with a bearer session. mcp-server applies the Host, Origin and body checks, verifies the session at ai-gateway, runs role and strict argument checks and admission limits, then calls the gateway with the caller&#x27;s session in a cookie. ai-gateway authorizes the request again and writes through cart-service. The result is shaped and validated against the output schema before it returns.</desc>
<rect width="620" height="640" fill="#ffffff"/>
<defs>
<marker id="mcp-tool-invocation-sequence-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="mcp-tool-invocation-sequence-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="mcp-tool-invocation-sequence-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="mcp-tool-invocation-sequence-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="mcp-tool-invocation-sequence-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="mcp-tool-invocation-sequence-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<line x1="95.0" y1="66" x2="95.0" y2="590" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="238.0" y1="66" x2="238.0" y2="590" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="382.0" y1="66" x2="382.0" y2="590" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="525.0" y1="66" x2="525.0" y2="590" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
