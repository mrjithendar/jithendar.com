<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 800" width="620" height="800" role="img" aria-labelledby="roboshop-ai-architecture-logical-title roboshop-ai-architecture-logical-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="roboshop-ai-architecture-logical-title">RoboShop AI logical architecture</title>
<desc id="roboshop-ai-architecture-logical-desc">A browser uses web, which proxies API calls to ai-gateway and assistant calls to moks. moks and ai-gateway call each other over private routes; moks reads catalogue-service and calls Amazon Bedrock or Ollama. An optional MCP client reaches the private mcp-server, which forwards the caller&#x27;s session to ai-gateway. ai-gateway calls user, catalogue, cart, payment and shipping services and owns the order ledger. Paid orders flow through RabbitMQ to shipping-service and kafka-bridge, then Kafka.</desc>
