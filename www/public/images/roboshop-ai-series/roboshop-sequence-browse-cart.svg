<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 560" width="620" height="560" role="img" aria-labelledby="roboshop-sequence-browse-cart-title roboshop-sequence-browse-cart-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="roboshop-sequence-browse-cart-title">Traditional shopping request: browse and add to cart</title>
<desc id="roboshop-sequence-browse-cart-desc">The browser requests products through web. ai-gateway reads catalogue-service, overlays live stock from its ledger and returns the list. Adding to the cart posts the SKU and quantity; ai-gateway checks the session, stock and pending payments, then writes to cart-service, which stores the cart in Redis, and commits the revision in its ledger.</desc>
