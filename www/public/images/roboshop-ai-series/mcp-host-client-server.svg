<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 690" width="620" height="690" role="img" aria-labelledby="mcp-host-client-server-title mcp-host-client-server-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="mcp-host-client-server-title">MCP host, client and server in RoboShop AI</title>
<desc id="mcp-host-client-server-desc">The host and its MCP client run outside the application, for example a desktop assistant or the demo script. They reach mcp-server over stdio locally or Streamable HTTP through a port-forward, using the user&#x27;s own RoboShop session. mcp-server holds no business data and calls ai-gateway with that session. Moks is on a separate path: the widget calls moks and moks calls ai-gateway, with no MCP client.</desc>
<rect width="620" height="690" fill="#ffffff"/>
