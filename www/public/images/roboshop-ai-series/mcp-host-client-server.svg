<text x="310.0" y="320.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Host and Origin guard, rate limits, confirmation of admin writes</text>
<text x="310.0" y="336.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">no business data, no privileged credential</text>
