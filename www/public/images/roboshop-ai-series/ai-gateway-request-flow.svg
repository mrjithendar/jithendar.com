<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 836" width="620" height="836" role="img" aria-labelledby="ai-gateway-request-flow-title ai-gateway-request-flow-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="ai-gateway-request-flow-title">AI gateway internal request flow for POST /api/chat</title>
<desc id="ai-gateway-request-flow-desc">Ten numbered steps run from web through the Moks widget adapter into ai-gateway: transport limits, general rate limit and origin checks, session lookup, service token and role check, chat rate limit and schema, history and provider snapshot, catalogue and stock, two admission slots, the call to the moks engine, then stock re-application and saving the turn. Each step shows the response it returns when it refuses the request.</desc>
<rect width="620" height="836" fill="#ffffff"/>
<defs>
<marker id="ai-gateway-request-flow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="ai-gateway-request-flow-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="ai-gateway-request-flow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="ai-gateway-request-flow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="ai-gateway-request-flow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="ai-gateway-request-flow-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
