<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Moks widget adapter (browser-facing)</text>
<rect x="15" y="120" width="590" height="704" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="136" text-anchor="start" font-size="12" font-weight="600" fill="#475569">ai-gateway process (asgi_app.py, then server.py)</text>
