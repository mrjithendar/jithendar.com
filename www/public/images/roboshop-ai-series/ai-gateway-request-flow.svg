<rect x="30" y="36" width="350" height="56" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="205.0" y="63.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">1. Widget checks</text>
<text x="205.0" y="79.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Origin, 30/min, session, 8 KiB, 4 slots</text>
<rect x="440" y="44" width="150" height="40" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="515.0" y="71.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">403, 429, 401, 413</text>
<rect x="30" y="146" width="350" height="56" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="205.0" y="173.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">2. dispatch: transport</text>
<text x="205.0" y="189.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">64 KiB, 10 s body, 8 workers, 23 s</text>
<rect x="440" y="154" width="150" height="40" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="515.0" y="181.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">413, 408, 503</text>
<rect x="30" y="214" width="350" height="56" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="205.0" y="241.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">3. route: shared guards</text>
<text x="205.0" y="257.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">300/min per address, Origin</text>
<rect x="440" y="222" width="150" height="40" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="515.0" y="249.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">429, 403</text>
<rect x="30" y="282" width="350" height="56" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="205.0" y="309.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">4. Session lookup</text>
<text x="205.0" y="325.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">user-service /internal/session</text>
<rect x="440" y="290" width="150" height="40" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="515.0" y="309.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">503</text>
<text x="515.0" y="325.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">fails closed</text>
<rect x="30" y="350" width="350" height="56" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="205.0" y="377.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">5. /api/chat authorization</text>
<text x="205.0" y="393.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">service token, then require_role</text>
<rect x="440" y="358" width="150" height="40" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="515.0" y="385.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">403, 401</text>
<rect x="30" y="418" width="350" height="56" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="205.0" y="445.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">6. Limit and contract</text>
<text x="205.0" y="461.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">10/min per address, ChatRequest</text>
<rect x="440" y="426" width="150" height="40" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="515.0" y="453.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">429, 400</text>
<rect x="30" y="486" width="350" height="56" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="205.0" y="513.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">7. History and LLM snapshot</text>
<text x="205.0" y="529.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">chat_history, llm_configuration</text>
<rect x="440" y="494" width="150" height="40" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="515.0" y="513.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">200</text>
<text x="515.0" y="529.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">not-configured</text>
<rect x="30" y="554" width="350" height="56" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="205.0" y="581.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">8. Catalogue and stock</text>
<text x="205.0" y="597.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">2 s read, unavailableSkus</text>
<rect x="440" y="562" width="150" height="40" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="515.0" y="589.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">503</text>
<rect x="30" y="622" width="350" height="56" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="205.0" y="649.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">9. Admission</text>
<text x="205.0" y="665.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">2 chat slots</text>
<rect x="440" y="630" width="150" height="40" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="515.0" y="649.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">429</text>
<text x="515.0" y="665.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">assistant-busy</text>
<rect x="30" y="690" width="350" height="56" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="205.0" y="717.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">10. Call moks /internal/chat</text>
<text x="205.0" y="733.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">payload under 16 KiB, 18 s, no retry</text>
<rect x="440" y="698" width="150" height="40" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="515.0" y="717.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">503</text>
<text x="515.0" y="733.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">feature-unavailable</text>
<rect x="30" y="758" width="560" height="54" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="310.0" y="784.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">11. Re-apply live stock, save the turn</text>
<text x="310.0" y="800.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">validate ChatResponse, return buffered JSON</text>
</svg>
