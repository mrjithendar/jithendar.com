<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 880" width="620" height="880" role="img" aria-labelledby="shopping-agent-flow-title shopping-agent-flow-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="shopping-agent-flow-title">Moks shopping agent decision flow, including failure paths</title>
<desc id="shopping-agent-flow-desc">A fixed LangGraph runs search_catalogue, ground_evidence and generate_answer once, with no loop. No provider returns a setup message. search_catalogue may answer with a clarification without calling a model. generate_answer checks the configuration revision and calls the primary provider. Eligible failures with failover on make one Bedrock attempt. Failures return provider-unavailable. Valid output keeps only SKUs from the evidence. ai-gateway reapplies stock and saves the turn.</desc>
<rect width="620" height="880" fill="#ffffff"/>
<defs>
<marker id="shopping-agent-flow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="shopping-agent-flow-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="shopping-agent-flow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="shopping-agent-flow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="shopping-agent-flow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="shopping-agent-flow-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
