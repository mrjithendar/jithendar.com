<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">ai-gateway, before the engine</text>
<rect x="15" y="112" width="590" height="356" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="128" text-anchor="start" font-size="12" font-weight="600" fill="#475569">LangGraph: fixed path, no loop, no tool choice</text>
<rect x="15" y="480" width="590" height="226" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="496" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Provider routing (routing.py)</text>
