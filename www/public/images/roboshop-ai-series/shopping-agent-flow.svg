<rect x="30" y="36" width="340" height="52" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="200.0" y="61.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Provider configured?</text>
<text x="200.0" y="77.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">snapshot and revision from MongoDB</text>
<rect x="420" y="36" width="170" height="52" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="505.0" y="61.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">No: setup message</text>
<text x="505.0" y="77.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">no model call</text>
<rect x="30" y="140" width="340" height="70" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="200.0" y="166.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">search_catalogue</text>
<text x="200.0" y="182.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">references, then budget and type rules</text>
<text x="200.0" y="198.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">retrieve at most 4 products</text>
<rect x="420" y="130" width="170" height="44" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="505.0" y="151.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">Introduction</text>
<text x="505.0" y="167.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">model, no evidence</text>
<rect x="420" y="188" width="170" height="56" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="505.0" y="215.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Clarification</text>
<text x="505.0" y="231.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">one question, no model</text>
<rect x="30" y="258" width="340" height="70" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="200.0" y="284.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">ground_evidence</text>
<text x="200.0" y="300.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">bounded JSON: question, history, evidence</text>
<text x="200.0" y="316.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">drop whole records if over budget</text>
<rect x="30" y="376" width="340" height="70" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="200.0" y="402.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">generate_answer</text>
<text x="200.0" y="418.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">ChatPromptTemplate, then the router</text>
<text x="200.0" y="434.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">deadline checked between stages</text>
<rect x="420" y="268" width="170" height="66" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="505.0" y="292.0" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Nothing matched</text>
<text x="505.0" y="308.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">empty evidence still</text>
<text x="505.0" y="324.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">calls the model</text>
<rect x="30" y="506" width="340" height="54" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="200.0" y="532.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Revision still current?</text>
<text x="200.0" y="548.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">GET /internal/llm/config, before each attempt</text>
<rect x="420" y="508" width="170" height="50" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="505.0" y="532.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">No: unavailable</text>
<text x="505.0" y="548.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">no paid attempt</text>
<rect x="30" y="576" width="340" height="52" rx="7" fill="#fdf2f8" stroke="#be185d" stroke-width="1.4"/>
<text x="200.0" y="601.0" text-anchor="middle" font-size="14" font-weight="600" fill="#500724">Primary provider</text>
<text x="200.0" y="617.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">one attempt, 600 output tokens at most</text>
<rect x="420" y="576" width="170" height="52" rx="7" fill="#fdf2f8" stroke="#be185d" stroke-width="1.4"/>
<text x="505.0" y="601.0" text-anchor="middle" font-size="14" font-weight="600" fill="#500724">One Bedrock attempt</text>
<text x="505.0" y="617.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">only if failover is on</text>
<rect x="420" y="642" width="170" height="54" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="505.0" y="668.0" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">Failure</text>
<text x="505.0" y="684.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">not saved, widget 503</text>
<rect x="30" y="744" width="340" height="52" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
<text x="200.0" y="769.0" text-anchor="middle" font-size="14" font-weight="600" fill="#2e1065">select_cards</text>
<text x="200.0" y="785.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">keep evidence SKUs, drop and count others</text>
<rect x="30" y="808" width="560" height="48" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="310.0" y="831.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">ai-gateway re-applies live stock</text>
<text x="310.0" y="847.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">saves the turn and returns JSON</text>
<rect x="366.0" y="582.5" width="57.9" height="17" fill="#ffffff" opacity="0.92"/>
<text x="395.0" y="594.5" text-anchor="middle" font-size="12" fill="#0f172a">eligible</text>
