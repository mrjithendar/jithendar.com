<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 804" width="620" height="804" role="img" aria-labelledby="roboshop-ai-architecture-deployment-title roboshop-ai-architecture-deployment-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="roboshop-ai-architecture-deployment-title">RoboShop AI deployment on Amazon EKS</title>
<desc id="roboshop-ai-architecture-deployment-desc">Argo CD on the mk4 cluster syncs manifests from Git to the roboshop-demo EKS cluster and images come from ECR. Internet traffic passes a Network Load Balancer to the Istio ingress gateway, which ends TLS, strips /roboshop and routes to web. In roboshop-ai every pod has a sidecar, with PERMISSIVE mTLS and authorization policies in dry-run. mcp-server is running with no public route. The moks Deployment was not present on 1 November 2026. OpenTelemetry export is disabled and Prometheus and Kiali run for mesh metrics.</desc>
