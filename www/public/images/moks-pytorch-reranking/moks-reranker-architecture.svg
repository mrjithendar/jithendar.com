<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 712" width="620" height="712" role="img" aria-labelledby="moks-reranker-architecture-title moks-reranker-architecture-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="moks-reranker-architecture-title">MOKS architecture with the PyTorch reranker and its trust boundaries</title>
<desc id="moks-reranker-architecture-desc">An engineer&#x27;s browser reaches moks-api. The moks-worker runs a LangGraph investigation whose plan node asks an external LLM provider for tool calls, including kb_search. Both processes call the same search function, which takes candidates from OpenSearch or PostgreSQL, checks access and lifecycle in PostgreSQL, and sends only authorized passage text with ids to the moks-reranker pod. The reranker runs a PyTorch cross-encoder on CPU, returns ids and scores, and has no egress, no database access and no ServiceAccount token. Reviewed skills are selected without reranker scores.</desc>
