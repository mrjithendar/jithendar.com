<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 790" width="620" height="790" role="img" aria-labelledby="moks-rerank-sequence-title moks-rerank-sequence-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="moks-rerank-sequence-title">Retrieval, reranking and context selection in MOKS, including fallback</title>
<desc id="moks-rerank-sequence-desc">kb_search calls search with the question and the investigation&#x27;s scope. Search resolves grants, gathers keyword, identifier and vector candidates and fuses them, then asks PostgreSQL which chunks are active and readable. It applies small scoring signals and prepares up to 30 candidates with at most 4 per document, then posts them to moks-reranker with a bearer token and a 1500 ms deadline. The service queues at most 4 requests behind 1 worker and scores in batches of 16. Search accepts the answer only if it scores exactly the ids it sent with the pinned model and revision; on a timeout, overload, error or mismatch it keeps the existing order. It then pins exact identifiers, moves superseded documents last, selects at most 3 passages per document, rechecks PostgreSQL when reranking was applied, and returns passages with citations.</desc>
<rect width="620" height="790" fill="#ffffff"/>
<defs>
<marker id="moks-rerank-sequence-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="moks-rerank-sequence-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
