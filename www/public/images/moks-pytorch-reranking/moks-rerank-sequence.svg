<text x="238.0" y="130.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Grants for the scope</text>
<text x="238.0" y="146.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">keyword, identifier, vector</text>
<text x="238.0" y="162.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">fused with RRF</text>
<rect x="131" y="250" width="214" height="62" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="238.0" y="272.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">_score: small signals</text>
<text x="238.0" y="288.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">_prepare: at most 30,</text>
<text x="238.0" y="304.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">4 per document, no repeats</text>
<rect x="398" y="364" width="214" height="62" rx="7" fill="#fdf2f8" stroke="#be185d" stroke-width="1.4"/>
