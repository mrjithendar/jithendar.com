<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 708" width="620" height="708" role="img" aria-labelledby="moks-reranker-deployment-title moks-reranker-deployment-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="moks-reranker-deployment-title">Kubernetes deployment and model-loading lifecycle of moks-reranker</title>
<desc id="moks-reranker-deployment-desc">On a push to master, GitHub Actions on an arm64 runner installs pinned dependencies with CPU-only torch, downloads the model at revision 233902d and checks the SHA-256 of every file, smoke-tests the image with no network and a read-only root, and pushes a commit tag and latest to ECR. The Argo CD Application moks-reranker renders the reranker resource group from values-minikube.yaml on manual sync. In namespace moks a Secret, a Deployment, a ClusterIP Service and a NetworkPolicy with no egress are created. The pod loads local safetensors weights without remote code, warms up, then reports ready; on SIGTERM it refuses new work and finishes accepted work within 20 seconds.</desc>
