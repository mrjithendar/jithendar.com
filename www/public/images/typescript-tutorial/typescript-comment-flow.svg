<polyline points="120.16,248 180.0,198" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#typescript-comment-flow-dashed)"/>
<rect x="30" y="40" width="270" height="70" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="165.0" y="66.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Composer.tsx</text>
<text x="165.0" y="82.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">body: useState(initial), a string</text>
<text x="165.0" y="98.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">onSubmit: ComposerSubmit</text>
<rect x="320" y="40" width="270" height="70" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="455.0" y="66.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Discussion.tsx</text>
<text x="455.0" y="82.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">post(body, clientKey, parentId)</text>
<text x="455.0" y="98.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">reads r.id only when r.ok</text>
<rect x="30" y="128" width="300" height="70" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="180.0" y="154.0" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">CommentResult (compile time)</text>
<text x="180.0" y="170.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">{ ok: true, id, status, thread }</text>
<text x="180.0" y="186.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">| { ok: false, error }</text>
<rect x="30" y="248" width="560" height="70" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="310.0" y="274.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">postCommentAction  (_actions/comments.ts, &quot;use server&quot;)</text>
<text x="310.0" y="290.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">signedIn(): the user comes from the session cookie, never from the arguments</text>
<text x="310.0" y="306.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">return type inferred, and step 2 relies on it</text>
<rect x="30" y="346" width="560" height="112" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="310.0" y="377.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">submitComment(input: SubmitInput)  (lib/comments.ts)</text>
<text x="310.0" y="393.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">runtime checks: cleanBody(body: unknown) for type and length</text>
<text x="310.0" y="409.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">isUuid and a database read: the post exists, is published, not deleted</text>
<text x="310.0" y="425.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">assertOpen: discussion not closed or locked; client key /^[A-Za-z0-9_-]{8,64}$/</text>
<text x="310.0" y="441.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">status from the user&#x27;s role on the server</text>
<rect x="30" y="486" width="560" height="70" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="310.0" y="512.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Drizzle insert  (db/schema.ts)</text>
<text x="310.0" y="528.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">.notNull() columns are string, the rest string | null</text>
<text x="310.0" y="544.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">a missing required column does not compile</text>
<rect x="30" y="618" width="560" height="62" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="310.0" y="648.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">PostgreSQL table comment</text>
<text x="310.0" y="664.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">unique index on user and client key; foreign keys keep a reply on its parent&#x27;s post</text>
<rect x="281.0" y="54.5" width="57.9" height="17" fill="#ffffff" opacity="0.92"/>
<text x="310.0" y="66.5" text-anchor="middle" font-size="12" fill="#0f172a">onSubmit</text>
