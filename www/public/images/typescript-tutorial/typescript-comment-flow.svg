<text x="385.0" y="182.5" text-anchor="middle" font-size="12" fill="#0f172a">server action call</text>
<rect x="317.3" y="578.5" width="45.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="340.0" y="590.5" text-anchor="middle" font-size="12" fill="#0f172a">insert</text>
<rect x="153.4" y="214.5" width="45.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="176.1" y="226.5" text-anchor="middle" font-size="12" fill="#0f172a">result</text>
