<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 728" width="620" height="728" role="img" aria-labelledby="typescript-comment-flow-title typescript-comment-flow-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="typescript-comment-flow-title">Posting a comment on jithendar.com, end to end</title>
<desc id="typescript-comment-flow-desc">In the browser, the Composer client component holds the text as string state and calls onSubmit, typed ComposerSubmit. Discussion.tsx calls the server action postCommentAction directly. On the server, postCommentAction reads the user from the session cookie through signedIn, then calls submitComment, which checks again at runtime: cleanBody, isUuid and a database read, assertOpen and the client-key pattern. Drizzle inserts the row into PostgreSQL, whose unique index and foreign keys add their own rules. The result returns as a CommentResult discriminated union.</desc>
<rect width="620" height="728" fill="#ffffff"/>
<defs>
<marker id="typescript-comment-flow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="typescript-comment-flow-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="typescript-comment-flow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="typescript-comment-flow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="typescript-comment-flow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="typescript-comment-flow-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
