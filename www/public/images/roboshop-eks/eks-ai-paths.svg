<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 860" width="720" height="860" role="img" aria-labelledby="eks-ai-paths-title eks-ai-paths-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="eks-ai-paths-title">RoboShop AI on EKS: Moks, model and MCP paths</title>
<desc id="eks-ai-paths-desc">Path A, the assistant: the browser widget calls web, which forwards to Moks widget routes; Moks calls ai-gateway /api/chat with the user&#x27;s session; the gateway adds saved history references and the active provider configuration and calls the Moks engine; Moks retrieves up to four products from catalogue-service, re-checks the configuration revision with the gateway and, only if a provider is configured, calls Amazon Bedrock through Pod Identity or an allow-listed Ollama endpoint, with one optional failover and a circuit breaker. Without a provider it returns &#x27;Please connect an LLM&#x27;. Path B, MCP: an MCP client reaches the private mcp-server by port-forward; mcp-server calls ai-gateway with the caller&#x27;s own session, and the gateway re-authorizes. Moks never calls MCP.</desc>
<defs><marker id="eks-ai-paths-arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="eks-ai-paths-arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker><marker id="eks-ai-paths-arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="eks-ai-paths-arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#a21caf"/></marker><marker id="eks-ai-paths-arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#ffffff"/>
<text x="24" y="40" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Assistant and MCP paths</text>
<text x="24" y="62" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Two independent entry points. Moks never calls the MCP server.</text>
<rect x="12" y="80" width="696" height="470" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
