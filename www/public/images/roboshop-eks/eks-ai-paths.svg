<text x="40" y="708" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Tools: search/compare products, shipping lookups, own cart; admin tools by role.</text>
<text x="40" y="724" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">No order placement, payment, refund, delete or infrastructure tools.</text>
