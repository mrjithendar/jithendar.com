<circle cx="474" cy="322" r="10" fill="#0f172a"/>
<text x="474" y="326.2" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
<path d="M540,310 L540,352" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#eks-ai-paths-arrow-sync)"/>
<path d="M380,400 L340,400" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#eks-ai-paths-arrow-sync)"/>
