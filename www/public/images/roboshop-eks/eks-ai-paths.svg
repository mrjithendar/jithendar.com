<text x="40" y="470" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Per-replica circuit breaker: 3 failures → open 30 s. Langfuse (optional) records</text>
<text x="40" y="486" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">metadata only, never prompts or outputs. Shopping never depends on Moks:</text>
<text x="40" y="502" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">scaling Moks to zero hides the widget and checkout keeps working.</text>
<rect x="12" y="566" width="696" height="200" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
