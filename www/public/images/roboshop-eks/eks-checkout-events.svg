<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 830" width="720" height="830" role="img" aria-labelledby="eks-checkout-events-title eks-checkout-events-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="eks-checkout-events-title">RoboShop AI on EKS: checkout, outbox and event consumers</title>
<desc id="eks-checkout-events-desc">Checkout is synchronous: the browser creates an order with an idempotency key; ai-gateway reserves stock in its ledger and creates a Razorpay test-mode order through payment-service; Razorpay confirms by browser verification or a signed webhook; the gateway marks the order paid and writes an outbox event in the same transaction. Afterwards the outbox worker publishes to RabbitMQ with publisher confirms. Live merchant orders go to roboshop.shipping.orders, consumed by shipping-worker replicas scaled by KEDA, which insert into PostgreSQL with ON CONFLICT DO NOTHING and acknowledge after commit; after five failures messages dead-letter to roboshop.shipping.failed. Test orders go to an audit queue. Both go to kafka-bridge, which publishes to Kafka. The mesh never retries checkout or payment calls.</desc>
<defs><marker id="eks-checkout-events-arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="eks-checkout-events-arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker><marker id="eks-checkout-events-arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="eks-checkout-events-arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#a21caf"/></marker><marker id="eks-checkout-events-arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
