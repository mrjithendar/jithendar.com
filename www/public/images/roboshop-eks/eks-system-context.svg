<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1010" width="720" height="1010" role="img" aria-labelledby="eks-system-context-title eks-system-context-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="eks-system-context-title">RoboShop AI on EKS: services and data ownership</title>
<desc id="eks-system-context-desc">Browsers reach the shop through an AWS Network Load Balancer and the Istio ingress gateway, which forwards to the web NGINX service. NGINX sends API calls to ai-gateway, assistant calls to Moks and currency calls to currency-service. ai-gateway calls user, catalogue, cart, payment, shipping and currency services and the optional Moks engine; it owns the order ledger and outbox. A private MCP server, reachable only by port-forward, calls the gateway with the caller&#x27;s session. Paid orders flow from the outbox through RabbitMQ to shipping-worker and kafka-bridge. Each service is labelled with the data store it owns.</desc>
<defs><marker id="eks-system-context-arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="eks-system-context-arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker><marker id="eks-system-context-arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="eks-system-context-arrow-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#a21caf"/></marker><marker id="eks-system-context-arrow-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker></defs>
