<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" width="720" height="760" role="img" aria-labelledby="eks-telemetry-title eks-telemetry-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="eks-telemetry-title">RoboShop AI on EKS: telemetry pipeline</title>
<desc id="eks-telemetry-desc">Application pods and Istio sidecars send OTLP traces to the node-local OpenTelemetry agent, which adds Kubernetes metadata, drops health-check spans, samples, redacts query strings, authorization headers, cookies and email addresses, and exports to Jaeger. The same agent tails container logs, redacts them and writes them to a CloudWatch Logs group with finite retention. Prometheus scrapes application and Envoy metrics merged by the sidecar on port 15020, plus KEDA, Karpenter and istiod, and evaluates alerts; Grafana queries Prometheus. EKS control-plane logs go to CloudWatch directly. Moks can send metadata-only observations to Langfuse when credentials exist. Telemetry failures never fail requests.</desc>
