<text x="640.0" y="479.5" font-size="14" font-weight="700" fill="#064e3b" text-anchor="middle">currency</text>
<path d="M361,386 L361,420 L640,420 L640,450" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#eks-trust-boundaries-arrow-sync)"/>
<rect x="40" y="522" width="640" height="100" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="360" y="548" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="middle">Everything else is denied</text>
<text x="56" y="572" font-size="11.5" font-weight="400" fill="#7f1d1d" text-anchor="start">Also allowed (not drawn): web → currency · moks → catalogue, user · user → shipping.</text>
<text x="56" y="588" font-size="11.5" font-weight="400" fill="#7f1d1d" text-anchor="start">Denied, for example: cart → payment, any pod → mcp-server.</text>
<text x="56" y="604" font-size="11.5" font-weight="400" fill="#7f1d1d" text-anchor="start">Rolled out in dry-run (denials only logged), then enforced.</text>
<rect x="12" y="652" width="696" height="110" rx="14" fill="#fffcf5" stroke="#b45309" stroke-width="1.4"/>
<text x="26" y="672" font-size="11" font-weight="700" fill="#475569" text-anchor="start">3. OUTSIDE THE MESH (NETWORKPOLICY VIA VPC CNI)</text>
