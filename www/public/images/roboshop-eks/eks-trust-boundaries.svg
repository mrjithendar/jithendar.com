<text x="520" y="350" font-size="11.5" font-weight="600" fill="#1e293b" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">both ways</text>
<path d="M210,358 L276,358" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#eks-trust-boundaries-arrow-sync)"/>
<rect x="40" y="450" width="100" height="48" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="90.0" y="479.5" font-size="14" font-weight="700" fill="#064e3b" text-anchor="middle">user</text>
