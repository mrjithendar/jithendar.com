<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 704" width="620" height="704" role="img" aria-labelledby="jithendar-com-telemetry-flow-title jithendar-com-telemetry-flow-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="jithendar-com-telemetry-flow-title">Logs, traces and metrics of jithendar.com on the mk4 cluster</title>
<desc id="jithendar-com-telemetry-flow-desc">A visitor reaches the Traefik ingress, which strips incoming trace headers and forwards to two Next.js pods in namespace jithendar. The pods send spans over OTLP/HTTP to the OpenTelemetry Collector, which removes URLs, SQL and exception text and forwards to Jaeger, which keeps the newest 5000 traces in memory. They write JSON log lines to stdout; Alloy reads them through the Kubernetes API, keeps only allowlisted fields and pushes logfmt lines with trace_id to Loki. Prometheus scrapes request and runtime metrics from port 9464. Grafana reads Prometheus and Loki and links a log line&#x27;s trace_id to the Jaeger UI through a port-forward. The site sends traceparent only to the practice executor, whose audit lines carry the same trace_id.</desc>
