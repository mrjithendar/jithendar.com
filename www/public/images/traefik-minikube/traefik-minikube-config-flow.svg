<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" width="900" height="590" role="img" aria-labelledby="traefik-minikube-config-flow-title traefik-minikube-config-flow-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="traefik-minikube-config-flow-title">How routing configuration reaches Traefik on mk4</title>
<desc id="traefik-minikube-config-flow-desc">Three GitHub repositories hold the configuration. A person installs Traefik itself with Helm through bootstrap.py or deploy-traefik.sh, and the same bootstrap applies Argo CD&#x27;s own Ingress with kubectl apply -k. Argo CD, synced manually with deploy.py, applies the Grafana, Prometheus, Loki and MOKS routes. GitHub Actions with the github-ci-applier ServiceAccount, and the owner&#x27;s deploy.sh, apply the jithendar.com routes, TLSStore and certificates. Everything lands in the Kubernetes API. Helm values become Traefik&#x27;s static configuration, which needs a pod restart to change; Traefik&#x27;s providers watch Ingress and CRD objects and apply them as dynamic configuration without a restart. Invalid references are logged and the affected router is skipped.</desc>
