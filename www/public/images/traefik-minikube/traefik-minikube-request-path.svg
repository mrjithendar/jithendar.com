<rect x="30" y="36" width="220" height="64" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="140.0" y="59.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Browser</text>
<text x="140.0" y="75.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">https://jithendar.com/...</text>
<text x="140.0" y="91.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">or curl --resolve for tests</text>
<rect x="300" y="36" width="300" height="64" rx="7" fill="#f1f5f9" stroke="#64748b" stroke-width="1.4"/>
<text x="450.0" y="59.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Cloudflare DNS, DNS only</text>
<text x="450.0" y="75.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">A records: apex, www, db</text>
<text x="450.0" y="91.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">point at the host, no CDN proxy</text>
<rect x="30" y="148" width="840" height="64" rx="7" fill="#eef2ff" stroke="#4338ca" stroke-width="1.4"/>
<text x="450.0" y="171.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e1b4b">HAProxy 3.2 container from expose-ingress.sh: TCP mode, holds no certificates</text>
<text x="450.0" y="187.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">host :80 → mk4 node :30080 and host :443 → mk4 node :30443</text>
<text x="450.0" y="203.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">adds a PROXY protocol v2 header, so Traefik sees the visitor&#x27;s address instead of the node&#x27;s</text>
<rect x="45" y="280" width="810" height="46" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="450.0" y="302.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">Service traefik, type NodePort</text>
<text x="450.0" y="318.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">80 → nodePort 30080 → pod :8000 (web)    443 → nodePort 30443 → pod :8443 (websecure)</text>
<rect x="45" y="348" width="810" height="96" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="450.0" y="371.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Traefik v3.7.14 from Helm chart 42.0.0, 1 replica</text>
<text x="450.0" y="387.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">entryPoints web and websecure trust the PROXY header from 192.168.49.0/24 only</text>
<text x="450.0" y="403.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">TLS ends here: default TLSStore → Secret jithendar-com-tls (Let&#x27;s Encrypt via cert-manager HTTP-01)</text>
<text x="450.0" y="419.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">providers: kubernetesingress (IngressClass traefik) and kubernetescrd, all namespaces; no Gateway API</text>
<text x="450.0" y="435.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">middlewares: redirects, compress, basicAuth, ipAllowList, headers; upstream connections are plain HTTP</text>
<rect x="45" y="490" width="195" height="96" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="142.5" y="513.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">ns jithendar</text>
<text x="142.5" y="529.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">/ → jithendar-com:80</text>
<text x="142.5" y="545.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">/db → jithendar-db-ui:80</text>
<text x="142.5" y="561.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">db.jithendar.com (TCP, SNI)</text>
<text x="142.5" y="577.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">→ jithendar-postgres:5432</text>
<rect x="250" y="490" width="195" height="96" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="347.5" y="513.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">ns moks</text>
<text x="347.5" y="529.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">/moks → moks-api:8080</text>
<text x="347.5" y="545.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">/moks/api/terminal</text>
<text x="347.5" y="561.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">→ moks-terminal:8080</text>
<text x="347.5" y="577.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">/opensearch* IngressRoutes</text>
<rect x="455" y="490" width="195" height="96" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="552.5" y="513.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">ns monitoring</text>
<text x="552.5" y="529.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">/grafana → grafana:80</text>
<text x="552.5" y="545.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">/prometheus → :9090, auth</text>
<text x="552.5" y="561.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">/loki/api/v1/push, auth</text>
<text x="552.5" y="577.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Loki read: router disabled</text>
<rect x="660" y="490" width="195" height="96" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
<text x="757.5" y="513.0" text-anchor="middle" font-size="14" font-weight="600" fill="#064e3b">ns argocd</text>
<text x="757.5" y="529.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">/argocd → argocd-server:80</text>
<text x="757.5" y="545.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">Argo CD serves /argocd</text>
<text x="757.5" y="561.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">itself, no prefix strip</text>
<text x="757.5" y="577.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">HTTP → HTTPS middleware</text>
<rect x="45" y="616" width="195" height="64" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="142.5" y="639.0" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">practice-executor-api</text>
<text x="142.5" y="655.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">no Ingress: called by</text>
<text x="142.5" y="671.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">the site pods in-cluster</text>
<rect x="242.9" y="49.5" width="64.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="275.0" y="61.5" text-anchor="middle" font-size="12" fill="#0f172a">1. lookup</text>
<rect x="145.4" y="115.5" width="89.1" height="17" fill="#ffffff" opacity="0.92"/>
<text x="190.0" y="127.5" text-anchor="middle" font-size="12" fill="#0f172a">2. TCP 80/443</text>
<rect x="147.5" y="458.5" width="114.1" height="17" fill="#ffffff" opacity="0.92"/>
<text x="204.5" y="470.5" text-anchor="middle" font-size="12" fill="#0f172a">Host + path match</text>
<text x="270" y="652" font-size="12" fill="#475569">Pod-to-pod calls use Service DNS names and never pass through Traefik.</text>
</svg>
