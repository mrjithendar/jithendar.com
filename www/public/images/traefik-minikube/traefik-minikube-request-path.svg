<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720" role="img" aria-labelledby="traefik-minikube-request-path-title traefik-minikube-request-path-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="traefik-minikube-request-path-title">External request path from a browser to applications on the mk4 Minikube cluster</title>
<desc id="traefik-minikube-request-path-desc">A browser resolves jithendar.com through Cloudflare DNS in DNS-only mode, so the address is the Hetzner host itself. On the host, an HAProxy container forwards TCP ports 80 and 443 to the Minikube node&#x27;s NodePorts 30080 and 30443 and adds a PROXY protocol v2 header. The NodePort Service sends traffic to the single Traefik v3.7.14 pod, where TLS ends with the Let&#x27;s Encrypt certificate from the default TLSStore. Traefik matches host and path rules from Ingress and Traefik CRD objects and forwards plain HTTP to Services in the jithendar, moks, monitoring and argocd namespaces. Calls between pods, such as the site to the practice executor, use cluster DNS and do not pass through Traefik.</desc>
<rect width="900" height="720" fill="#ffffff"/>
<defs>
<marker id="traefik-minikube-request-path-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="traefik-minikube-request-path-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="traefik-minikube-request-path-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="traefik-minikube-request-path-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="traefik-minikube-request-path-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="traefik-minikube-request-path-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect x="15" y="12" width="870" height="100" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="23" y="28" text-anchor="start" font-size="12" font-weight="600" fill="#475569">Internet</text>
<rect x="15" y="124" width="870" height="100" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="877" y="217" text-anchor="end" font-size="12" font-weight="600" fill="#475569">Hetzner host (Linux, Docker)</text>
<rect x="15" y="236" width="870" height="470" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="877" y="699" text-anchor="end" font-size="12" font-weight="600" fill="#475569">Minikube cluster mk4: 5 nodes on Docker network 192.168.49.0/24</text>
<rect x="30" y="256" width="840" height="204" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 4"/>
<text x="38" y="272" text-anchor="start" font-size="12" font-weight="600" fill="#475569">namespace traefik</text>
<polyline points="250,68.0 300,68.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#traefik-minikube-request-path-sync)"/>
<polyline points="140.0,100 140.0,148" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#traefik-minikube-request-path-sync)"/>
<polyline points="450.0,212 450.0,280" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#traefik-minikube-request-path-sync)"/>
<polyline points="450.0,326 450.0,348" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#traefik-minikube-request-path-sync)"/>
