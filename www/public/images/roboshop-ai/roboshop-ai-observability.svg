<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="roboshop-ai-observability-title roboshop-ai-observability-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="roboshop-ai-observability-title">RoboShop AI: telemetry paths</title>
<desc id="roboshop-ai-observability-desc">Every RoboShop service sends OpenTelemetry spans over OTLP/HTTP to the OpenTelemetry Collector, which strips sensitive attributes and forwards to Jaeger. Prometheus scrapes each service&#x27;s /metrics endpoint. Alloy reads pod logs through the Kubernetes API and pushes them to Loki. Grafana queries Prometheus and Loki. When credentials are configured, Moks also sends metadata-only model spans to Langfuse Cloud.</desc>
<defs><marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker><marker id="arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="arrow-dlq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#ffffff"/>
<text x="40" y="44" font-size="21" font-weight="700" fill="#0f172a" text-anchor="start">Telemetry paths</text>
<text x="40" y="66" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Arrows follow the data. Prometheus and Alloy pull; services push spans.</text>
<rect x="24" y="84" width="752" height="380" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="106" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">SIGNALS</text>
<rect x="40" y="124" width="170" height="214" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="1.6"/>
<text x="125.0" y="186.0" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">RoboShop services</text>
<text x="125.0" y="206.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">OTLP spans</text>
<text x="125.0" y="226.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">/metrics</text>
<text x="125.0" y="246.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">JSON logs (stdout)</text>
<text x="125.0" y="266.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">W3C traceparent</text>
<text x="125.0" y="286.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">propagated</text>
<rect x="240" y="124" width="170" height="64" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="325.0" y="151.0" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">OTel Collector</text>
<text x="325.0" y="171.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">redacts attributes</text>
<rect x="240" y="224" width="170" height="64" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="325.0" y="251.0" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Prometheus</text>
<text x="325.0" y="271.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">job: roboshop</text>
<rect x="240" y="324" width="170" height="64" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="325.0" y="351.0" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Alloy</text>
<text x="325.0" y="371.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">tails pod logs</text>
<path d="M440,133 a75.0,9 0 0 0 150,0 a75.0,9 0 0 0 -150,0 v46 a75.0,9 0 0 0 150,0 v-46" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="515.0" y="155.5" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Jaeger</text>
<text x="515.0" y="175.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">in-memory</text>
<path d="M440,333 a75.0,9 0 0 0 150,0 a75.0,9 0 0 0 -150,0 v46 a75.0,9 0 0 0 150,0 v-46" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="515.0" y="365.5" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Loki</text>
<rect x="620" y="224" width="140" height="164" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
<text x="690.0" y="291.0" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Grafana</text>
<text x="690.0" y="311.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">dashboards,</text>
<text x="690.0" y="331.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Explore</text>
<path d="M210,156 L240,156" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#arrow-telemetry)"/>
<path d="M210,256 L240,256" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#arrow-telemetry)"/>
<path d="M210,316 L225,316 L225,356 L240,356" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#arrow-telemetry)"/>
<path d="M410,156 L440,156" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#arrow-telemetry)"/>
<path d="M410,356 L440,356" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#arrow-telemetry)"/>
<path d="M410,256 L620,256" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#arrow-telemetry)"/>
<text x="515" y="248" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">queries</text>
<path d="M590,356 L620,356" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#arrow-telemetry)"/>
<text x="440" y="210" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start">Jaeger UI via port-forward</text>
<rect x="40" y="372" width="170" height="64" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="125.0" y="399.0" font-size="15" font-weight="700" fill="#2e1065" text-anchor="middle">moks</text>
<text x="125.0" y="419.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">gen_ai model spans</text>
<rect x="440" y="400" width="320" height="50" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="600.0" y="420.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Langfuse Cloud</text>
<text x="600.0" y="440.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">metadata only, when credentials exist</text>
<rect x="694" y="391" width="58" height="18" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
<text x="723" y="404" font-size="10.5" font-weight="600" fill="#64748b" text-anchor="middle" font-style="italic">optional</text>
<path d="M210,425 L440,425" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round" marker-end="url(#arrow-telemetry)"/>
<text x="325" y="417" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">optional</text>
<rect x="24" y="480" width="752" height="104" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="40" y="502" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">WHAT IS NOT RECORDED</text>
<text x="44" y="516" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">Access logs omit query strings, cookies and bodies. Model spans record provider, model, token use</text>
<text x="44" y="535" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">and latency, not prompts or replies, unless a synthetic-capture switch is set. Alerts are evaluated</text>
<text x="44" y="554" font-size="12.5" font-weight="400" fill="#334155" text-anchor="start">in Prometheus, but no Alertmanager is installed, so nothing is paged.</text>
<path d="M560,568 L590,568" stroke="#15803d" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-telemetry)"/>
<text x="600" y="572.5" font-size="12.5" font-weight="500" fill="#334155" text-anchor="start">Telemetry</text>
</svg>
