<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 824" width="800" height="824" role="img" aria-labelledby="roboshop-ai-checkout-events-title roboshop-ai-checkout-events-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="roboshop-ai-checkout-events-title">RoboShop AI: checkout and paid-order events</title>
<desc id="roboshop-ai-checkout-events-desc">Checkout is synchronous: the browser creates an order at ai-gateway with an idempotency key, the gateway reserves stock in its ledger and calls payment-service, which talks to Razorpay. Razorpay sends a signed webhook back to the gateway. After a verified capture the ledger records the order as paid with an event ID. A background publisher sends the event to the RabbitMQ exchange roboshop.orders. Live paid orders go to the shipping queue and shipping-service, which writes a shipment request to PostgreSQL; failures go to a dead-letter queue. Test orders go to an audit queue. Both kinds go to a Kafka queue read by kafka-bridge.</desc>
<defs><marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker><marker id="arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="arrow-dlq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker></defs>
