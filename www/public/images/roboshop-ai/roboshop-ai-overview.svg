<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1200" width="560" height="1200" role="img" aria-labelledby="roboshop-ai-overview-title roboshop-ai-overview-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="roboshop-ai-overview-title">RoboShop AI service map</title>
<desc id="roboshop-ai-overview-desc">Browser traffic enters through Traefik and the web NGINX service. NGINX sends /api requests to ai-gateway and /moks requests to the optional Moks AI agent. A private mcp-server serves MCP clients and calls the gateway with the caller&#x27;s session. The gateway calls the Moks engine for chat and calls the user, catalogue, cart, payment, shipping and currency services over HTTP. Each service&#x27;s data store or provider is shown on it. Paid orders leave the gateway&#x27;s outbox as RabbitMQ events consumed by shipping-service and kafka-bridge.</desc>
