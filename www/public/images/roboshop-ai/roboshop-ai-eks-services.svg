<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 860" width="560" height="860" role="img" aria-labelledby="roboshop-ai-eks-services-title roboshop-ai-eks-services-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="roboshop-ai-eks-services-title">RoboShop AI on Amazon EKS: what runs today</title>
<desc id="roboshop-ai-eks-services-desc">A browser connects to an internet-facing Network Load Balancer, which passes TCP to the Istio ingress gateway. The gateway ends public TLS, strips /roboshop and routes to web, which proxies /api to ai-gateway. ai-gateway calls the user, catalogue, cart, payment, shipping and currency services. Paid orders leave the gateway&#x27;s outbox through RabbitMQ to shipping-service and kafka-bridge. mcp-server is private with no public route. The moks shopping assistant is in the repository but is not deployed on this cluster.</desc>
