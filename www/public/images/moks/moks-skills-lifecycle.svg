<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="moks-skills-lifecycle-title moks-skills-lifecycle-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="moks-skills-lifecycle-title">MOKS: skill release and run paths</title>
<desc id="moks-skills-lifecycle-desc">A SKILL.md is reviewed in Git, validated, stored as an immutable version named by its SHA-256 digest, and published into a generation that API, worker and detection processes follow within about 30 seconds. At run time, one policy decides eligibility, up to three skills are ranked from findings and question keywords, their read-only steps run through the ToolExecutor, and declared evidence contracts are checked. Suggested actions are plans that still need review.</desc>
<defs><marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker><marker id="arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="arrow-dlq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#ffffff"/>
<text x="24" y="40" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Skills: released like code, run like a checklist</text>
<text x="24" y="62" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">One generation is the exact set of versions every process runs, and each run records what it used.</text>
<rect x="12" y="84" width="696" height="190" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="28" y="106" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">RELEASE PATH</text>
<text x="28" y="123" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Git stays the review step</text>
<rect x="28" y="146" width="150" height="104" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="103.0" y="183.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">SKILL.md</text>
<text x="103.0" y="203.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">image or reviewed</text>
<text x="103.0" y="223.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">ConfigMap</text>
<rect x="198" y="146" width="150" height="104" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2.4"/>
<text x="273.0" y="183.0" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="middle">validate</text>
<text x="273.0" y="203.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">read-only tools, args,</text>
<text x="273.0" y="223.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">allowlisted actions</text>
<rect x="368" y="146" width="150" height="104" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="443.0" y="183.0" font-size="15" font-weight="700" fill="#451a03" text-anchor="middle">version</text>
<text x="443.0" y="203.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">immutable,</text>
<text x="443.0" y="223.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">named by SHA-256</text>
<rect x="538" y="146" width="154" height="104" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="615.0" y="183.0" font-size="15" font-weight="700" fill="#2e1065" text-anchor="middle">generation</text>
<text x="615.0" y="203.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">followed within ~30 s;</text>
<text x="615.0" y="223.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">rollback is a new one</text>
<path d="M178,198 L198,198" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<path d="M348,198 L368,198" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<path d="M518,198 L538,198" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<rect x="12" y="292" width="696" height="248" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="28" y="314" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">RUN PATH</text>
<text x="120" y="314" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">one policy answers for selection, steps, detection and suggestions</text>
<rect x="28" y="354" width="150" height="104" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2.4"/>
<text x="103.0" y="391.0" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="middle">eligible?</text>
<text x="103.0" y="411.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">published, enabled,</text>
<text x="103.0" y="431.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">connectors ready</text>
<rect x="198" y="354" width="150" height="104" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="273.0" y="391.0" font-size="15" font-weight="700" fill="#2e1065" text-anchor="middle">select up to 3</text>
<text x="273.0" y="411.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">findings x3,</text>
<text x="273.0" y="431.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">keywords x1</text>
<rect x="368" y="354" width="150" height="104" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="1.6"/>
<text x="443.0" y="391.0" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="middle">run steps</text>
<text x="443.0" y="411.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">through ToolExecutor,</text>
<text x="443.0" y="431.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">fair tool budget</text>
<rect x="538" y="354" width="154" height="104" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="615.0" y="391.0" font-size="15" font-weight="700" fill="#2e1065" text-anchor="middle">contracts</text>
<text x="615.0" y="411.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">required evidence,</text>
<text x="615.0" y="431.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">gaps in the report</text>
<path d="M178,406 L198,406" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<path d="M348,406 L368,406" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<path d="M518,406 L538,406" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<path d="M615,250 L615,283 L102,283 L102,354" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<rect x="198" y="476" width="494" height="46" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="445.0" y="494.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">suggested action plans</text>
<text x="445.0" y="514.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">allowlisted, prefilled, and still subject to the approval policy</text>
<path d="M615,458 L615,476" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
</svg>
