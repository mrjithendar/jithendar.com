<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" width="720" height="610" role="img" aria-labelledby="moks-rag-ingestion-title moks-rag-ingestion-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="moks-rag-ingestion-title">MOKS: knowledge ingestion</title>
<desc id="moks-rag-ingestion-desc">A sync pass pins one Git commit and reads at most 500 files, least recently tried first. Files that look like secrets are excluded and the rest is redacted and chunked. Documents, chunks and an outbox event commit in one PostgreSQL transaction. After commit a worker takes a per-document lock, embeds the chunks and writes the external index, which can always be rebuilt from PostgreSQL.</desc>
<defs><marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker><marker id="arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="arrow-dlq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#ffffff"/>
<text x="24" y="40" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Ingestion: PostgreSQL first, indexes second</text>
<text x="24" y="62" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">An external index is derived data. It is written only after the change has committed.</text>
<rect x="12" y="84" width="696" height="160" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="28" y="106" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">1. BOUNDED SYNC PASS</text>
<text x="28" y="123" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">up to 500 files against a persistent inventory</text>
<rect x="28" y="146" width="150" height="78" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="103.0" y="170.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">list</text>
<text x="103.0" y="190.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">pin one commit</text>
<text x="103.0" y="210.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">resumable</text>
<rect x="198" y="146" width="150" height="78" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="273.0" y="170.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">read</text>
<text x="273.0" y="190.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">least recently</text>
<text x="273.0" y="210.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">tried first</text>
<rect x="368" y="146" width="150" height="78" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2.4"/>
<text x="443.0" y="170.0" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="middle">filter</text>
<text x="443.0" y="190.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">exclude secret files,</text>
<text x="443.0" y="210.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">redact the rest</text>
<rect x="538" y="146" width="154" height="78" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="615.0" y="170.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">chunk</text>
<text x="615.0" y="190.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">350 tokens, overlap 30</text>
<text x="615.0" y="210.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">keep line ranges</text>
<path d="M178,185 L198,185" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<path d="M348,185 L368,185" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<path d="M518,185 L538,185" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<rect x="12" y="262" width="696" height="134" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="28" y="284" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">2. ONE POSTGRESQL TRANSACTION</text>
<text x="28" y="301" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">the event exists exactly when the change does</text>
<path d="M290,319 a95.0,9 0 0 0 190,0 a95.0,9 0 0 0 -190,0 v54 a95.0,9 0 0 0 190,0 v-54" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="385.0" y="345.5" font-size="15" font-weight="700" fill="#451a03" text-anchor="middle">documents, chunks</text>
<text x="385.0" y="365.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">system of record</text>
<path d="M502,319 a95.0,9 0 0 0 190,0 a95.0,9 0 0 0 -190,0 v54 a95.0,9 0 0 0 190,0 v-54" fill="#fffbeb" stroke="#b45309" stroke-width="1.6"/>
<text x="597.0" y="345.5" font-size="15" font-weight="700" fill="#451a03" text-anchor="middle">index_outbox</text>
<text x="597.0" y="365.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">one revision per change</text>
<path d="M615,224 L615,253 L385,253 L385,310" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<path d="M480,346 L502,346" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<rect x="12" y="414" width="696" height="170" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="28" y="436" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">3. AFTER COMMIT</text>
<text x="226" y="436" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">external backends only; replays are harmless, older revisions are dropped</text>
<rect x="28" y="476" width="200" height="86" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="128.0" y="504.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">drain_outbox</text>
<text x="128.0" y="524.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">advisory lock per</text>
<text x="128.0" y="544.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">document, retry, then dead</text>
<rect x="260" y="476" width="200" height="86" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="360.0" y="504.0" font-size="15" font-weight="700" fill="#2e1065" text-anchor="middle">embed</text>
<text x="360.0" y="524.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">heading + chunk text</text>
<text x="360.0" y="544.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">failure: keyword-only</text>
<path d="M492,485 a100.0,9 0 0 0 200,0 a100.0,9 0 0 0 -200,0 v68 a100.0,9 0 0 0 200,0 v-68" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
<text x="592.0" y="518.5" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">external index</text>
<text x="592.0" y="538.5" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">OpenSearch or Pinecone</text>
<path d="M597,382 L597,405 L200,405 L200,476" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<path d="M228,519 L260,519" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<path d="M460,519 L492,519" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
</svg>
