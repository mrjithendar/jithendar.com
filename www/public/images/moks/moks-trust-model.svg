<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 650" width="720" height="650" role="img" aria-labelledby="moks-trust-model-title moks-trust-model-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="moks-trust-model-title">MOKS: where skills and knowledge enter an investigation</title>
<desc id="moks-trust-model-desc">An investigation runs triage, logs, skills, a bounded plan and act loop, correlation and a report. SKILL.md files enter on the trusted side, as tool steps and prompt instructions. Knowledge, logs and tool output enter on the untrusted side, through kb_search and other read-only tools, and every tool call passes the ToolExecutor. The report is then validated against the evidence collected.</desc>
<defs><marker id="arrow-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrow-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker><marker id="arrow-telemetry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="arrow-dlq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#be123c"/></marker></defs>
<rect width="100%" height="100%" rx="18" fill="#ffffff"/>
<text x="24" y="40" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Where skills and knowledge enter an investigation</text>
<text x="24" y="62" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Skills are reviewed instructions. Knowledge is untrusted data. Neither can act without the ToolExecutor.</text>
<rect x="12" y="84" width="200" height="540" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="28" y="106" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">TRUSTED</text>
<text x="28" y="123" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">reviewed in Git</text>
<rect x="232" y="84" width="256" height="540" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="248" y="106" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">INVESTIGATION</text>
<text x="248" y="123" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">LangGraph, bounded</text>
<rect x="508" y="84" width="200" height="540" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="524" y="106" font-size="11.5" font-weight="700" fill="#475569" text-anchor="start">TOOLS AND DATA</text>
<text x="524" y="123" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">results fenced as untrusted</text>
<rect x="262" y="136" width="196" height="46" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="360.0" y="154.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">triage</text>
<text x="360.0" y="174.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">baseline, detectors</text>
<rect x="262" y="202" width="196" height="46" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="360.0" y="220.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">logs</text>
<text x="360.0" y="240.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">read before any skill</text>
<rect x="262" y="268" width="196" height="46" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
<text x="360.0" y="286.0" font-size="15" font-weight="700" fill="#2e1065" text-anchor="middle">skills</text>
<text x="360.0" y="306.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">select, run steps</text>
<rect x="262" y="334" width="196" height="46" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2.4"/>
<text x="360.0" y="352.0" font-size="15" font-weight="700" fill="#2e1065" text-anchor="middle">plan &lt;-&gt; act</text>
<text x="360.0" y="372.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">up to 4 rounds</text>
<rect x="262" y="400" width="196" height="46" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="360.0" y="418.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">correlate</text>
<text x="360.0" y="438.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">changes vs symptoms</text>
<rect x="262" y="466" width="196" height="46" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
<text x="360.0" y="484.0" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">report</text>
<text x="360.0" y="504.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">facts cite E-refs</text>
<rect x="262" y="548" width="196" height="56" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2.4"/>
<text x="360.0" y="571.0" font-size="15" font-weight="700" fill="#1e1b4b" text-anchor="middle">report validation</text>
<text x="360.0" y="591.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">uncited facts dropped</text>
