<text x="112.0" y="308.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">published generation,</text>
<text x="112.0" y="328.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">pinned by digest</text>
