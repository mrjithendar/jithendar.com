<path d="M112,338 L112,372 L262,372" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<text x="176" y="364" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">body joins prompt</text>
<rect x="524" y="202" width="168" height="70" rx="10" fill="#eef2ff" stroke="#4338ca" stroke-width="2.4"/>
