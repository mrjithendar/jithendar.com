<path d="M360,512 L360,548" fill="none" stroke="#475569" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow-sync)"/>
<rect x="28" y="268" width="168" height="70" rx="10" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.6"/>
