<text x="608.0" y="341.0" font-size="15" font-weight="700" fill="#064e3b" text-anchor="middle">live systems</text>
<text x="608.0" y="361.0" font-size="12.5" font-weight="400" fill="#334155" text-anchor="middle">Kubernetes, metrics, logs</text>
