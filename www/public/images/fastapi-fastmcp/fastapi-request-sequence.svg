<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 690" width="620" height="690" role="img" aria-labelledby="fastapi-request-sequence-title fastapi-request-sequence-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="fastapi-request-sequence-title">FastAPI request sequence for a MOKS investigation</title>
<desc id="fastapi-request-sequence-desc">The browser posts an investigation with its session cookie and CSRF token. moks-api loads the session, validates the body, checks the namespace scope and commits a queued row and audit record before answering 201. The browser opens a Server-Sent Events stream. A separate worker claims the row with SKIP LOCKED, writes events and the API streams them from PostgreSQL until the investigation ends.</desc>
<rect width="620" height="690" fill="#ffffff"/>
<defs>
<marker id="fastapi-request-sequence-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="fastapi-request-sequence-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="fastapi-request-sequence-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="fastapi-request-sequence-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="fastapi-request-sequence-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="fastapi-request-sequence-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<line x1="95.0" y1="66" x2="95.0" y2="674" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="238.0" y1="66" x2="238.0" y2="674" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="382.0" y1="66" x2="382.0" y2="674" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="525.0" y1="66" x2="525.0" y2="674" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4 4"/>
<polyline points="95.5,114.0 237.5,114.0" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#fastapi-request-sequence-write)"/>
<polyline points="238.5,282.0 381.5,282.0" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#fastapi-request-sequence-write)"/>
<polyline points="381.5,314.0 238.5,314.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#fastapi-request-sequence-dashed)"/>
<polyline points="237.5,346.0 95.5,346.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#fastapi-request-sequence-dashed)"/>
<polyline points="95.5,382.0 237.5,382.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#fastapi-request-sequence-sync)"/>
<polyline points="524.5,422.0 382.5,422.0" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#fastapi-request-sequence-write)"/>
<polyline points="524.5,506.0 382.5,506.0" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#fastapi-request-sequence-write)"/>
<polyline points="238.5,546.0 381.5,546.0" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#fastapi-request-sequence-sync)"/>
<polyline points="381.5,586.0 238.5,586.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#fastapi-request-sequence-dashed)"/>
<polyline points="237.5,626.0 95.5,626.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#fastapi-request-sequence-dashed)"/>
<polyline points="95.5,660.0 237.5,660.0" fill="none" stroke="#64748b" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#fastapi-request-sequence-dashed)"/>
<rect x="30" y="16" width="130" height="50" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
<text x="95.0" y="40.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Browser</text>
<text x="95.0" y="56.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">React UI</text>
<rect x="173" y="16" width="130" height="50" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="238.0" y="40.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">moks-api</text>
<text x="238.0" y="56.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">FastAPI</text>
<rect x="317" y="16" width="130" height="50" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.4"/>
<text x="382.0" y="48.0" text-anchor="middle" font-size="14" font-weight="600" fill="#451a03">PostgreSQL</text>
<rect x="460" y="16" width="130" height="50" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="525.0" y="40.0" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">moks worker</text>
<text x="525.0" y="56.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">no HTTP</text>
<rect x="140" y="124" width="196" height="58" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="238.0" y="144.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Dependencies</text>
<text x="238.0" y="160.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">get_auth: 401, CSRF 403</text>
<text x="238.0" y="176.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">CreateIn: 422 if invalid</text>
<rect x="140" y="186" width="196" height="58" rx="7" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
<text x="238.0" y="206.0" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Policy</text>
<text x="238.0" y="222.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">require(), effective_scope()</text>
<text x="238.0" y="238.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">403 and an audit record</text>
<rect x="422" y="434" width="190" height="46" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="517.0" y="456.0" text-anchor="middle" font-size="14" font-weight="600" fill="#475569">Runs the graph</text>
<text x="517.0" y="472.0" text-anchor="middle" font-size="12" font-weight="400" fill="#334155">ToolExecutor to live systems</text>
<rect x="90.7" y="77.0" width="151.5" height="32" fill="#ffffff" opacity="0.92"/>
<text x="166.5" y="89.0" text-anchor="middle" font-size="12" fill="#0f172a">1. POST /investigations</text>
<text x="166.5" y="104.0" text-anchor="middle" font-size="12" fill="#0f172a">cookie, x-csrf-token</text>
<rect x="240.5" y="245.0" width="139.0" height="32" fill="#ffffff" opacity="0.92"/>
<text x="310.0" y="257.0" text-anchor="middle" font-size="12" fill="#0f172a">2. INSERT queued row,</text>
<text x="310.0" y="272.0" text-anchor="middle" font-size="12" fill="#0f172a">event 0 and audit</text>
<rect x="212.4" y="292.5" width="195.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="310.0" y="304.5" text-anchor="middle" font-size="12" fill="#0f172a">3. commit, before the response</text>
<rect x="62.7" y="324.5" width="207.7" height="17" fill="#ffffff" opacity="0.92"/>
<text x="166.5" y="336.5" text-anchor="middle" font-size="12" fill="#0f172a">4. 201 with the investigation id</text>
<rect x="56.4" y="360.5" width="220.2" height="17" fill="#ffffff" opacity="0.92"/>
<text x="166.5" y="372.5" text-anchor="middle" font-size="12" fill="#0f172a">5. GET /investigations/{id}/events</text>
<rect x="384.0" y="400.5" width="139.0" height="17" fill="#ffffff" opacity="0.92"/>
<text x="453.5" y="412.5" text-anchor="middle" font-size="12" fill="#0f172a">6. claim: SKIP LOCKED</text>
<rect x="399.6" y="484.5" width="107.8" height="17" fill="#ffffff" opacity="0.92"/>
<text x="453.5" y="496.5" text-anchor="middle" font-size="12" fill="#0f172a">7. INSERT events</text>
<rect x="209.3" y="524.5" width="201.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="310.0" y="536.5" text-anchor="middle" font-size="12" fill="#0f172a">8. poll new events, every 0.5 s</text>
<rect x="231.1" y="564.5" width="157.8" height="17" fill="#ffffff" opacity="0.92"/>
<text x="310.0" y="576.5" text-anchor="middle" font-size="12" fill="#0f172a">9. rows after the cursor</text>
<rect x="65.8" y="604.5" width="201.4" height="17" fill="#ffffff" opacity="0.92"/>
<text x="166.5" y="616.5" text-anchor="middle" font-size="12" fill="#0f172a">10. SSE events, then event: end</text>
<rect x="75.1" y="638.5" width="182.7" height="17" fill="#ffffff" opacity="0.92"/>
<text x="166.5" y="650.5" text-anchor="middle" font-size="12" fill="#0f172a">reconnect with Last-Event-ID</text>
</svg>
