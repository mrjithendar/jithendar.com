<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 716" width="620" height="716" role="img" aria-labelledby="fastapi-fastmcp-overview-title fastapi-fastmcp-overview-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="fastapi-fastmcp-overview-title">Where FastAPI and FastMCP run across RoboShop AI and MOKS</title>
<desc id="fastapi-fastmcp-overview-desc">Two projects use these packages, in four services. In RoboShop AI, ai-gateway uses FastAPI and mcp-server uses FastMCP, and mcp-server calls ai-gateway over HTTP. The moks shopping assistant uses Waitress and the domain services use neither package. In the MOKS portal, moks-api and moks-terminal use FastAPI, and the worker has no HTTP API. No MOKS component uses MCP.</desc>
