<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 760" width="620" height="760" role="img" aria-labelledby="fastmcp-tool-call-sequence-title fastmcp-tool-call-sequence-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="fastmcp-tool-call-sequence-title">MCP tool call sequence through FastMCP</title>
<desc id="fastmcp-tool-call-sequence-desc">On the left, outside the cluster, a host with its model and an MCP client. On the right, inside the cluster, mcp-server and ai-gateway. The client lists tools and mcp-server verifies the session and returns the tools for that role. The model picks search_products, a read that may be retried once. It then picks update_cart, a write that is never retried. ai-gateway authorizes both calls again, and the session is verified on every request with no cache.</desc>
<rect width="620" height="760" fill="#ffffff"/>
<defs>
<marker id="fastmcp-tool-call-sequence-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="fastmcp-tool-call-sequence-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
<marker id="fastmcp-tool-call-sequence-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#be123c"/></marker>
<marker id="fastmcp-tool-call-sequence-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b91c1c"/></marker>
<marker id="fastmcp-tool-call-sequence-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
<marker id="fastmcp-tool-call-sequence-life" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
