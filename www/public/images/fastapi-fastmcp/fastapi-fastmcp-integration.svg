<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 690" width="620" height="690" role="img" aria-labelledby="fastapi-fastmcp-integration-title fastapi-fastmcp-integration-desc" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="fastapi-fastmcp-integration-title">How FastMCP and FastAPI connect in RoboShop AI</title>
<desc id="fastapi-fastmcp-integration-desc">mcp-server and ai-gateway are separate pods with separate ASGI applications. An external client calls POST /mcp, handled by HTTPTracing, the FastMCP http_app and GatewayTool. GatewayClient calls ai-gateway over plain HTTP with the caller&#x27;s rs_auth cookie, an origin header on writes and trace headers. A browser reaches the same FastAPI dispatch route. Gateway.handle makes the authorization decision for both paths, then calls the domain services.</desc>
