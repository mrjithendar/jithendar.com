<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Proposed TypeScript and Python architecture</title>
  <desc id="d">A TypeScript user interface in the browser sends HTTP requests with JSON bodies to a Python API. The API validates requests with Pydantic and calls AI and data libraries. Optionally, the API publishes an OpenAPI schema, a generator turns it into a typed TypeScript client, and the user interface imports that client and can validate responses with Zod.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#ffffff"/>

  <!-- Main path -->
  <rect x="20" y="40" width="210" height="100" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="125" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Browser</text>
  <text x="125" y="90" text-anchor="middle" font-size="13" fill="#0f172a">TypeScript user interface</text>
  <text x="125" y="112" text-anchor="middle" font-size="12" fill="#475569">optional: Zod checks</text>
  <text x="125" y="128" text-anchor="middle" font-size="12" fill="#475569">on responses</text>

  <rect x="290" y="40" width="210" height="100" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="395" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Python API</text>
  <text x="395" y="90" text-anchor="middle" font-size="13" fill="#0f172a">FastAPI</text>
  <text x="395" y="112" text-anchor="middle" font-size="12" fill="#475569">Pydantic validates</text>
  <text x="395" y="128" text-anchor="middle" font-size="12" fill="#475569">every request</text>

  <rect x="560" y="40" width="140" height="100" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="630" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">AI and data</text>
  <text x="630" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">libraries</text>

  <line x1="232" y1="75" x2="286" y2="75" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="288" y1="108" x2="234" y2="108" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="260" y="30" text-anchor="middle" font-size="12" fill="#0f172a">HTTP + JSON</text>
  <line x1="502" y1="90" x2="556" y2="90" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Optional client generation -->
  <rect x="290" y="200" width="210" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="395" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">OpenAPI schema</text>
  <text x="395" y="247" text-anchor="middle" font-size="12" fill="#475569">/openapi.json</text>

  <rect x="20" y="200" width="210" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="125" y="227" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Generated</text>
  <text x="125" y="247" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">TypeScript client</text>

  <line x1="395" y1="142" x2="395" y2="196" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <line x1="288" y1="232" x2="234" y2="232" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="260" y="222" text-anchor="middle" font-size="11" fill="#475569">generator</text>
  <line x1="125" y1="198" x2="125" y2="144" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
  <text x="133" y="176" font-size="11" fill="#475569">imported by the UI</text>

  <text x="20" y="305" font-size="12" fill="#475569">Dashed: optional. My projects write their client types by hand and do not generate them.</text>
</svg>
