# Engineering roles for /python-practice. Seeded into practice_role once; admins add and edit roles in
# Admin → Python practice → Roles afterwards (no code change needed). `icon` is a name from components/icons.tsx
# (chip bot flow cloud wheel loop code shield layers book database network). `mix` is the recommended share of
# questions per difficulty (percent) for a role-focused session.
- slug: python-developer
  name: Python Developer
  icon: code
  description: Idiomatic, well-tested Python for applications and libraries.
  competencies: [Core data structures, Functions and closures, Classes and dataclasses, Iterators and generators, Error handling, Testing]
  path: [Strings and collections, Functions and comprehensions, Classes and dataclasses, Generators and decorators, Concurrency basics]
  topics: [strings, lists, dictionaries, functions, classes, dataclasses, decorators, generators, exceptions, testing]
  mix: { beginner: 25, easy: 30, medium: 30, hard: 10, expert: 5 }
  scenarios: [Refactor a script into a reusable module, Write a decorator that adds retries, Parse and validate configuration]
  libraries: [collections, itertools, functools, dataclasses, typing, pytest]
- slug: devops-engineer
  name: DevOps Engineer
  icon: loop
  description: Scripting and automation around builds, deployments, configuration and logs.
  competencies: [Python scripting, Filesystem automation, JSON and YAML processing, Log analysis, REST API automation, CI/CD automation]
  path: [Text and config parsing, Log analysis, API automation with retries, Infrastructure automation, Concurrency for automation]
  topics: [file-handling, parsing, json, log-analysis, http-apis, retries, cicd, infrastructure-as-code, concurrency, aws, kubernetes]
  mix: { beginner: 15, easy: 30, medium: 35, hard: 15, expert: 5 }
  scenarios: [Summarise a deployment log, Plan log rotation, Detect configuration drift, Parse cron schedules]
  libraries: [pathlib, json, PyYAML, requests, boto3, kubernetes, subprocess, concurrent.futures]
