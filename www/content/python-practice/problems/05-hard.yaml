    - { args: [[{ status: 200, items: [], next: null }]] }
    - { args: [[{ status: 503 }, { status: 503 }, { status: 503 }, { status: 503 }, { status: 200, items: ["a"], next: "x" }, { status: 503 }, { status: 429, retry_after: 2 }, { status: 503 }, { status: 200, items: ["b"], next: null }]] }

- slug: sql-window-functions
  title: Window functions in Python
  difficulty: hard
  roles: [data-engineer, forward-deployed-engineer, backend-engineer]
  topics: [sql-patterns, sorting, etl]
  minutes: 30
  entrypoint: windowed
  description: |
    Reproduce this SQL in Python:

    ```sql
    SELECT user, day, amount,
           SUM(amount) OVER (PARTITION BY user ORDER BY day) AS running_total,
           DENSE_RANK() OVER (PARTITION BY user ORDER BY amount DESC) AS amount_rank,
           amount - LAG(amount) OVER (PARTITION BY user ORDER BY day) AS change
    FROM orders ORDER BY user, day
    ```

    Days within a user are unique ISO dates. `change` is `None` for a user's first day. Return the rows
    with the extra columns.
  io: { input: "rows: list[dict] with user, day, amount", output: "list[dict]" }
  starter: |
    def windowed(rows: list[dict]) -> list[dict]:
        return sorted(rows, key=lambda r: (r["user"], r["day"]))
  hints:
    - "Partition first (group by user), then work on each sorted partition."
    - "Running total and lag are one pass in day order; dense rank maps each distinct amount (descending) to 1, 2, 3…"
    - |
      for user, part in groups: part.sort(key=day); ranks = {a: i + 1 for i, a in enumerate(sorted({r["amount"] for r in part}, reverse=True))}
          total = 0; prev = None; for r in part: total += amount; out.append({**r, running_total, amount_rank: ranks[amount], change: None if prev is None else amount - prev})
  solution:
    code: |
      from collections import defaultdict

      def windowed(rows: list[dict]) -> list[dict]:
          partitions: dict = defaultdict(list)
          for row in rows:
              partitions[row["user"]].append(row)
          out = []
          for user in sorted(partitions):
              part = sorted(partitions[user], key=lambda r: r["day"])
              distinct = sorted({r["amount"] for r in part}, reverse=True)
              rank = {amount: i + 1 for i, amount in enumerate(distinct)}
              total, previous = 0, None
              for r in part:
                  total += r["amount"]
                  out.append({**r, "running_total": total, "amount_rank": rank[r["amount"]], "change": None if previous is None else r["amount"] - previous})
                  previous = r["amount"]
          return out
    explanation: Window functions are "group, sort, then compute per row with access to neighbours". Dense rank gives equal amounts the same rank with no gaps.
    time: O(n log n)
    space: O(n)
    alternatives: ["pandas: groupby().cumsum(), rank(method='dense', ascending=False), diff()", "Let the database do it — usually the right answer"]
    edge_cases: ["Ties in amount", "Single row per user", "Negative amounts (refunds)"]
    production: ["Window functions over huge partitions need sorting spills — push them to the warehouse"]
  examples:
    - args: [[{ user: "b", day: "2026-01-02", amount: 5 }, { user: "a", day: "2026-01-02", amount: 30 }, { user: "a", day: "2026-01-01", amount: 10 }, { user: "a", day: "2026-01-03", amount: 30 }]]
      expected:
        - { user: "a", day: "2026-01-01", amount: 10, running_total: 10, amount_rank: 2, change: null }
        - { user: "a", day: "2026-01-02", amount: 30, running_total: 40, amount_rank: 1, change: 20 }
        - { user: "a", day: "2026-01-03", amount: 30, running_total: 70, amount_rank: 1, change: 0 }
        - { user: "b", day: "2026-01-02", amount: 5, running_total: 5, amount_rank: 1, change: null }
  hidden:
    - { args: [[]] }
    - { args: [[{ user: "u", day: "2026-03-01", amount: -2 }, { user: "u", day: "2026-02-01", amount: 7 }, { user: "u", day: "2026-04-01", amount: 7 }, { user: "u", day: "2026-05-01", amount: 1 }]] }

- slug: multi-region-traffic
  title: Plan multi-region traffic
  difficulty: hard
  roles: [cloud-engineer, solutions-architect, site-reliability-engineer]
  topics: [resilience, sorting, simulation]
  minutes: 30
  entrypoint: allocate
  description: |
    Distribute `demand` units of traffic across regions `[{"name", "healthy", "latency_ms", "capacity"}]`:

    1. Only healthy regions get traffic.
    2. Keep `headroom` percent of each region's capacity free (usable = floor(capacity × (100 − headroom) / 100)).
    3. Fill regions in order of latency (ties by name) up to their usable capacity.
    4. If demand still remains, use the reserved headroom in the same order (up to full capacity) and set
       `"degraded": true`.

    Return `{"allocation": {region: units} (only regions with traffic), "unserved": n, "degraded": bool}`.
  io: { input: "regions: list[dict], demand: int, headroom: int", output: "dict" }
  starter: |
    def allocate(regions, demand, headroom):
        healthy = [r for r in regions if r["healthy"]]
        share = demand // max(len(healthy), 1)
        return {"allocation": {r["name"]: share for r in healthy}, "unserved": 0, "degraded": False}
  hints:
    - "Two greedy passes over the same ordering: normal capacity first, then headroom."
    - "Sort healthy regions by (latency_ms, name). Track remaining demand and per-region allocation."
    - |
      order = sorted(healthy, key=lambda r: (r["latency_ms"], r["name"]))
      for r in order: take = min(remaining, usable(r)); alloc[r] += take; remaining -= take
      if remaining: degraded = True; for r in order: take = min(remaining, r["capacity"] - alloc[r]) ...
  solution:
    code: |
      def allocate(regions, demand, headroom):
          order = sorted((r for r in regions if r["healthy"]), key=lambda r: (r["latency_ms"], r["name"]))
          alloc = {r["name"]: 0 for r in order}
          remaining = demand
          for r in order:
              usable = r["capacity"] * (100 - headroom) // 100
              take = min(remaining, usable)
              alloc[r["name"]] += take
              remaining -= take
          degraded = False
          if remaining > 0:
              for r in order:
                  take = min(remaining, r["capacity"] - alloc[r["name"]])
                  if take > 0:
                      degraded = True
                      alloc[r["name"]] += take
                      remaining -= take
          return {"allocation": {k: v for k, v in alloc.items() if v}, "unserved": remaining, "degraded": degraded}
    explanation: |
      Latency-first greedy keeps users close; the headroom reserve absorbs spikes and the loss of another
      region. Spending it is allowed, but the plan says so loudly, because the next failure will not be
      absorbed.
    time: O(r log r)
    space: O(r)
    alternatives: ["Weighted round robin proportional to capacity (better spread, worse latency)", "Linear programming when costs and latencies per user region matter"]
    edge_cases: ["No healthy regions → all unserved", "Demand 0", "Headroom 0"]
    production: ["Use integer weights in DNS/global load balancers (Route 53 weighted records)", "Re-plan continuously from health checks, with hysteresis to avoid flapping"]
  examples:
    - args:
        - - { name: "eu-west-1", healthy: true, latency_ms: 20, capacity: 100 }
          - { name: "us-east-1", healthy: true, latency_ms: 80, capacity: 200 }
          - { name: "ap-south-1", healthy: false, latency_ms: 10, capacity: 500 }
        - 250
        - 20
      expected: { allocation: { eu-west-1: 90, us-east-1: 160 }, unserved: 0, degraded: true }
      explanation: "Usable capacity is 80 + 160 = 240, so the last 10 units come from headroom, lowest latency first (eu-west-1)."
  hidden:
    - { args: [[{ name: "a", healthy: false, latency_ms: 1, capacity: 10 }], 5, 0] }
    - { args: [[{ name: "b", healthy: true, latency_ms: 5, capacity: 10 }, { name: "a", healthy: true, latency_ms: 5, capacity: 10 }], 25, 10] }
    - { args: [[{ name: "x", healthy: true, latency_ms: 5, capacity: 999 }], 0, 30] }

- slug: cron-next-run
  title: Compute the next cron run
  difficulty: hard
  roles: [devops-engineer, automation-engineer, infrastructure-automation-engineer]
  topics: [datetime, parsing, simulation]
  minutes: 40
  entrypoint: next_run
  description: |
    Given a five-field cron expression (`minute hour day-of-month month day-of-week`) and a start time
    `"YYYY-MM-DDTHH:MM"`, return the next matching time **strictly after** the start, in the same format.

    - Fields support `*`, numbers, ranges `a-b`, steps `*/n` and `a-b/n`, and comma lists.
    - Day of week: 0–7 where both 0 and 7 are Sunday.
    - If both day-of-month and day-of-week are restricted (not `*`), a day matches when **either** matches
      (classic cron). Otherwise only the restricted one applies.
    - Return `None` if nothing matches within the next 5 years (e.g. February 30th).
  io: { input: "expr: str, start: str", output: "str | None" }
  starter: |
    from datetime import datetime, timedelta

    def next_run(expr: str, start: str):
        t = datetime.fromisoformat(start) + timedelta(minutes=1)
        return t.strftime("%Y-%m-%dT%H:%M")
  hints:
    - "Expand each field into a set of allowed values first, then search forward."
    - "Search day by day (only check hours/minutes on days that match), not minute by minute."
    - |
      day = start.date(); for each day up to 5 years: if month ok and day ok:
          for h in sorted(hours): for m in sorted(minutes): t = datetime(day, h, m); if t > start: return t
  solution:
    code: |
      from datetime import date, datetime, timedelta

      def expand(field: str, low: int, high: int) -> set[int]:
          values: set[int] = set()
          for part in field.split(","):
              rng, _, step = part.partition("/")
              step_n = int(step) if step else 1
              if rng == "*":
                  a, b = low, high
              elif "-" in rng:
                  a, b = (int(x) for x in rng.split("-", 1))
              else:
                  a = b = int(rng)
                  if step:
                      b = high
              values.update(range(a, b + 1, step_n))
          return values

      def next_run(expr: str, start: str):
          minute_f, hour_f, dom_f, month_f, dow_f = expr.split()
          minutes, hours = sorted(expand(minute_f, 0, 59)), sorted(expand(hour_f, 0, 23))
          doms, months = expand(dom_f, 1, 31), expand(month_f, 1, 12)
          dows = {d % 7 for d in expand(dow_f, 0, 7)}
          t0 = datetime.fromisoformat(start)
          day = t0.date()
          for _ in range(366 * 5 + 2):
              if day.month in months:
                  dom_ok = day.day in doms
                  dow_ok = (day.weekday() + 1) % 7 in dows
                  if dom_f != "*" and dow_f != "*":
                      day_ok = dom_ok or dow_ok
                  else:
                      day_ok = dom_ok and dow_ok
                  if day_ok:
                      for h in hours:
                          for m in minutes:
                              t = datetime(day.year, day.month, day.day, h, m)
                              if t > t0:
                                  return t.strftime("%Y-%m-%dT%H:%M")
              day += timedelta(days=1)
          return None
    explanation: |
      Python's weekday() has Monday = 0, cron has Sunday = 0, hence `(weekday() + 1) % 7`. The OR rule for
      day-of-month and day-of-week is a famous cron surprise: `0 0 13 * 5` runs on every 13th **and** every
      Friday.
    time: O(days searched + hours × minutes on the first matching day)
    space: O(60 + 24 + 31 + 12 + 7)
    alternatives: ["croniter", "Jump field by field (minute → hour → day) for O(1)-ish next-time computation"]
    edge_cases: ["Start exactly on a match is excluded", "Leap days (0 0 29 2 *)", "Impossible dates (0 0 30 2 *)", "7 as Sunday"]
    production: ["Decide the time zone explicitly — cron runs in the host's local time, and DST skips or repeats hours"]
  examples:
    - { args: ["*/15 9-17 * * 1-5", "2026-11-06T17:50"], expected: "2026-11-09T09:00", explanation: "Friday after 17:45 → Monday 09:00." }
    - { args: ["0 0 29 2 *", "2026-03-01T00:00"], expected: "2028-02-29T00:00" }
  hidden:
    - { args: ["0 0 30 2 *", "2026-01-01T00:00"] }
    - { args: ["30 4 13 * 5", "2026-11-02T10:00"] }
    - { args: ["0 12 * * 7", "2026-11-08T12:00"] }
    - { args: ["* * * * *", "2026-12-31T23:59"] }

- slug: capacity-planning-dp
  title: Plan server capacity at minimum cost
  difficulty: hard
  roles: [software-development-engineer, solutions-architect, platform-engineer]
  topics: [dynamic-programming, complexity]
  minutes: 40
  entrypoint: plan_capacity
  description: |
    For each hour t you choose a server count s_t with `demand[t] ≤ s_t ≤ max_servers`. The cost is
    `run_cost × s_t` per hour plus `change_cost × |s_t − s_{t−1}|` for scaling, where `s_{−1} = initial`.

    Return `{"cost": minimum_total_cost, "plan": [s_0, s_1, ...]}`. If several plans cost the same, return the
    lexicographically smallest. If any demand exceeds `max_servers`, return `None`.
  io: { input: "demand: list[int], max_servers: int, initial: int, run_cost: int, change_cost: int", output: "dict | None" }
  starter: |
    def plan_capacity(demand, max_servers, initial, run_cost, change_cost):
        plan = list(demand)
        prev, cost = initial, 0
        for s in plan:
            cost += run_cost * s + change_cost * abs(s - prev)
            prev = s
        return {"cost": cost, "plan": plan}
  hints:
    - "Matching demand exactly every hour isn't optimal when scaling is expensive — keep servers through a dip."
    - "DP over (hour, servers): best[t][s] = cheapest cost of hours t..end given s_t = s. Fill it backwards."
    - |
      best[T-1][s] = run*s for valid s; best[t][s] = run*s + min(change*|s2 - s| + best[t+1][s2] for valid s2)
      then walk forward from prev = initial choosing the smallest s with change*|s-prev| + best[t][s] == optimum
  solution:
    code: |
      def plan_capacity(demand, max_servers, initial, run_cost, change_cost):
          if any(d > max_servers for d in demand):
              return None
          T = len(demand)
          if T == 0:
              return {"cost": 0, "plan": []}
          INF = float("inf")
          best = [[INF] * (max_servers + 1) for _ in range(T)]
          for s in range(demand[-1], max_servers + 1):
              best[-1][s] = run_cost * s
          for t in range(T - 2, -1, -1):
              for s in range(demand[t], max_servers + 1):
                  best[t][s] = run_cost * s + min(change_cost * abs(s2 - s) + best[t + 1][s2] for s2 in range(demand[t + 1], max_servers + 1))
          plan, prev, total = [], initial, None
          for t in range(T):
              options = [(change_cost * abs(s - prev) + best[t][s], s) for s in range(demand[t], max_servers + 1)]
              cost_here = min(c for c, _ in options)
              if total is None:
                  total = cost_here
              s = min(s for c, s in options if c == cost_here)
              plan.append(s)
              prev = s
          return {"cost": int(total), "plan": plan}
    explanation: |
      Filling the table backwards gives, for every hour and server count, the cheapest way to finish. Walking
      forward and always taking the smallest count that still achieves that optimum produces the
      lexicographically smallest optimal plan.
    time: O(T × S²)
    space: O(T × S)
    alternatives: ["Forward DP with predecessor pointers (tie-breaking is harder)", "Convex cost tricks reduce the transition to O(S)"]
    edge_cases: ["Empty demand", "Demand above max → None", "change_cost 0 → follow demand exactly"]
    production: ["Real autoscaling uses forecasts with uncertainty — plan for a percentile of demand", "Scaling has lead time; this model assumes instant changes"]
  examples:
    - args: [[3, 1, 3], 5, 0, 1, 2]
      expected: { cost: 15, plan: [3, 3, 3] }
      explanation: "Dropping to 1 server saves 2 in running cost but costs 4 + 4 in scaling."
  hidden:
    - { args: [[], 3, 2, 1, 1] }
    - { args: [[6], 5, 0, 1, 1] }
    - { args: [[1, 4, 1, 4, 1], 6, 1, 2, 1] }
    - { args: [[2, 2, 0, 0, 0, 3], 4, 0, 1, 3] }

- slug: sse-stream-parser
  title: Parse a server-sent event stream
  difficulty: hard
  roles: [genai-engineer, full-stack-engineer, backend-engineer]
  topics: [streaming, parsing, generators]
  minutes: 30
  entrypoint: parse_sse
  description: |
    LLM APIs stream tokens as server-sent events. The bytes arrive in arbitrary chunks (a line can be split
    across chunks). Parse them per the SSE rules:

    - Lines end with `\n` or `\r\n`.
    - `field: value` — strip **one** space after the colon if present. Fields: `event`, `data`, `id`.
    - Lines starting with `:` are comments. A line without a colon is a field with an empty value.
    - Multiple `data` lines in one event are joined with `\n`.
    - A blank line dispatches the event if it has any data line: `{"event": type or "message", "data": ...,
      "id": last id seen in the stream or None}`. `event` and `data` reset after dispatch; `id` persists.
    - An event that is never terminated by a blank line is **not** dispatched.
  io: { input: "chunks: list[str]", output: "list[dict]" }
  starter: |
    def parse_sse(chunks: list[str]) -> list[dict]:
        events = []
        for chunk in chunks:
            for line in chunk.split("\n"):
                if line.startswith("data: "):
                    events.append({"event": "message", "data": line[6:], "id": None})
        return events
  hints:
    - "Buffer text and only process complete lines; keep the incomplete tail for the next chunk."
    - "Maintain state: current event type, list of data lines, last id. A blank line dispatches."
    - |
      buffer += chunk; while "\n" in buffer: line, buffer = buffer.split("\n", 1); line = line.rstrip("\r")
          if line == "": dispatch if data; reset event/data
          elif line.startswith(":"): continue
          else: field, _, value = line.partition(":"); value = value[1:] if value.startswith(" ") else value
  solution:
    code: |
      def parse_sse(chunks: list[str]) -> list[dict]:
          events: list[dict] = []
          buffer = ""
          event_type, data, last_id = "", [], None
          for chunk in chunks:
              buffer += chunk
              while "\n" in buffer:
                  line, buffer = buffer.split("\n", 1)
                  if line.endswith("\r"):
                      line = line[:-1]
                  if line == "":
                      if data:
                          events.append({"event": event_type or "message", "data": "\n".join(data), "id": last_id})
                      event_type, data = "", []
                      continue
                  if line.startswith(":"):
                      continue
                  field, _, value = line.partition(":")
                  if value.startswith(" "):
                      value = value[1:]
                  if field == "data":
                      data.append(value)
                  elif field == "event":
                      event_type = value
                  elif field == "id":
                      last_id = value
          return events
    explanation: |
      Network chunks don't respect line boundaries, so the parser keeps a buffer and only consumes complete
      lines. The persistent id is what a client sends back as Last-Event-ID to resume a stream.
    time: O(total characters)
    space: O(longest event)
    alternatives: ["A generator that yields events as soon as they complete (what a streaming UI needs)", "httpx-sse or the provider's SDK"]
    edge_cases: ["A line split across chunks", "\\r\\n line endings", "Comments (keep-alives)", "An unterminated final event"]
    production: ["Treat a 'data: [DONE]' sentinel (OpenAI) as end of stream", "Time out if no bytes arrive for a while — streams hang silently"]
  examples:
    - args: [["event: delta\ndata: Hel", "lo\n\n: keep-alive\nid: 7\ndata: wor", "ld\ndata: !\n\ndata: [DONE]\n"]]
      expected: [{ event: "delta", data: "Hello", id: null }, { event: "message", data: "world\n!", id: "7" }]
  hidden:
    - { args: [[]] }
    - { args: [["data:no-space\r\n\r\ndata:  two spaces\n\n"]] }
    - { args: [["id: 1\n\nevent: x\n\n", "data\n\n", "d", "a", "t", "a", ":", " ", "z", "\n", "\n"]] }
