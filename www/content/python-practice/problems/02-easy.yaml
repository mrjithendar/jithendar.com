- slug: latest-event-per-id
  title: Keep the latest event per ID
  difficulty: easy
  roles: [data-engineer, backend-engineer, forward-deployed-engineer]
  topics: [dictionaries, etl]
  minutes: 10
  entrypoint: latest_events
  description: |
    A queue delivered events out of order and with duplicates. Each event is `{"id": str, "ts": int, ...}`.
    Keep only the event with the highest `ts` for each id; if two events for an id have the same `ts`, keep
    the one that appears **later** in the input. Return the kept events sorted by id.
  io: { input: "events: list[dict]", output: "list[dict]" }
  starter: |
    def latest_events(events: list[dict]) -> list[dict]:
        return events
  hints:
    - "One pass with a dictionary keyed by id."
    - "Replace the stored event when the new one's ts is greater than or equal to the stored ts."
    - |
      latest = {}
      for e in events: if e["id"] not in latest or e["ts"] >= latest[e["id"]]["ts"]: latest[e["id"]] = e
      return [latest[k] for k in sorted(latest)]
  solution:
    code: |
      def latest_events(events: list[dict]) -> list[dict]:
          latest: dict[str, dict] = {}
          for event in events:
              current = latest.get(event["id"])
              if current is None or event["ts"] >= current["ts"]:
                  latest[event["id"]] = event
          return [latest[key] for key in sorted(latest)]
    explanation: Using >= implements "later wins on ties" because the input is scanned in order.
    time: O(n + k log k)
    space: O(k)
    alternatives: ["Sort by (id, ts, position) and take the last of each group"]
    edge_cases: ["Ties on ts", "Single event", "Empty input"]
    production: ["Use a monotonic sequence number instead of wall-clock timestamps when producers' clocks differ"]
  examples:
    - args: [[{ id: "b", ts: 5, v: 1 }, { id: "a", ts: 1, v: 2 }, { id: "b", ts: 3, v: 3 }, { id: "a", ts: 1, v: 4 }]]
      expected: [{ id: "a", ts: 1, v: 4 }, { id: "b", ts: 5, v: 1 }]
  hidden:
    - { args: [[]] }
    - { args: [[{ id: "x", ts: 9 }, { id: "x", ts: 10 }, { id: "x", ts: 2 }]] }

- slug: expand-cron-field
  title: Expand a cron field
  difficulty: easy
  roles: [devops-engineer, automation-engineer, infrastructure-automation-engineer]
  topics: [parsing, datetime]
  minutes: 15
  entrypoint: expand_field
  description: |
    Expand one cron field into the sorted list of values it matches, given the field's allowed range
    `[low, high]`. Support:

    - `*` (every value), a single number `5`, a range `1-5`
    - steps: `*/15` and `10-30/10`
    - comma-separated lists of any of the above: `1,3,10-12`

    Raise `ValueError` for anything invalid or out of range. Return a sorted list without duplicates.
  io: { input: "field: str, low: int, high: int", output: "list[int]" }
  starter: |
    def expand_field(field: str, low: int, high: int) -> list[int]:
        return [int(field)]
  hints:
    - "Split on commas first; each part is 'range' optionally followed by '/step'."
    - "Turn every part into (start, end, step) and use range(start, end + 1, step). '*' means (low, high)."
    - |
      for part in field.split(","):
          rng, _, step = part.partition("/"); step = int(step) if step else 1
          start, end = (low, high) if rng == "*" else map(int, rng.split("-")) if "-" in rng else (int(rng), int(rng))
          validate; values.update(range(start, end + 1, step))
  solution:
    code: |
      def expand_field(field: str, low: int, high: int) -> list[int]:
          values: set[int] = set()
          for part in field.split(","):
              rng, has_step, step_text = part.partition("/")
              step = int(step_text) if has_step else 1
              if step <= 0:
                  raise ValueError(f"bad step in {part!r}")
              if rng == "*":
                  start, end = low, high
              elif "-" in rng:
                  a, b = rng.split("-", 1)
                  start, end = int(a), int(b)
              else:
                  start = end = int(rng)
                  if has_step:
                      end = high
              if start < low or end > high or start > end:
                  raise ValueError(f"{part!r} is out of range {low}-{high}")
              values.update(range(start, end + 1, step))
          return sorted(values)
    explanation: |
      Every cron form reduces to a range with a step, so one `range()` call per part does the work. A set
      removes overlaps between list items. (`5/10` means "from 5 to the end, every 10", as in Vixie cron.)
    time: O(high - low)
    space: O(high - low)
    alternatives: ["Regex-based parsing with named groups"]
    edge_cases: ["Overlapping list items", "Step larger than the range", "Out-of-range numbers raise ValueError", "Empty part (',,') raises ValueError via int('')"]
    production: ["Real cron also accepts month and weekday names and treats 7 as Sunday", "croniter is a well-tested library for this"]
  prelude: |
    def __harness__(fn, field, low, high):
        try:
            return fn(field, low, high)
        except ValueError:
            return "ValueError"
  examples:
    - { args: ["*/15", 0, 59], expected: [0, 15, 30, 45] }
    - { args: ["1,3,10-12", 1, 31], expected: [1, 3, 10, 11, 12] }
    - { args: ["60", 0, 59], expected: "ValueError", explanation: "Invalid fields raise ValueError (the test harness reports it as the string 'ValueError')." }
  hidden:
    - { args: ["10-30/10", 0, 59] }
    - { args: ["*", 1, 7] }
    - { args: ["5-1", 0, 59] }
    - { args: ["1,1,2", 0, 10] }
    - { args: ["*/0", 0, 10] }

- slug: flaky-test-detector
  title: Detect flaky tests
  difficulty: easy
  roles: [automation-engineer, devops-engineer, software-development-engineer]
  topics: [testing, dictionaries]
  minutes: 10
  entrypoint: flaky_tests
  description: |
    CI history is a list of runs `{"commit": str, "test": str, "passed": bool}`. A test is **flaky** if, for
    at least one commit, it both passed and failed. Return the sorted list of flaky test names.
  io: { input: "runs: list[dict]", output: "list[str]" }
  starter: |
    def flaky_tests(runs: list[dict]) -> list[str]:
        return []
  hints:
    - "Group outcomes by the pair (test, commit)."
    - "A set of outcomes per (test, commit): flaky when the set has both True and False."
    - |
      seen = defaultdict(set)
      for r in runs: seen[(r["test"], r["commit"])].add(r["passed"])
      return sorted({test for (test, _), outcomes in seen.items() if len(outcomes) == 2})
  solution:
    code: |
      from collections import defaultdict

      def flaky_tests(runs: list[dict]) -> list[str]:
          outcomes: dict[tuple[str, str], set[bool]] = defaultdict(set)
          for run in runs:
              outcomes[(run["test"], run["commit"])].add(run["passed"])
          return sorted({test for (test, _), seen in outcomes.items() if len(seen) == 2})
    explanation: The same code producing different results is the definition of flakiness; grouping by commit rules out real regressions.
    time: O(n + f log f)
    space: O(n)
    alternatives: ["Track pass and fail counts per key and check both are positive"]
    edge_cases: ["A test that fails on one commit and passes on another is not flaky", "A test listed in the result once even if flaky on many commits"]
    production: ["Quarantine flaky tests automatically but keep reporting them", "Record the runner and environment too — flakiness is often infrastructure"]
  examples:
    - args: [[{ commit: "c1", test: "t_login", passed: true }, { commit: "c1", test: "t_login", passed: false }, { commit: "c1", test: "t_api", passed: false }, { commit: "c2", test: "t_api", passed: true }]]
      expected: ["t_login"]
  hidden:
    - { args: [[]] }
    - { args: [[{ commit: "a", test: "z", passed: false }, { commit: "a", test: "z", passed: true }, { commit: "b", test: "y", passed: true }, { commit: "b", test: "y", passed: false }, { commit: "b", test: "z", passed: true }]] }

- slug: parse-aws-arn
  title: Parse an AWS ARN
  difficulty: easy
  roles: [aws-engineer, cloud-engineer, security-engineer]
  topics: [aws, parsing, strings]
  minutes: 10
  entrypoint: parse_arn
  description: |
    An ARN has the form `arn:partition:service:region:account-id:resource`. The resource part may itself
    contain colons or slashes (e.g. `function:my-fn:prod` or `role/admin`).

    Return a dictionary with keys `partition`, `service`, `region`, `account`, `resource`. Return `None` if
    the string doesn't start with `arn:` or has fewer than six parts.
  io: { input: "arn: str", output: "dict | None" }
  starter: |
    def parse_arn(arn: str):
        return None
  hints:
    - "Only the first five colons are separators."
    - "str.split(':', 5) splits at most five times, leaving the resource intact."
    - |
      parts = arn.split(":", 5)
      if len(parts) != 6 or parts[0] != "arn": return None
      return dict(zip(["partition", "service", "region", "account", "resource"], parts[1:]))
  solution:
    code: |
      FIELDS = ("partition", "service", "region", "account", "resource")

      def parse_arn(arn: str):
          parts = arn.split(":", 5)
          if len(parts) != 6 or parts[0] != "arn":
              return None
          return dict(zip(FIELDS, parts[1:]))
    explanation: maxsplit keeps colons inside the resource; global services (IAM, S3) simply have empty region or account fields.
    time: O(n)
    space: O(n)
    alternatives: ["A regex with five non-greedy groups and a final catch-all"]
    edge_cases: ["Empty region and account (S3 bucket ARNs)", "Resource containing ':'", "Not an ARN"]
    production: ["Validate the partition (aws, aws-cn, aws-us-gov) before using the ARN in policies"]
  examples:
    - { args: ["arn:aws:lambda:eu-west-1:123456789012:function:my-fn:prod"], expected: { partition: "aws", service: "lambda", region: "eu-west-1", account: "123456789012", resource: "function:my-fn:prod" } }
    - { args: ["arn:aws:s3:::my-bucket/logs/*"], expected: { partition: "aws", service: "s3", region: "", account: "", resource: "my-bucket/logs/*" } }
  hidden:
    - { args: ["arn:aws:iam::123456789012:role/admin"] }
    - { args: ["urn:aws:x:y:z:w"] }
    - { args: ["arn:aws:s3"] }

- slug: s3-prefix-sizes
  title: Size S3 prefixes
  difficulty: easy
  roles: [aws-engineer, cloud-engineer, data-engineer]
  topics: [aws, dictionaries, strings]
  minutes: 10
  entrypoint: prefix_sizes
  description: |
    `list_objects_v2` returns objects as `{"Key": ..., "Size": ...}`. Sum sizes by the first `depth` path
    segments of the key (segments are separated by `/`). An object with fewer segments is grouped by its
    folder (all segments but the file name); objects at the bucket root are grouped under `""`.
    Prefixes in the output end with `/` (except the root `""`).
  io: { input: "objects: list[dict], depth: int", output: "dict[str, int]" }
  starter: |
    def prefix_sizes(objects: list[dict], depth: int) -> dict[str, int]:
        return {}
  hints:
    - "The file name (last segment) never belongs to a prefix."
    - "folders = key.split('/')[:-1]; keep at most depth of them."
    - |
      parts = key.split("/")[:-1][:depth]
      prefix = "/".join(parts) + "/" if parts else ""
      totals[prefix] += size
  solution:
    code: |
      from collections import defaultdict

      def prefix_sizes(objects: list[dict], depth: int) -> dict[str, int]:
          totals: dict[str, int] = defaultdict(int)
          for obj in objects:
              folders = obj["Key"].split("/")[:-1][:depth]
              totals["/".join(folders) + "/" if folders else ""] += obj["Size"]
          return dict(totals)
    explanation: Dropping the last segment removes the file name; slicing to depth groups deeper objects under their ancestor.
    time: O(total key length)
    space: O(p) for p prefixes
    alternatives: ["Use Delimiter='/' in list_objects_v2 to let S3 group prefixes (one level at a time)"]
    edge_cases: ["Keys ending in '/' (folder markers) have an empty file name", "Root objects", "depth larger than the key depth"]
    production: ["S3 Storage Lens or Inventory reports are cheaper than listing billions of objects"]
  examples:
    - { args: [[{ Key: "logs/2026/11/a.gz", Size: 10 }, { Key: "logs/2026/10/b.gz", Size: 5 }, { Key: "img/x.png", Size: 7 }, { Key: "readme.txt", Size: 1 }], 2], expected: { "logs/2026/": 15, "img/": 7, "": 1 } }
  hidden:
    - { args: [[], 1] }
    - { args: [[{ Key: "a/b/", Size: 0 }, { Key: "a/b/c", Size: 3 }], 5] }

- slug: kubernetes-resource-totals
  title: Total Kubernetes resource requests
  difficulty: easy
  roles: [kubernetes-engineer, platform-engineer, site-reliability-engineer]
  topics: [kubernetes, parsing]
  minutes: 15
  entrypoint: total_requests
  description: |
    Given a list of containers, each `{"cpu": str, "memory": str}` (Kubernetes quantities), return
    `{"cpu_millicores": int, "memory_bytes": int}` with the totals.

    CPU: `"250m"` is 250 millicores, `"2"` or `"0.5"` are cores (× 1000).
    Memory: plain bytes `"1000"`, binary suffixes `Ki Mi Gi Ti` (powers of 1024) and decimal suffixes
    `k M G T` (powers of 1000). Round CPU to the nearest millicore.
  io: { input: "containers: list[dict]", output: "dict[str, int]" }
  starter: |
    def total_requests(containers: list[dict]) -> dict[str, int]:
        return {"cpu_millicores": 0, "memory_bytes": 0}
  hints:
    - "Write one parser per resource type and keep a table of suffix multipliers."
    - "Check the two-letter suffixes (Ki, Mi…) before the one-letter ones (k, M…)."
    - |
      def cpu(q): return int(q[:-1]) if q.endswith("m") else round(float(q) * 1000)
      def mem(q): for suffix, mult in SUFFIXES (longest first): if q.endswith(suffix): return int(float(q[:-len(suffix)]) * mult); return int(q)
  solution:
    code: |
      MEMORY = [("Ki", 1024), ("Mi", 1024**2), ("Gi", 1024**3), ("Ti", 1024**4), ("k", 1000), ("M", 1000**2), ("G", 1000**3), ("T", 1000**4)]

      def cpu_millicores(q: str) -> int:
          return int(q[:-1]) if q.endswith("m") else round(float(q) * 1000)

      def memory_bytes(q: str) -> int:
          for suffix, multiplier in MEMORY:
              if q.endswith(suffix):
                  return int(float(q[: -len(suffix)]) * multiplier)
          return int(q)

      def total_requests(containers: list[dict]) -> dict[str, int]:
          return {
              "cpu_millicores": sum(cpu_millicores(c["cpu"]) for c in containers),
              "memory_bytes": sum(memory_bytes(c["memory"]) for c in containers),
          }
    explanation: Ordering the suffix table so two-letter suffixes are checked first prevents "Mi" from being read as "M" plus garbage.
    time: O(n)
    space: O(1)
    alternatives: ["A regex ^([0-9.]+)([A-Za-z]*)$ and a dict lookup on the suffix"]
    edge_cases: ["Fractional cores like 0.1", "Decimal vs binary units ('1G' vs '1Gi')", "No containers"]
    production: ["The kubernetes client has utils.parse_quantity, which handles every suffix including exponents"]
  examples:
    - { args: [[{ cpu: "250m", memory: "128Mi" }, { cpu: "0.5", memory: "1G" }]], expected: { cpu_millicores: 750, memory_bytes: 1134217728 } }
  hidden:
    - { args: [[]] }
    - { args: [[{ cpu: "2", memory: "1000" }, { cpu: "1m", memory: "1Ki" }, { cpu: "0.1", memory: "2k" }]] }
    - { args: [[{ cpu: "1500m", memory: "1.5Gi" }]] }

- slug: simple-tokenizer
  title: Tokenise text for an LLM pipeline
  difficulty: easy
  roles: [genai-engineer, ai-engineer, machine-learning-engineer]
  topics: [llm-integration, strings, regex]
  minutes: 10
  entrypoint: tokenize
  description: |
    Before counting tokens precisely, a pipeline uses a rough tokenizer: lowercase the text, then emit
    every run of letters/digits as one token and every other non-space character as its own token.
    Whitespace separates tokens and is not emitted.

    Example: `"Hello, world!!"` → `["hello", ",", "world", "!", "!"]`.
  io: { input: "text: str", output: "list[str]" }
  starter: |
    def tokenize(text: str) -> list[str]:
        return text.split()
  hints:
    - "Two kinds of tokens: word runs and single punctuation characters."
    - "One regex with alternation: [a-z0-9]+ or any single non-space, non-word character."
    - "return re.findall(r'[a-z0-9]+|[^\\sa-z0-9]', text.lower())"
  solution:
    code: |
      import re

      TOKEN = re.compile(r"[a-z0-9]+|[^\sa-z0-9]")

      def tokenize(text: str) -> list[str]:
          return TOKEN.findall(text.lower())
    explanation: The regex engine tries the word alternative first, so letters and digits group together; anything else non-space is matched one character at a time.
    time: O(n)
    space: O(n)
    alternatives: ["A manual character loop with a buffer for the current word"]
    edge_cases: ["Empty text", "Underscores and accented letters count as punctuation here", "Only whitespace"]
    production: ["Use the model's real tokenizer (tiktoken, SentencePiece) for billing and context limits — rough counts can be off by 30% or more"]
  examples:
    - { args: ["Hello, world!!"], expected: ["hello", ",", "world", "!", "!"] }
  hidden:
    - { args: [""] }
    - { args: ["GPU-2 costs $3.50/hr"] }
    - { args: ["   \n\t "] }

- slug: cosine-similarity
  title: Cosine similarity of embeddings
  difficulty: easy
  roles: [ai-engineer, genai-engineer, machine-learning-engineer]
  topics: [vectors, functions]
  minutes: 8
  entrypoint: cosine
  comparator: float
  description: |
    Return the cosine similarity of two equal-length vectors, rounded to six decimals: the dot product divided
    by the product of the vectors' lengths (L2 norms). If either vector has length zero, return `0.0`.
  io: { input: "a: list[float], b: list[float]", output: "float" }
  starter: |
    def cosine(a: list[float], b: list[float]) -> float:
        return 0.0
  hints:
    - "You need three sums: a·b, a·a and b·b."
    - "zip(a, b) pairs up components; math.sqrt for the norms; guard the zero case."
    - |
      dot = sum(x * y for x, y in zip(a, b))
      na = sqrt(sum(x * x for x in a)); nb = ...
      return 0.0 if na == 0 or nb == 0 else round(dot / (na * nb), 6)
  solution:
    code: |
      import math

      def cosine(a: list[float], b: list[float]) -> float:
          dot = sum(x * y for x, y in zip(a, b))
          norm_a = math.sqrt(sum(x * x for x in a))
          norm_b = math.sqrt(sum(y * y for y in b))
          if norm_a == 0 or norm_b == 0:
              return 0.0
          return round(dot / (norm_a * norm_b), 6)
    explanation: Cosine measures the angle between vectors and ignores their length, which is why it is popular for comparing embeddings.
    time: O(d)
    space: O(1)
    alternatives: ["math.hypot(*a) for the norm", "numpy: a @ b / (norm(a) * norm(b))"]
    edge_cases: ["Zero vector", "Opposite vectors give -1", "Identical direction gives 1"]
    production: ["Normalise embeddings once at write time so similarity becomes a dot product", "Vector databases do this at scale with approximate indexes (HNSW)"]
  examples:
    - { args: [[1, 0], [0, 1]], expected: 0.0 }
    - { args: [[1, 2, 3], [2, 4, 6]], expected: 1.0 }
  hidden:
    - { args: [[0, 0], [1, 1]] }
    - { args: [[1, -1], [-1, 1]] }
    - { args: [[0.3, 0.1, 0.9], [0.2, 0.8, 0.4]] }

- slug: render-prompt-template
  title: Render a prompt template
  difficulty: easy
  roles: [genai-engineer, ai-engineer, forward-deployed-engineer]
  topics: [llm-integration, strings, regex]
  minutes: 12
  entrypoint: render
  description: |
    Prompt templates use `{{ name }}` placeholders (spaces inside the braces are optional). Replace each
    placeholder with `str(values[name])`. Placeholders whose name is missing from `values` are left
    unchanged, and their names are reported.

    Return `[rendered_text, sorted_list_of_missing_names]` (each missing name once).
  io: { input: "template: str, values: dict", output: "[str, list[str]]" }
  starter: |
    def render(template: str, values: dict) -> list:
        return [template, []]
  hints:
    - "A regex with a replacement function lets you decide per match."
    - "re.sub(pattern, repl, text) calls repl(match) for each placeholder; return match.group(0) to leave it."
    - |
      PATTERN = re.compile(r"\{\{\s*([A-Za-z_][A-Za-z0-9_]*)\s*\}\}")
      def repl(m): name = m.group(1); if name in values: return str(values[name]); missing.add(name); return m.group(0)
  solution:
    code: |
      import re

      PLACEHOLDER = re.compile(r"\{\{\s*([A-Za-z_][A-Za-z0-9_]*)\s*\}\}")

      def render(template: str, values: dict) -> list:
          missing: set[str] = set()

          def replace(match: re.Match) -> str:
              name = match.group(1)
              if name in values:
                  return str(values[name])
              missing.add(name)
              return match.group(0)

          return [PLACEHOLDER.sub(replace, template), sorted(missing)]
    explanation: Rendering in a single regex pass means a value that itself contains '{{x}}' is not expanded again — no template injection.
    time: O(n)
    space: O(n)
    alternatives: ["string.Template with safe_substitute (uses $name syntax)", "Jinja2 with StrictUndefined"]
    edge_cases: ["Values containing braces are inserted literally", "Same missing name twice is reported once", "Non-string values are converted with str()"]
    production: ["Fail closed: refuse to send a prompt with missing variables", "Version templates and log the version with each model call"]
  examples:
    - { args: ["Summarise {{ doc }} for {{audience}}. {{ tone }}", { doc: "the RFC", audience: "SREs" }], expected: ["Summarise the RFC for SREs. {{ tone }}", ["tone"]] }
  hidden:
    - { args: ["{{a}}{{a}}{{ b }}", { a: "{{b}}" }] }
    - { args: ["no placeholders", {}] }
    - { args: ["{{ n }} items", { n: 3 }] }

- slug: paginate-api
  title: Collect every page from an API
  difficulty: easy
  roles: [backend-engineer, forward-deployed-engineer, automation-engineer, cloud-engineer]
  topics: [pagination, http-apis]
  minutes: 12
  entrypoint: fetch_all
  description: |
    You get an API client with one method, `client.list_items(page_token=None)`. It returns a dictionary
    `{"items": [...], "next_page_token": str | None}`. Call it until there is no next token and return all
    items in order.

    The client is provided by the test harness (it records your calls). Don't call it more often than needed.
  io: { input: "client — has list_items(page_token=None) -> dict", output: "list" }
  prelude: |
    class FakeClient:
        """Serves pre-defined pages. Records every call so the harness can check you don't over-fetch."""
        def __init__(self, pages):
            self._pages = pages
            self.calls = []

        def list_items(self, page_token=None):
            self.calls.append(page_token)
            index = 0 if page_token is None else int(page_token.removeprefix("p"))
            if index >= len(self._pages):
                raise ValueError(f"invalid page token {page_token!r}")
            nxt = f"p{index + 1}" if index + 1 < len(self._pages) else None
            return {"items": list(self._pages[index]), "next_page_token": nxt}

    def __harness__(fn, pages):
        client = FakeClient(pages)
        return {"items": fn(client), "calls": len(client.calls)}
  starter: |
    def fetch_all(client) -> list:
        return client.list_items()["items"]
  hints:
    - "Loop until the response says there is nothing more."
    - "Start with token = None; after each call, extend your list and set token = response['next_page_token']."
    - |
      items, token = [], None
      while True:
          page = client.list_items(page_token=token); items.extend(page["items"])
          token = page["next_page_token"]; if not token: break
  solution:
    code: |
      def fetch_all(client) -> list:
          items: list = []
          token = None
          while True:
              page = client.list_items(page_token=token)
              items.extend(page["items"])
              token = page.get("next_page_token")
              if not token:
                  return items
    explanation: The loop always makes the first call, then follows tokens until the server stops sending one — exactly one call per page.
    time: O(total items)
    space: O(total items)
    alternatives: ["A generator that yields items page by page (better for very large result sets)", "boto3 paginators for AWS APIs"]
    edge_cases: ["A single page", "Empty pages in the middle still have a next token"]
    production: ["Add a maximum page count to stop runaway loops when a server repeats tokens", "Retry transient errors per page, not the whole listing"]
  examples:
    - { args: [[[1, 2], [3], [4, 5]]], expected: { items: [1, 2, 3, 4, 5], calls: 3 } }
  hidden:
    - { args: [[[]]] }
    - { args: [[[1], [], [2]]] }
    - { args: [[["a", "b", "c"]]] }

- slug: mask-secrets
  title: Mask secrets in nested config
  difficulty: easy
  roles: [security-engineer, devops-engineer, backend-engineer]
  topics: [security, dictionaries]
  minutes: 12
  entrypoint: mask
  description: |
    Before logging a configuration, replace the value of every key whose name contains `password`, `secret`,
    `token` or `key` (case-insensitive) with `"***"`. The structure can nest dictionaries and lists to any
    depth; mask at every level. A masked key's value is replaced entirely, even if it is a dictionary.
    Return a new structure; don't modify the input.
  io: { input: "data: dict | list | scalar", output: "same shape with secrets masked" }
  starter: |
    def mask(data):
        return data
  hints:
    - "The data is a tree: handle dicts, lists and plain values separately."
    - "Write a recursive function. For dicts, decide per key whether to mask or recurse."
    - |
      if isinstance(data, dict): return {k: "***" if is_secret(k) else mask(v) for k, v in data.items()}
      if isinstance(data, list): return [mask(v) for v in data]
      return data
  solution:
    code: |
      SENSITIVE = ("password", "secret", "token", "key")

      def is_secret(name) -> bool:
          lowered = str(name).lower()
          return any(word in lowered for word in SENSITIVE)

      def mask(data):
          if isinstance(data, dict):
              return {k: "***" if is_secret(k) else mask(v) for k, v in data.items()}
          if isinstance(data, list):
              return [mask(v) for v in data]
          return data
    explanation: Recursion follows the shape of the data. Building new containers instead of mutating keeps the caller's config intact.
    time: O(n) over all nodes
    space: O(n) for the copy, O(depth) recursion
    alternatives: ["An explicit stack instead of recursion for very deep data"]
    edge_cases: ["'monkey' contains 'key' and is masked — over-masking is the safe failure", "Secrets inside lists of dicts", "Non-string keys"]
    production: ["Mask at the logging layer (a logging.Filter) so nobody forgets", "Also scan values for secret patterns, not just key names"]
  examples:
    - args: [{ db: { host: "h", Password: "p" }, apiKey: "k", users: [{ name: "a", token: "t" }] }]
      expected: { db: { host: "h", Password: "***" }, apiKey: "***", users: [{ name: "a", token: "***" }] }
  hidden:
    - { args: [[1, "two", { secret_config: { nested: 1 } }]] }
    - { args: ["plain"] }
    - { args: [{ monkey: "banana", regular: [[{ TOKEN: 1 }]] }] }

- slug: iam-allowed-actions
  title: List actions an IAM policy allows
  difficulty: easy
  roles: [aws-engineer, security-engineer, cloud-engineer]
  topics: [iam, aws, json]
  minutes: 12
  entrypoint: allowed_actions
  description: |
    Given an IAM policy document (as a dictionary), return the sorted list of distinct actions in statements
    whose `Effect` is `"Allow"`. `Statement` may be a single object or a list; `Action` may be a string or a
    list. Ignore statements with `NotAction`. Action names compare case-insensitively: return them
    lowercased.
  io: { input: "policy: dict", output: "list[str]" }
  starter: |
    def allowed_actions(policy: dict) -> list[str]:
        return []
  hints:
    - "Normalise 'one or many' fields to lists before looping."
    - "A tiny helper as_list(x) returns x if it is a list, else [x]."
    - |
      for st in as_list(policy.get("Statement", [])):
          if st.get("Effect") == "Allow" and "Action" in st: actions.update(a.lower() for a in as_list(st["Action"]))
  solution:
    code: |
      def as_list(value) -> list:
          return value if isinstance(value, list) else [value]

      def allowed_actions(policy: dict) -> list[str]:
          actions: set[str] = set()
          for statement in as_list(policy.get("Statement", [])):
              if statement.get("Effect") == "Allow" and "Action" in statement:
                  actions.update(a.lower() for a in as_list(statement["Action"]))
          return sorted(actions)
    explanation: AWS allows scalars where lists are expected; normalising up front keeps the main loop simple.
    time: O(n log n)
    space: O(n)
    alternatives: ["policyuniverse or parliament for full policy analysis"]
    edge_cases: ["Single statement object", "Deny statements are ignored", "Wildcards like 's3:*' are kept as-is"]
    production: ["Deny always wins over Allow — listing allowed actions is not the same as computing effective permissions", "Flag '*' and 'iam:PassRole' for review"]
  examples:
    - args: [{ Version: "2012-10-17", Statement: [{ Effect: "Allow", Action: ["s3:GetObject", "S3:getobject", "s3:ListBucket"] }, { Effect: "Deny", Action: "s3:DeleteObject" }, { Effect: "Allow", Action: "ec2:Describe*" }] }]
      expected: ["ec2:describe*", "s3:getobject", "s3:listbucket"]
  hidden:
    - { args: [{ Statement: { Effect: "Allow", Action: "*" } }] }
    - { args: [{ Statement: [{ Effect: "Allow", NotAction: "iam:*" }] }] }
    - { args: [{}] }

- slug: histogram-buckets
  title: Cumulative histogram buckets
  difficulty: easy
  roles: [site-reliability-engineer, mlops-engineer, backend-engineer]
  topics: [monitoring, statistics]
  minutes: 10
  entrypoint: histogram
  description: |
    Prometheus histograms are cumulative: the bucket `le="0.5"` counts observations less than or equal to
    0.5, including those in smaller buckets. Given observations and sorted upper bounds, return a list of
    `[bound, count]` pairs, followed by `["+Inf", total_count]`.
  io: { input: "values: list[float], bounds: list[float] (ascending)", output: "list[list]" }
  starter: |
    def histogram(values: list[float], bounds: list[float]) -> list[list]:
        return [[b, 0] for b in bounds] + [["+Inf", len(values)]]
  hints:
    - "Each bucket counts every value <= its bound."
    - "Sort the values once; bisect_right(sorted_values, bound) is the number of values <= bound."
    - "s = sorted(values); return [[b, bisect_right(s, b)] for b in bounds] + [['+Inf', len(values)]]"
  solution:
    code: |
      from bisect import bisect_right

      def histogram(values: list[float], bounds: list[float]) -> list[list]:
          ordered = sorted(values)
          return [[bound, bisect_right(ordered, bound)] for bound in bounds] + [["+Inf", len(values)]]
    explanation: After sorting, the count of values up to a bound is the insertion point to its right — O(log n) per bucket.
    time: O(n log n + b log n)
    space: O(n)
    alternatives: ["Count per bucket (non-cumulative) in one pass and then take a running sum: O(n·b) or O(n log b)"]
    edge_cases: ["Values exactly on a bound are included", "No values", "Values above every bound only appear in +Inf"]
    production: ["Choose bounds around your SLO threshold — quantile estimates are only as precise as the buckets"]
  examples:
    - { args: [[0.1, 0.4, 0.5, 2.0, 0.05], [0.1, 0.5, 1.0]], expected: [[0.1, 2], [0.5, 4], [1.0, 4], ["+Inf", 5]] }
  hidden:
    - { args: [[], [1, 2]] }
    - { args: [[5, 6, 7], [1]] }

- slug: group-by-aggregate
  title: Group-by aggregation
  difficulty: easy
  roles: [data-engineer, forward-deployed-engineer, machine-learning-engineer]
  topics: [sql-patterns, etl, dictionaries]
  minutes: 12
  entrypoint: group_by
  comparator: float
  description: |
    Implement a tiny `GROUP BY`: given rows (dictionaries), a key column and a value column, return one row
    per key with `count`, `sum` and `avg` (rounded to two decimals) of the value column. Rows whose value is
    `None` are counted in `count` but excluded from `sum` and `avg` (like SQL). `avg` is `None` when no value
    is present. Return the groups sorted by key.
  io: { input: "rows: list[dict], key: str, value: str", output: "list[dict] with key, count, sum, avg" }
  starter: |
    def group_by(rows: list[dict], key: str, value: str) -> list[dict]:
        return []
  hints:
    - "Track three things per group: row count, sum of non-null values and number of non-null values."
    - "A dict of small lists [count, total, n] works; compute avg at the end."
    - |
      for r in rows: g = groups.setdefault(r[key], [0, 0, 0]); g[0] += 1; if r[value] is not None: g[1] += r[value]; g[2] += 1
      [{key: k, "count": c, "sum": s, "avg": round(s / n, 2) if n else None} for k, (c, s, n) in sorted(groups.items())]
  solution:
    code: |
      def group_by(rows: list[dict], key: str, value: str) -> list[dict]:
          groups: dict = {}
          for row in rows:
              g = groups.setdefault(row[key], [0, 0, 0])
              g[0] += 1
              v = row.get(value)
              if v is not None:
                  g[1] += v
                  g[2] += 1
          return [
              {key: k, "count": count, "sum": total, "avg": round(total / n, 2) if n else None}
              for k, (count, total, n) in sorted(groups.items())
          ]
    explanation: Keeping the non-null count separately reproduces SQL's semantics, where COUNT(*) counts rows but AVG ignores NULLs.
    time: O(n + g log g)
    space: O(g)
    alternatives: ["itertools.groupby after sorting by key", "pandas: df.groupby(key)[value].agg(['size', 'sum', 'mean'])"]
    edge_cases: ["All values None → sum 0 and avg None", "Single group", "No rows"]
    production: ["Push aggregation to the database when the data lives there — moving rows is the expensive part"]
  examples:
    - args: [[{ team: "b", ms: 10 }, { team: "a", ms: 4 }, { team: "b", ms: null }, { team: "b", ms: 20 }], "team", "ms"]
      expected: [{ team: "a", count: 1, sum: 4, avg: 4.0 }, { team: "b", count: 3, sum: 30, avg: 15.0 }]
  hidden:
    - { args: [[], "k", "v"] }
    - { args: [[{ k: "x", v: null }], "k", "v"] }
    - { args: [[{ k: 1, v: 1 }, { k: 1, v: 2 }, { k: 0, v: 0.5 }], "k", "v"] }
