name: deploy to minikube

# Applies the application manifests to the mk4 minikube cluster. The existing workflows are unchanged: they build
# images and restart Deployments on :latest (ci-jithendar-com.yml, ci-practice-executor.yml); this one handles
# changes to the manifests themselves.
#
# plan   → pull requests and pushes touching the manifests: render k8s/ and k8s/practice-executor/, keep the
#          objects CI may apply (scripts/ci-app-manifests.py), list the rest. No cluster access.
# deploy → default branch (push or manual run), only when repository variable MINIKUBE_DEPLOY is "true":
#          server-side dry run, diff, apply, wait for every Deployment and StatefulSet, smoke-test the site.
#
# CI applies only Deployments, StatefulSets, Services, ConfigMaps, Ingresses, NetworkPolicies,
# PodDisruptionBudgets, Traefik Middlewares and cert-manager Certificates in namespace jithendar. The Namespace,
# ClusterIssuers, TLSStore, RBAC, ServiceAccounts, Secrets, quotas, RuntimeClass and admission policies stay with a
# person (./deploy.sh, kubectl apply -k k8s/practice-executor), so a commit cannot widen CI's own access. Nothing
# is ever deleted (no --prune). k8s/db-access/ is not deployed by CI.
#
# Cluster access: ServiceAccount jithendar/github-ci-applier (k8s/85-ci-applier.yaml), kubeconfig template
# .github/jithendar-ci-applier.yaml, values MK4_API_SERVER, MK4_CA_DATA (variables, shared with the deployer) and
# MK4_CI_APPLY_TOKEN (secret), set by scripts/setup-ci-applier.sh, which also sets MINIKUBE_DEPLOY.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'k8s/**'
      - 'scripts/ci-app-manifests.py'
      - '.github/jithendar-ci-applier.yaml'
      - '.github/workflows/deploy-minikube.yml'
  push:
    paths:
      - 'k8s/**'
      - 'scripts/ci-app-manifests.py'
      - '.github/jithendar-ci-applier.yaml'
      - '.github/workflows/deploy-minikube.yml'

permissions:
  contents: read

# One deployment at a time, never cancelled half way.
concurrency:
  group: deploy-minikube-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pyyaml==6.0.3
      - name: Render and select application objects
        run: |
          set -euo pipefail
          for dir in k8s k8s/practice-executor; do
            echo "::group::$dir"
            kubectl kustomize "$dir" | python scripts/ci-app-manifests.py > /dev/null
            echo "::endgroup::"
          done

  deploy:
    needs: plan
    if: >-
      vars.MINIKUBE_DEPLOY == 'true' && github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-minikube-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pyyaml==6.0.3
      - name: Render application objects
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/rollouts.txt"
          for dir in k8s k8s/practice-executor; do
            name="${dir//\//-}"
            kubectl kustomize "$dir" | python scripts/ci-app-manifests.py --rollouts "$RUNNER_TEMP/$name.rollouts" > "$RUNNER_TEMP/$name.yaml"
            cat "$RUNNER_TEMP/$name.rollouts" >> "$RUNNER_TEMP/rollouts.txt"
          done
      - name: Apply to mk4
        env:
          MK4_API_SERVER: ${{ vars.MK4_API_SERVER }}
          MK4_CA_DATA: ${{ vars.MK4_CA_DATA }}
          MK4_CI_APPLY_TOKEN: ${{ secrets.MK4_CI_APPLY_TOKEN }}
        run: |
          set -euo pipefail
          for v in MK4_API_SERVER MK4_CA_DATA MK4_CI_APPLY_TOKEN; do
            [[ -n "${!v}" ]] || { echo "::error::$v is not set; run scripts/setup-ci-applier.sh"; exit 1; }
          done
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          (umask 077; perl -pe 's/\$\{(MK4_[A-Z_]+)\}/$ENV{$1}/g' .github/jithendar-ci-applier.yaml > "$KUBECONFIG")
          files=("$RUNNER_TEMP/k8s.yaml" "$RUNNER_TEMP/k8s-practice-executor.yaml")

          # Every object must pass the API server's validation and admission before anything changes.
          for f in "${files[@]}"; do kubectl apply --dry-run=server -f "$f" > /dev/null; done

          echo "::group::Changes"
          changed=0
          for f in "${files[@]}"; do
            rc=0; kubectl diff -f "$f" || rc=$?
            if [[ $rc -eq 1 ]]; then changed=1; elif [[ $rc -gt 1 ]]; then echo "::error::kubectl diff failed"; exit 1; fi
          done
          echo "::endgroup::"

          for f in "${files[@]}"; do kubectl apply -f "$f"; done

          failed=0
          while read -r workload; do
            [[ -n "$workload" ]] || continue
            if ! kubectl rollout status "$workload" --timeout=5m; then
              echo "::error::$workload did not become ready within 5 minutes"
              kubectl get pods -o wide | grep -E "^${workload#*/}" || true
              failed=1
            fi
          done < "$RUNNER_TEMP/rollouts.txt"
          [[ $failed -eq 0 ]] || exit 1

          {
            echo '### Applied to mk4'
            if [[ $changed -eq 1 ]]; then echo '- Changes applied (see the "Changes" group in the log).'; else echo '- No changes: the cluster already matched.'; fi
            echo "- Ready: $(paste -sd ' ' "$RUNNER_TEMP/rollouts.txt")"
            echo '- Not applied by CI: Namespace, ClusterIssuers, TLSStore, RBAC, ServiceAccounts, Secrets, quotas, RuntimeClass, admission policies.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        run: scripts/smoke.sh https://jithendar.com
