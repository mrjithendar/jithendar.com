name: content

# Ships jithendar.com's articles (content/) and images (public/images/) to the live site through its API. Nothing is
# built, no image is pushed and the cluster is never touched: the CMS (moks-cms) keeps articles in Postgres and serves
# /images/… from its storage (Cloudflare R2). site.json and config/ are not shipped here: they are ConfigMap
# jithendar-com-site (kubernetes/kustomization.yaml), applied by deploy-kubernetes.yml when their pull request is merged.
#
# On a push to master that changes those files (and on manual runs):
# 1. check: start the moks-cms image the Deployment runs with these files and request the main pages and every
#    published article (scripts/check-content.sh). An invalid article stops the run here, before anything is sent.
# 2. push (scripts/push-content.py):
#    only what this push added or changed:
#    - each added or changed article is sent as its file: a new one becomes a DRAFT in Admin → Posts, a post that is
#      still a draft is updated, a published post is left alone (edit and publish it in the admin);
#    - the images those articles use, and each added or changed file under public/images/, go to R2 (a file the site
#      already has with the same bytes is not sent again).
#    A manual run sends every article that is not a post yet (and the images they use), and changes no existing post.
#    Then you review the drafts in Admin → Posts and publish them yourself.
#    It needs the repository secret JITHENDAR_API_KEY (Admin → API keys, scopes images:write and posts:draft; such a
#    key cannot publish or delete).
#
# Harbor (secrets HARBOR_USERNAME, HARBOR_PASSWORD) is only for pulling the moks-cms image the check starts.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'content/**'
      - 'public/images/**'
      - 'scripts/push-content.py'
      - '.github/workflows/content.yml'

permissions:
  contents: read

concurrency:
  group: content
  cancel-in-progress: false

jobs:
  push:
    # arm64, like the moks-cms image the check starts.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      SITE_URL: https://jithendar.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$HARBOR_USERNAME" && -n "$HARBOR_PASSWORD" ]] || { echo "::error::Secrets HARBOR_USERNAME and HARBOR_PASSWORD must be set"; exit 1; }
          printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - name: Check the content with the CMS that will serve it
        run: scripts/check-content.sh
      - name: Push images and articles to the site
        env:
          JITHENDAR_API_KEY: ${{ secrets.JITHENDAR_API_KEY }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          [[ -n "$JITHENDAR_API_KEY" ]] || { echo "::error::Secret JITHENDAR_API_KEY is not set (Admin → API keys, scopes images:write and posts:draft)"; exit 1; }
          if [[ "$EVENT" == push && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # Added or modified articles and images of this push. Deleted files are not sent: the post or image stays
            # until an editor removes it.
            mapfile -t files < <(git diff --name-only --no-renames --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- 'content/blog/*.mdx' 'content/news/*.mdx' 'content/projects/*.mdx' 'public/images/**')
            if [[ ${#files[@]} -eq 0 ]]; then echo "No added or changed articles or images in this push."; exit 0; fi
            python3 scripts/push-content.py --site "$SITE_URL" "${files[@]}"
          else
            # Manual run, or a push whose range is unknown: every article that is not a post yet, and no existing post is changed.
            python3 scripts/push-content.py --site "$SITE_URL" --all-posts --create-only
          fi
