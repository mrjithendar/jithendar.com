name: practice-executor

# check   → pull requests and pushes touching the executor or the practice catalog: executor tests, then the
#           catalog build check (runs every reference solution through the sandbox runner and verifies the
#           committed catalog.generated.json is up to date)
# release → default branch: build the arm64 images and push them to Harbor as
#           registry.jithendar.com/jithendar/practice-executor:latest and practice-sandbox:latest (the only tags)
# deploy  → default branch, only when repository variable PRACTICE_EXECUTOR_DEPLOY is "true": restart the
#           executor Deployments so they pull :latest, and wait for the rollout. Everything runs :latest; sandbox
#           pods pull practice-sandbox:latest with imagePullPolicy Always.
#           It never applies manifests: namespaces, RuntimeClass, admission policy, RBAC and Secrets are applied
#           once by a person (www/docs/PYTHON_PRACTICE_EXECUTOR.md). Set the variable only after
#           scripts/verify-practice-sandbox.sh passes on mk4; until then the job is skipped.
#
# Registry: the release job logs in to Harbor with repository secrets HARBOR_USERNAME and HARBOR_PASSWORD. For deploy,
# the site's cluster credentials MK4_API_SERVER, MK4_CA_DATA and MK4_CI_TOKEN (scripts/setup-ci-deployer.sh).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'executor/**'
      - 'www/content/python-practice/**'
      - 'minikube/practice-executor-*.yaml'
      - 'scripts/manifests.sh'
      - '.github/workflows/ci-practice-executor.yml'
  push:
    paths:
      - 'executor/**'
      - 'www/content/python-practice/**'
      - '.github/workflows/ci-practice-executor.yml'

permissions:
  contents: read

concurrency:
  group: practice-executor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install test dependencies
        working-directory: executor
        run: pip install --quiet ".[test]" pyyaml==6.0.3
      - name: Executor tests
        working-directory: executor
        run: python -m pytest -q
      - name: Catalog is valid and up to date
        run: |
          python executor/tools/build_problems.py
          git diff --exit-code -- www/content/python-practice/catalog.generated.json || {
            echo "::error::catalog.generated.json is stale: run python executor/tools/build_problems.py and commit it"; exit 1; }
      - name: Render manifests
        run: scripts/manifests.sh practice-executor | python scripts/ci-app-manifests.py > /dev/null

  release:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      REGISTRY: registry.jithendar.com/jithendar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Harbor robot robot$jithendar+jithendar-com (push and pull in project jithendar only), set as these
      # repository secrets by the tools repository's deploy/minikube/harbor/registry.py ci-robots.
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - name: Build and push
        id: push
        working-directory: executor
        # One tag, latest: the cluster runs it with imagePullPolicy Always. A re-run builds and pushes again.
        run: |
          set -euo pipefail
          docker build --platform linux/arm64 --provenance=false -t "$REGISTRY/practice-executor:latest" .
          docker build --platform linux/arm64 --provenance=false --build-arg PYTHON_VERSION=3.13 -t "$REGISTRY/practice-sandbox:latest" sandbox
          # Smoke test the sandbox image: run one job through the real runner, offline.
          payload=$(python3 -c 'import base64,json; print(base64.b64encode(json.dumps({"nonce":"n","code":"def f(a):\n    return a*2\n","entrypoint":"f","tests":[{"id":"t0","args":[21]}],"limits":{"per_test_seconds":2,"total_seconds":5,"memory_mb":128,"output_bytes":1024}}).encode()).decode())')
          docker run --rm --network none --read-only --tmpfs /tmp -e JOB_PAYLOAD="$payload" "$REGISTRY/practice-sandbox:latest" | grep -q '"output": 42'
          docker push --quiet "$REGISTRY/practice-sandbox:latest"
          docker push --quiet "$REGISTRY/practice-executor:latest"
          {
            echo "- $REGISTRY/practice-executor:latest ($(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/practice-executor:latest"))"
            echo "- $REGISTRY/practice-sandbox:latest ($(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/practice-sandbox:latest"))"
            echo "- commit $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  # Signs in as ServiceAccount jithendar/github-ci-deployer (minikube/80-ci-deployer.yaml), the same one that restarts the
  # site: it may only restart the two executor Deployments here, cannot read Secrets or create pods, so it cannot
  # weaken the sandbox.
  # Roll back: revert the commit on the default branch (CI rebuilds and redeploys), or switch execution off in
  # Admin → Python practice → Settings (instant).
  deploy:
    needs: release
    if: vars.PRACTICE_EXECUTOR_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: practice-executor-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/jithendar-ci-deployer.yaml
          sparse-checkout-cone-mode: false
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      - name: Roll out to mk4
        env:
          MK4_API_SERVER: ${{ vars.MK4_API_SERVER }}
          MK4_CA_DATA: ${{ vars.MK4_CA_DATA }}
          MK4_CI_TOKEN: ${{ secrets.MK4_CI_TOKEN }}
        run: |
          set -euo pipefail
          for v in MK4_API_SERVER MK4_CA_DATA MK4_CI_TOKEN; do
            [[ -n "${!v}" ]] || { echo "::error::$v is not set (scripts/setup-ci-deployer.sh)"; exit 1; }
          done
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          (umask 077; perl -pe 's/\$\{(MK4_[A-Z_]+)\}/$ENV{$1}/g' .github/jithendar-ci-deployer.yaml > "$KUBECONFIG")
          k() { kubectl -n jithendar "$@"; }

          # Both Deployments and sandbox pods run :latest with imagePullPolicy Always, so a restart deploys the release.
          for d in practice-executor-api practice-dispatcher; do
            k rollout restart deploy/"$d"
          done
          for d in practice-executor-api practice-dispatcher; do
            if ! k rollout status deploy/"$d" --timeout=5m; then
              echo "::error::Rollout of $d did not finish within 5 minutes"
              k get pods -l app="$d" -o wide || true
              exit 1
            fi
          done
          {
            echo '### Deployed to mk4'
            echo "- practice-executor-api, practice-dispatcher restarted on \`practice-executor:latest\` ($GITHUB_SHA)"
            echo "- sandbox runtime python-3.13 → \`practice-sandbox:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
