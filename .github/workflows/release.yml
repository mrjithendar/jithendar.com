name: release

# Releases jithendar.com to the mk4 cluster. moks-cms (mrjithendar/moks-cms) only tests its code and pushes images;
# this repository holds the site (site.json, config/, content/, public/images/), pins the moks-cms images it runs
# (moks-cms.json) and deploys.
#
# plan     → what to release, from the commits since the last push (or the inputs of a manual run):
#            app      site.json, config/, Dockerfile*, the builder pin, the smoke/size scripts → job `app`
#            content  content/, public/images/, Dockerfile.content* → job `content`
#            services the seoAgent or practiceExecutor pin → job `services`
#            A repository_dispatch "moks-cms-released" {component, tag} (sent by moks-cms's release jobs,
#            scripts/notify-sites.sh there) first moves that pin in moks-cms.json and commits it to master as
#            github-actions[bot]; the rest of the run releases that commit. (A push made with the workflow's own token
#            starts no new run, so this run does it.)
# content  → validate the MDX (schema, internal links) and the practice catalog in the moks-cms-builder image, build
#            and push registry.jithendar.com/jithendar/jithendar-com-content:latest, then roll the site onto it,
#            unless readers would see nothing new: a push that only adds or edits drafts (status draft/review) and
#            adds images sends the new articles to Admin → Posts (push-post --create-only, secret
#            JITHENDAR_API_KEY) and leaves the pods alone.
# app      → build the site's app image on moks-cms-builder:<builder pin> (Dockerfile), check its size, smoke-test it,
#            push registry.jithendar.com/jithendar/jithendar-com:<builder pin>-<commit> and :latest, and roll the site
#            onto it (scripts/ci-rollout.py; --previous moves pods still on moks-cms's old app image).
# services → point the SEO agent / practice executor Deployments at their pinned tags, each only when its repository
#            variable SEO_AGENT_DEPLOY / PRACTICE_EXECUTOR_DEPLOY is "true".
#
# The first push of a branch, or a push whose range is unknown, releases nothing: run the workflow by hand
# (Actions → release → Run workflow). Roll back with `kubectl -n jithendar set image deploy/jithendar-com
# web=registry.jithendar.com/jithendar/jithendar-com:<earlier tag>`, or move the pin back in moks-cms.json.
#
# Cluster access: ServiceAccount jithendar/github-ci-deployer only (kubeconfig template .github/jithendar-ci-deployer.yaml,
# variables MK4_API_SERVER and MK4_CA_DATA, secret MK4_CI_TOKEN; scripts/setup-ci-deployer.sh). It never applies
# manifests: deploy-kubernetes.yml does. Harbor: secrets HARBOR_USERNAME and HARBOR_PASSWORD (pull moks-cms images,
# push jithendar-com and jithendar-com-content). Builds run on GitHub-hosted arm64 runners, never on mk4.

on:
  push:
    branches: [master]
  repository_dispatch:
    types: [moks-cms-released]
  workflow_dispatch:
    inputs:
      app:
        description: Build and roll out the app image
        type: boolean
        default: true
      content:
        description: Build and roll out the content image
        type: boolean
        default: true
      services:
        description: Roll the SEO agent and the practice executor onto their pinned tags
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, in order.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: registry.jithendar.com/jithendar

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Only used on repository_dispatch, to commit the moved pin.
      contents: write
    outputs:
      sha: ${{ steps.pin.outputs.sha || github.sha }}
      before: ${{ steps.plan.outputs.before }}
      app: ${{ steps.plan.outputs.app }}
      content: ${{ steps.plan.outputs.content }}
      seo_agent: ${{ steps.plan.outputs.seo_agent }}
      practice_executor: ${{ steps.plan.outputs.practice_executor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'repository_dispatch' }}
      - name: Move the pin (moks-cms released an image)
        id: pin
        if: github.event_name == 'repository_dispatch'
        env:
          COMPONENT: ${{ github.event.client_payload.component }}
          TAG: ${{ github.event.client_payload.tag }}
          REVISION: ${{ github.event.client_payload.revision }}
        run: |
          set -euo pipefail
          case "$COMPONENT" in
            builder) key=builder ;;
            seo-agent) key=seoAgent ;;
            practice-executor) key=practiceExecutor ;;
            *) echo "::error::Unknown component: $COMPONENT"; exit 1 ;;
          esac
          [[ "$TAG" =~ ^(pr|manual)-[0-9]+$ ]] || { echo "::error::Not a moks-cms release tag: $TAG"; exit 1; }
          git fetch --quiet origin master && git checkout --quiet -B master origin/master
          echo "before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$(jq -r --arg k "$key" '.[$k]' moks-cms.json)" == "$TAG" ]]; then
            echo "moks-cms.json already pins $key to $TAG"
          else
            jq --arg k "$key" --arg t "$TAG" '.[$k] = $t' moks-cms.json > moks-cms.json.new && mv moks-cms.json.new moks-cms.json
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "chore(moks-cms): $COMPONENT $TAG" -m "moks-cms commit ${REVISION:-unknown}" moks-cms.json
            git push --quiet origin HEAD:master
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: What to release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PIN_BEFORE: ${{ steps.pin.outputs.before }}
          IN_APP: ${{ inputs.app }}
          IN_CONTENT: ${{ inputs.content }}
          IN_SERVICES: ${{ inputs.services }}
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          app=false content=false seo=false executor=false before=""
          if [[ "$EVENT" == workflow_dispatch ]]; then
            app="$IN_APP" content="$IN_CONTENT" seo="$IN_SERVICES" executor="$IN_SERVICES"
          else
            before="$PIN_BEFORE"
            [[ "$EVENT" == push ]] && before="$PUSH_BEFORE"
            if [[ -z "$before" || "$before" =~ ^0+$ ]] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              echo "::notice::No known range to compare (first push?): nothing is released. Run the workflow by hand."
              before=""
            else
              while IFS= read -r f; do
                case "$f" in
                  content/*|public/images/*|Dockerfile.content|Dockerfile.content.dockerignore) content=true ;;
                  site.json) app=true content=true ;;
                  config/*|Dockerfile|Dockerfile.dockerignore|scripts/smoke-site-image.sh|scripts/image-size.sh|image-size-baseline.json) app=true ;;
                esac
              done < <(git diff --name-only "$before" "$head")
              pin() { git show "$1:moks-cms.json" 2>/dev/null | jq -r --arg k "$2" '.[$k] // ""'; }
              [[ "$(pin "$before" builder)" == "$(pin "$head" builder)" ]] || app=true
              [[ "$(pin "$before" seoAgent)" == "$(pin "$head" seoAgent)" ]] || seo=true
              [[ "$(pin "$before" practiceExecutor)" == "$(pin "$head" practiceExecutor)" ]] || executor=true
            fi
          fi
          {
            echo "before=$before"; echo "app=$app"; echo "content=$content"
            echo "seo_agent=$seo"; echo "practice_executor=$executor"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Release plan (commit \`${head:0:7}\`)"
            echo "- app: $app, content: $content, seo-agent: $seo, practice-executor: $executor"
            echo "- pins: $(jq -c . moks-cms.json)"
          } >> "$GITHUB_STEP_SUMMARY"

  content:
    needs: plan
    if: needs.plan.outputs.content == 'true'
    # The builder is linux/arm64 only.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      BEFORE: ${{ needs.plan.outputs.before }}
      IMAGE: registry.jithendar.com/jithendar/jithendar-com-content
      JITHENDAR_SITE_URL: https://jithendar.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.SHA }}
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$HARBOR_USERNAME" && -n "$HARBOR_PASSWORD" ]] || { echo "::error::Secrets HARBOR_USERNAME and HARBOR_PASSWORD must be set"; exit 1; }
          printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
          echo "BUILDER=$REGISTRY/moks-cms-builder:$(jq -er .builder moks-cms.json)" >> "$GITHUB_ENV"
      - name: Validate content and the practice catalog (moks-cms-builder)
        run: scripts/check-content.sh "$BUILDER"
      - name: Package image
        run: |
          docker build --platform linux/arm64 --provenance=false -f Dockerfile.content \
            --label "org.opencontainers.image.revision=$SHA" -t "$IMAGE:latest" .
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          out="$(mktemp -d)"; mkdir -p "$out/content" "$out/images"; chmod 777 "$out/content" "$out/images"
          docker run --rm -v "$out/content:/mnt/content" -v "$out/images:/mnt/images" "$IMAGE:latest"
          test -d "$out/content/blog" && test -d "$out/content/authors"
          [[ "$(find "$out/content" -name '*.mdx' | wc -l)" -eq "$(find content -name '*.mdx' | wc -l)" ]]
          [[ "$(find "$out/images" -type f | wc -l)" -eq "$(find public/images -type f | wc -l)" ]]
          echo "Copied $(find "$out/content" -name '*.mdx' | wc -l) MDX files and $(find "$out/images" -type f | wc -l) images"
      - name: Push
        run: docker push --quiet "$IMAGE:latest"
      # Restart only when readers would see a change: a published article added, edited or removed, an image
      # changed or removed, or anything else in content/. Only new or edited drafts plus new images: no restart.
      - name: Decide whether readers would see a change
        id: visible
        run: |
          set -euo pipefail
          published() { # exit 0 if <rev>:<path> exists and its frontmatter says status: published
            git show "$1:$2" 2>/dev/null | awk 'NR == 1 && $0 != "---" { exit } NR > 1 && $0 == "---" { exit }
              /^status:[[:space:]]*["'"'"']?published/ { found = 1 } END { exit !found }'
          }
          restart=true reason="manual run or unknown range"
          if [[ -n "$BEFORE" ]]; then
            restart=false reason="only unpublished articles and new images changed"
            while IFS=$'\t' read -r status path; do
              case "$path" in
                content/blog/*.mdx|content/news/*.mdx|content/projects/*.mdx)
                  if published "$BEFORE" "$path" || published "$SHA" "$path"; then restart=true reason="published: $path"; break; fi ;;
                public/images/*)
                  if [[ "$status" != A ]]; then restart=true reason="image changed: $path"; break; fi ;;
                *) restart=true reason="other change: $path"; break ;;
              esac
            done < <(git diff --name-status --no-renames "$BEFORE" "$SHA" -- content public/images Dockerfile.content Dockerfile.content.dockerignore site.json)
          fi
          echo "Restart: $restart ($reason)"
          { echo "restart=$restart"; echo "reason=$reason"; } >> "$GITHUB_OUTPUT"
      - name: Send new draft articles to Admin → Posts
        id: drafts
        if: steps.visible.outputs.restart == 'false'
        env:
          JITHENDAR_API_KEY: ${{ secrets.JITHENDAR_API_KEY }}
        run: |
          set -uo pipefail
          mapfile -t added < <(git diff --name-only --no-renames --diff-filter=A "$BEFORE" "$SHA" -- \
            'content/blog/*.mdx' 'content/news/*.mdx' 'content/projects/*.mdx')
          sent=0 waiting=0
          { echo '### New draft articles'; echo; } >> "$GITHUB_STEP_SUMMARY"
          if [[ ${#added[@]} -eq 0 ]]; then
            echo "No new articles in this push." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ -z "$JITHENDAR_API_KEY" ]]; then
            echo "::warning::Secret JITHENDAR_API_KEY is not set (Admin → API keys, scopes posts:read + posts:write): ${#added[@]} new article(s) wait for the next restart."
            printf -- "- \`%s\`: waits for the next restart (no JITHENDAR_API_KEY)\n" "${added[@]}" >> "$GITHUB_STEP_SUMMARY"
            waiting=${#added[@]}
          else
            for f in "${added[@]}"; do
              # push-post runs in the builder, with this repository mounted at /site.
              if out="$(docker run --rm -v "$PWD:/site:ro" -e JITHENDAR_API_KEY -e JITHENDAR_SITE_URL "$BUILDER" \
                    npm run --silent push-post -- "/site/$f" --create-only 2>&1)"; then
                echo "$out"
                echo "- \`$f\`: $(tail -1 <<<"$out" | sed 's/  */ /g')" >> "$GITHUB_STEP_SUMMARY"
                sent=$((sent + 1))
              else
                echo "$out"
                echo "::warning file=$f::Not sent to Admin → Posts; it is imported as a draft at the next restart. $(tail -1 <<<"$out")"
                echo "- \`$f\`: waits for the next restart ($(tail -1 <<<"$out"))" >> "$GITHUB_STEP_SUMMARY"
                waiting=$((waiting + 1))
              fi
            done
          fi
          { echo "sent=$sent"; echo "waiting=$waiting"; } >> "$GITHUB_OUTPUT"
          exit 0
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        if: steps.visible.outputs.restart == 'true' || steps.drafts.outputs.waiting > 0
        with:
          version: v1.35.0
      # Points the init container at :latest (moving it off moks-cms-content, the name before 2026-11-16), or restarts
      # the site when it is already there, so that imagePullPolicy Always pulls the image just pushed.
      - name: Roll out the content
        if: steps.visible.outputs.restart == 'true' || steps.drafts.outputs.waiting > 0
        env:
          MK4_API_SERVER: ${{ vars.MK4_API_SERVER }}
          MK4_CA_DATA: ${{ vars.MK4_CA_DATA }}
          MK4_CI_TOKEN: ${{ secrets.MK4_CI_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/lib/ci-kubeconfig.sh
          python3 scripts/ci-rollout.py "$IMAGE" latest --previous "$REGISTRY/moks-cms-content"
      - name: Record image
        env:
          RESTART: ${{ steps.visible.outputs.restart == 'true' || steps.drafts.outputs.waiting > 0 }}
          REASON: ${{ steps.visible.outputs.restart == 'true' && steps.visible.outputs.reason || 'new draft articles could not be sent to the posts API (images not live yet, or no API key)' }}
        run: |
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:latest")"
          {
            echo "### Content image"
            echo
            echo "- Tag: \`$IMAGE:latest\` (commit \`$SHA\`)"
            echo "- Digest: \`$digest\`"
            echo
            if [[ "$RESTART" == true ]]; then
              echo "Deployed: deploy/jithendar-com rolled out; its init container copied the new content ($REASON)"
            else
              echo "Not deployed: $REASON. The image is pushed; the next restart of jithendar-com picks it up."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  app:
    needs: [plan, content]
    # After `content` (when both run, the site restarts once more here and gets both), never after a failed one.
    if: >-
      !cancelled() && needs.plan.outputs.app == 'true' &&
      (needs.content.result == 'success' || needs.content.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      IMAGE: registry.jithendar.com/jithendar/jithendar-com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SHA }}
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$HARBOR_USERNAME" && -n "$HARBOR_PASSWORD" ]] || { echo "::error::Secrets HARBOR_USERNAME and HARBOR_PASSWORD must be set"; exit 1; }
          printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
          pin="$(jq -er .builder moks-cms.json)"
          # pr-111-1a2b3c4: the moks-cms release, then this repository's commit.
          { echo "BUILDER=$REGISTRY/moks-cms-builder:$pin"; echo "TAG=$pin-${SHA:0:7}"; } >> "$GITHUB_ENV"
      - name: Package image
        run: scripts/build-site-image.sh "$BUILDER" "$IMAGE:$TAG" "$SHA"
      # Before the push: an image that grew more than 15 % over the stored baseline stops here.
      - name: Image size (summary; fails above +15 % of the stored baseline)
        run: scripts/image-size.sh "$IMAGE:$TAG" image-size-baseline.json
      # Never push an image that cannot start or optimise images.
      - name: Smoke-test the image
        run: scripts/smoke-site-image.sh "$IMAGE:$TAG" "$SHA"
      - name: Push
        # Two tags for one image: <pin>-<commit> is this release's own tag and what the cluster will run; latest
        # names the newest release.
        run: |
          docker tag "$IMAGE:$TAG" "$IMAGE:latest"
          docker push --quiet "$IMAGE:$TAG"
          docker push --quiet "$IMAGE:latest"
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0
      # Every Deployment that runs this image is pointed at the tag just pushed and waited for. --previous: the app
      # image was moks-cms (and before 2026-11-14 jithendar-com) while the site lived in the moks-cms repository.
      - name: Roll out jithendar-com
        env:
          MK4_API_SERVER: ${{ vars.MK4_API_SERVER }}
          MK4_CA_DATA: ${{ vars.MK4_CA_DATA }}
          MK4_CI_TOKEN: ${{ secrets.MK4_CI_TOKEN }}
        run: |
          set -euo pipefail
          source scripts/lib/ci-kubeconfig.sh
          python3 scripts/ci-rollout.py "$IMAGE" "$TAG" --previous "$REGISTRY/moks-cms"
      - name: Record image
        run: |
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:latest")"
          {
            echo '### jithendar.com app image'
            echo
            echo "- Tags: \`$IMAGE:$TAG\` and \`:latest\` (commit \`$SHA\`, built on \`$BUILDER\`)"
            echo "- Digest: \`$digest\`"
            echo
            echo "Deployed as \`:$TAG\` (see the rollout above)"
          } >> "$GITHUB_STEP_SUMMARY"

  services:
    needs: plan
    if: needs.plan.outputs.seo_agent == 'true' || needs.plan.outputs.practice_executor == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHA: ${{ needs.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.SHA }}
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0
      # Sandbox pods keep pulling practice-sandbox:latest (imagePullPolicy Always): that name is in the executor's
      # ConfigMap, which the CI deployer may not change. The SEO agent's flow-trigger CronJobs keep running :latest.
      - name: Roll out the pinned tags
        env:
          SEO: ${{ needs.plan.outputs.seo_agent == 'true' && vars.SEO_AGENT_DEPLOY == 'true' }}
          EXECUTOR: ${{ needs.plan.outputs.practice_executor == 'true' && vars.PRACTICE_EXECUTOR_DEPLOY == 'true' }}
          MK4_API_SERVER: ${{ vars.MK4_API_SERVER }}
          MK4_CA_DATA: ${{ vars.MK4_CA_DATA }}
          MK4_CI_TOKEN: ${{ secrets.MK4_CI_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$SEO" != true && "$EXECUTOR" != true ]]; then
            echo "::notice::A pin moved, but its repository variable (SEO_AGENT_DEPLOY / PRACTICE_EXECUTOR_DEPLOY) is not \"true\": nothing rolled out."
            exit 0
          fi
          source scripts/lib/ci-kubeconfig.sh
          failed=0
          if [[ "$SEO" == true ]]; then
            python3 scripts/ci-rollout.py "$REGISTRY/seo-agent" "$(jq -er .seoAgent moks-cms.json)" || failed=1
          fi
          if [[ "$EXECUTOR" == true ]]; then
            python3 scripts/ci-rollout.py "$REGISTRY/practice-executor" "$(jq -er .practiceExecutor moks-cms.json)" || failed=1
          fi
          exit "$failed"
