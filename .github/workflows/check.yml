name: check

# Pull requests (and manual runs). Nothing here touches the cluster or pushes an image.
#
# content    → the articles, images, site.json and config/ served by the moks-cms image the Deployment runs
#              (kubernetes/30-jithendar-com.yaml): main pages and every published article must answer 200
#              (scripts/check-content.sh). It runs the :latest image the site runs.
# scripts    → no conflict copies, the kube-context guard and the release/deploy scripts against a stub kubectl,
#              the manifests' own tests (scripts/tests), shellcheck
# crewconfig → crewconfig/ (the CrewAI configuration): schemas, references, manifest, no credentials; and, when the
#              secret JITHENDAR_CREWAI_KEY is set, what the live site would change (a plan, nothing applied): a
#              configuration the site would refuse fails the check before it is merged
# The manifests are rendered and checked by deploy-kubernetes.yml (job `plan`).

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # The moks-cms image is linux/arm64 only.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$HARBOR_USERNAME" && -n "$HARBOR_PASSWORD" ]] || { echo "::error::Secrets HARBOR_USERNAME and HARBOR_PASSWORD must be set"; exit 1; }
          printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - name: Check the content with the CMS that will serve it
        run: scripts/check-content.sh

  scripts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No cloud-sync conflict copies
        run: scripts/check-conflict-copies.sh
      - name: Kube-context guard (stub kubectl)
        run: bash scripts/tests/kube-context.test.sh
      - name: Release and deploy scripts, manifests (stub kubectl)
        run: |
          pip install --quiet pyyaml==6.0.3 jsonschema==4.23.0
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: shellcheck
        run: >-
          shellcheck -x scripts/lib/kube-context.sh scripts/lib/ci-kubeconfig.sh scripts/tests/kube-context.test.sh
          scripts/check-conflict-copies.sh scripts/create-*.sh scripts/set-*.sh
          scripts/setup-ci-applier.sh scripts/setup-ci-deployer.sh scripts/check-content.sh

  crewconfig:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install --quiet pyyaml==6.0.3 jsonschema==4.23.0
      - name: Check crewconfig/
        run: python3 scripts/crewconfig.py check
      - name: What the site would change (plan only)
        env:
          JITHENDAR_CREWAI_KEY: ${{ secrets.JITHENDAR_CREWAI_KEY }}
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail
          if [[ -z "$JITHENDAR_CREWAI_KEY" ]]; then echo "No JITHENDAR_CREWAI_KEY: the site's plan is skipped."; exit 0; fi
          rc=0
          python3 scripts/crewconfig.py push --site https://jithendar.com --wait 30 --revision "$REVISION" || rc=$?
          # 2: the site could not be asked (down, or an older CMS): not this pull request's fault.
          if [[ $rc -eq 2 ]]; then echo "::warning::The site's plan could not be made; crewconfig/ itself passed the check."; exit 0; fi
          exit $rc
