name: check

# Pull requests (and manual runs). Nothing here touches the cluster or pushes an image.
#
# content    → the MDX schema, internal links and the practice catalog, checked by moks-cms's own tests in the
#              moks-cms-builder image this site is pinned to (moks-cms.json "builder"; scripts/check-content.sh)
# app        → only when the pull request changes what is compiled into the app (site.json, config/, Dockerfile*,
#              the builder pin): build the app image and smoke-test it, as release.yml does, without pushing
# dashboards → the Grafana dashboards in grafana/ (scripts/check-dashboards.py) and the one ConfigMap they render to
# scripts    → no conflict copies, the kube-context guard and the release/deploy scripts against a stub kubectl,
#              the manifests' own tests (scripts/tests), shellcheck
# The manifests are rendered and checked by deploy-kubernetes.yml (job `plan`).

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.files.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Does the pull request change the app image?
        id: files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          app=true
          if [[ -n "$BASE" ]]; then
            app=false
            while IFS= read -r f; do
              case "$f" in
                site.json|config/*|Dockerfile|Dockerfile.dockerignore|moks-cms.json|scripts/build-site-image.sh|scripts/smoke-site-image.sh) app=true ;;
              esac
            done < <(git diff --name-only "$BASE" "$GITHUB_SHA")
          fi
          echo "app=$app" | tee -a "$GITHUB_OUTPUT"

  content:
    needs: changes
    # The builder is linux/arm64 only.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$HARBOR_USERNAME" && -n "$HARBOR_PASSWORD" ]] || { echo "::error::Secrets HARBOR_USERNAME and HARBOR_PASSWORD must be set"; exit 1; }
          printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - name: Validate content and the practice catalog
        run: scripts/check-content.sh "registry.jithendar.com/jithendar/moks-cms-builder:$(jq -er .builder moks-cms.json)"

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$HARBOR_USERNAME" && -n "$HARBOR_PASSWORD" ]] || { echo "::error::Secrets HARBOR_USERNAME and HARBOR_PASSWORD must be set"; exit 1; }
          printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - name: Build the app image
        run: scripts/build-site-image.sh "registry.jithendar.com/jithendar/moks-cms-builder:$(jq -er .builder moks-cms.json)" jithendar-com:check "$GITHUB_SHA"
      - name: Image size (summary; fails above +15 % of the stored baseline)
        run: scripts/image-size.sh jithendar-com:check image-size-baseline.json
      - name: Smoke-test the image
        run: scripts/smoke-site-image.sh jithendar-com:check "$GITHUB_SHA"

  dashboards:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0
      - name: Check dashboards
        run: python3 scripts/check-dashboards.py
      - name: Render the ConfigMap
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/dashboards.yaml"
          kubectl kustomize grafana > "$out"
          [[ "$(grep -c '^kind: ConfigMap$' "$out")" -eq 1 ]] || { echo "::error::grafana/ must render exactly one ConfigMap"; exit 1; }
          size="$(wc -c < "$out")"
          echo "$(grep -m1 '^  name: ' "$out" | sed 's/^  name: //'): $size bytes (limit 1 MiB)"
          [[ "$size" -lt 1048576 ]] || { echo "::error::The dashboards exceed the 1 MiB ConfigMap limit"; exit 1; }

  scripts:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No cloud-sync conflict copies
        run: scripts/check-conflict-copies.sh
      - name: Kube-context guard (stub kubectl)
        run: bash scripts/tests/kube-context.test.sh
      - name: Release and deploy scripts, manifests (stub kubectl)
        run: |
          pip install --quiet pyyaml==6.0.3
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: shellcheck
        run: >-
          shellcheck -x scripts/lib/kube-context.sh scripts/lib/ci-kubeconfig.sh scripts/tests/kube-context.test.sh
          scripts/check-conflict-copies.sh scripts/image-size.sh scripts/create-*.sh scripts/set-*.sh
          scripts/setup-ci-applier.sh scripts/setup-ci-deployer.sh scripts/check-content.sh scripts/build-site-image.sh
          scripts/smoke-site-image.sh
