name: deploy to kubernetes

# Deploys the whole site from kubernetes/ to the mk4 cluster: the CMS (moks-cms) and the SEO agent. Every manifest
# names :latest with imagePullPolicy Always, so a deploy is "apply, then restart": a restarted Deployment pulls the
# newest :latest. The CMS rolls one pod at a time (maxSurge 1, maxUnavailable 0: no downtime); the SEO agent is one
# pod with strategy Recreate (its flow runs are in-process, two pods at once would fail each other's runs), so it is
# away for the few seconds its new pod takes to start. site.json and config/ are ConfigMap jithendar-com-site
# (kubernetes/kustomization.yaml), so a change to them is deployed here too and rolls the site. Articles and images
# never pass through here: content.yml pushes them through the site's API. The practice problems ship in
# practice-catalog (moks-tech/practice-programming, which also deploys the practice executor).
#
# When it deploys (only when repository variable MINIKUBE_DEPLOY is "true"):
#   release    → repository_dispatch "moks-cms-released" {component, tag}, sent by moks-cms's CI after it pushes
#                :latest (its scripts/notify-sites.sh): apply, restart that component (www → deployment/jithendar-com,
#                seo-agent → deployment/seo-agent). The SEO agent's CronJobs pull :latest at their next run.
#   manual run → Actions → deploy to kubernetes → Run workflow, on the default branch: apply, restart every
#                Deployment it applies (the CMS and the SEO agent).
#   merged PR  → a pull request touching the manifests merged into the default branch: the same as a manual run.
# A changed ConfigMap also restarts its group's Deployments. A Deployment is restarted only if it exists in namespace
# jithendar; a missing one is skipped with a warning.
# Each deploy: server-side dry run, diff, apply, restart, wait for every Deployment and StatefulSet, smoke-test the site.
# plan → pull requests touching the manifests (and every deploy): render the groups of kubernetes/
#        (scripts/manifests.sh), keep the objects CI applies (scripts/ci-app-manifests.py), list the rest. No cluster access.
# Rollback: moks-cms also pushes pr-<number>; `kubectl -n jithendar set image deployment/jithendar-com
# jithendar-com=registry.jithendar.com/jithendar/moks-cms:pr-<n>` runs an earlier release until the next deploy.
#
# What CI applies, all in namespace jithendar:
#   site               everything in kubernetes/kustomization.yaml except Secrets and cluster-wide RBAC: the
#                      Namespace jithendar itself, workloads, routing, ServiceAccounts, Roles and RoleBindings
#                      (including CI's own), quotas, PeerAuthentication and AuthorizationPolicy.
#                      Owner decision 2026-11-14 (moks-cms, services/www/docs/DEPLOYMENT.md): a merged pull request can
#                      therefore change what CI itself may do in the namespace.
#   seo-agent          application objects only; its CronJobs stay with a person
# Never applied by CI: Secrets, ClusterRoles and ClusterRoleBindings, ClusterIssuers, the RuntimeClass, admission
# policies, CronJobs. Nothing is ever deleted (no --prune).
#
# Cluster access: ServiceAccount jithendar/github-ci-applier (kubernetes/85-ci-applier.yaml), kubeconfig template
# .github/jithendar-ci-applier.yaml, values MK4_API_SERVER, MK4_CA_DATA (variables, shared with the deployer) and
# MK4_CI_APPLY_TOKEN (secret), set by scripts/setup-ci-applier.sh, which also sets MINIKUBE_DEPLOY. Run that script
# again whenever the ClusterRole in 85-ci-applier.yaml changes (CI cannot apply it).

on:
  repository_dispatch:
    types: [moks-cms-released]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'kubernetes/**'
      - 'site.json'
      - 'config/**'
      - 'scripts/manifests.sh'
      - 'scripts/ci-app-manifests.py'
      - '.github/jithendar-ci-applier.yaml'
      - '.github/workflows/deploy-kubernetes.yml'

permissions:
  contents: read

# One deployment at a time, never cancelled half way.
# Each moks-cms component's dispatches have their own group, so one release never replaces another waiting one.
concurrency:
  group: deploy-kubernetes-${{ github.event.client_payload.component || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && (github.event.action != 'closed' || github.event.pull_request.merged == true)))
    runs-on: mk4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A merged pull request is built from its merge commit on the default branch.
          ref: ${{ (github.event.action == 'closed' && github.event.pull_request.merge_commit_sha) || '' }}
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pyyaml==6.0.3
      - name: Render and select application objects
        run: |
          set -euo pipefail
          # The site group is applied in full (--all); the other two only as application objects.
          for group in site seo-agent; do
            echo "::group::$group"
            flags=(); [[ "$group" == site ]] && flags=(--all)
            scripts/manifests.sh "$group" | python scripts/ci-app-manifests.py "${flags[@]}" > /dev/null
            echo "::endgroup::"
          done

  deploy:
    needs: plan
    if: >-
      !cancelled() && needs.plan.result == 'success' && vars.MINIKUBE_DEPLOY == 'true' && (
        github.event_name == 'repository_dispatch' ||
        (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
        (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true &&
         github.event.pull_request.base.ref == github.event.repository.default_branch)
      )
    runs-on: mk4
    timeout-minutes: 20
    concurrency:
      group: deploy-kubernetes-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A merged pull request is built from its merge commit on the default branch.
          ref: ${{ (github.event.action == 'closed' && github.event.pull_request.merge_commit_sha) || '' }}
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --quiet pyyaml==6.0.3
      - name: Render the objects CI applies
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/rollouts.txt"
          # The site group is applied in full (--all); the other two only as application objects.
          for group in site seo-agent; do
            flags=(); [[ "$group" == site ]] && flags=(--all)
            scripts/manifests.sh "$group" | python scripts/ci-app-manifests.py "${flags[@]}" --rollouts "$RUNNER_TEMP/$group.rollouts" > "$RUNNER_TEMP/$group.yaml"
            cat "$RUNNER_TEMP/$group.rollouts" >> "$RUNNER_TEMP/rollouts.txt"
          done
      - name: Apply to mk4
        id: apply
        env:
          EVENT: ${{ github.event_name }}
          COMPONENT: ${{ github.event.client_payload.component }}
          MK4_API_SERVER: ${{ vars.MK4_API_SERVER }}
          MK4_CA_DATA: ${{ vars.MK4_CA_DATA }}
          MK4_CI_APPLY_TOKEN: ${{ secrets.MK4_CI_APPLY_TOKEN }}
        run: |
          set -euo pipefail
          for v in MK4_API_SERVER MK4_CA_DATA MK4_CI_APPLY_TOKEN; do
            [[ -n "${!v}" ]] || { echo "::error::$v is not set; run scripts/setup-ci-applier.sh"; exit 1; }
          done
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          (umask 077; perl -pe 's/\$\{(MK4_[A-Z_]+)\}/$ENV{$1}/g' .github/jithendar-ci-applier.yaml > "$KUBECONFIG")
          groups=(site seo-agent)

          # Every object must pass the API server's validation and admission before anything changes.
          for g in "${groups[@]}"; do
            if ! kubectl apply --dry-run=server -f "$RUNNER_TEMP/$g.yaml" > /dev/null; then
              echo "::error::Server dry run of group $g failed. If the message says \"forbidden\", the cluster still has an older github-ci-applier Role: run scripts/setup-ci-applier.sh once (it applies kubernetes/85-ci-applier.yaml), then re-run this workflow."
              exit 1
            fi
          done

          echo "::group::Changes"
          changed=0
          for g in "${groups[@]}"; do
            rc=0; kubectl diff -f "$RUNNER_TEMP/$g.yaml" > "$RUNNER_TEMP/$g.diff" || rc=$?
            cat "$RUNNER_TEMP/$g.diff"
            if [[ $rc -eq 1 ]]; then changed=1; elif [[ $rc -gt 1 ]]; then echo "::error::kubectl diff failed for group $g"; exit 1; fi
          done
          echo "::endgroup::"

          for g in "${groups[@]}"; do kubectl apply -f "$RUNNER_TEMP/$g.yaml"; done

          # A restart pulls the newest :latest (imagePullPolicy Always). A manual run or a merged pull request
          # restarts every Deployment it applies; a release only the component that was released.
          ns=jithendar
          case "$EVENT:$COMPONENT" in
            repository_dispatch:www) wanted=(deployment/jithendar-com) ;;
            repository_dispatch:seo-agent) wanted=(deployment/seo-agent) ;;
            repository_dispatch:*) echo "::error::Unknown component: $COMPONENT"; exit 1 ;;
            *) mapfile -t wanted < <(grep '^deployment/' "$RUNNER_TEMP/rollouts.txt" || true) ;;
          esac
          # Pods read a ConfigMap only when they start (envFrom), so a changed ConfigMap also restarts its group's
          # Deployments; otherwise the new values would wait for the next image release.
          for g in "${groups[@]}"; do
            if grep -qE '^(diff|---|\+\+\+) .*\.ConfigMap\.' "$RUNNER_TEMP/$g.diff"; then
              mapfile -t -O "${#wanted[@]}" wanted < <(grep '^deployment/' "$RUNNER_TEMP/$g.rollouts" || true)
            fi
          done
          # Restart a Deployment only if it exists in the namespace. --ignore-not-found prints nothing for a missing
          # one (skipped with a warning); any other error (forbidden, unreachable) still fails the run.
          restarted=(); skipped=()
          for workload in "${wanted[@]}"; do
            [[ " ${restarted[*]} ${skipped[*]} " == *" $workload "* ]] && continue
            found=$(kubectl -n "$ns" get "$workload" --ignore-not-found -o name)
            if [[ -n "$found" ]]; then
              kubectl -n "$ns" rollout restart "$workload"
              restarted+=("$workload")
            else
              echo "::warning::$workload does not exist in namespace $ns; not restarted"
              skipped+=("$workload")
            fi
          done

          failed=0
          while read -r workload; do
            [[ -n "$workload" ]] || continue
            if ! kubectl rollout status "$workload" --timeout=5m; then
              echo "::error::$workload did not become ready within 5 minutes"
              kubectl get pods -o wide | grep -E "^${workload#*/}" || true
              failed=1
            fi
          done < "$RUNNER_TEMP/rollouts.txt"
          [[ $failed -eq 0 ]] || exit 1

          {
            echo '### Applied to mk4'
            if [[ $changed -eq 1 ]]; then echo '- Changes applied (see the "Changes" group in the log).'; else echo '- No changes: the cluster already matched.'; fi
            if [[ ${#restarted[@]} -gt 0 ]]; then echo "- Restarted in $ns: ${restarted[*]}"; fi
            if [[ ${#skipped[@]} -gt 0 ]]; then echo "- Not restarted (not found in $ns): ${skipped[*]}"; fi
            echo "- Ready: $(paste -sd ' ' "$RUNNER_TEMP/rollouts.txt")"
            echo '- Not applied by CI: Secrets, ClusterRoles and ClusterRoleBindings, ClusterIssuers, RuntimeClass, admission policies, CronJobs; and for seo-agent also RBAC, ServiceAccounts and quotas. The practice executor deploys from moks-tech/practice-programming.'
          } >> "$GITHUB_STEP_SUMMARY"
      # The site is checked even when another workload failed to roll out, so that failure cannot hide a broken site.
      # Cloudflare answers 403 to GitHub-hosted runners, so the app is tested through a port-forward to the site
      # Deployment (pods/portforward in 85-ci-applier.yaml); the edge redirects are not tested from here.
      - name: Smoke test
        if: ${{ !cancelled() && steps.apply.outcome != 'skipped' }}
        env:
          MK4_API_SERVER: ${{ vars.MK4_API_SERVER }}
          MK4_CA_DATA: ${{ vars.MK4_CA_DATA }}
          MK4_CI_APPLY_TOKEN: ${{ secrets.MK4_CI_APPLY_TOKEN }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          (umask 077; perl -pe 's/\$\{(MK4_[A-Z_]+)\}/$ENV{$1}/g' .github/jithendar-ci-applier.yaml > "$KUBECONFIG")
          kubectl port-forward deployment/jithendar-com 18080:3000 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          pf=$!
          trap 'kill "$pf" 2>/dev/null || true; rm -f "$KUBECONFIG"' EXIT
          for _ in $(seq 1 30); do
            curl -s -o /dev/null --max-time 2 http://127.0.0.1:18080/ && break
            sleep 1
          done
          SMOKE_VIA=http://127.0.0.1:18080 scripts/smoke.sh https://jithendar.com || { cat "$RUNNER_TEMP/port-forward.log"; exit 1; }
