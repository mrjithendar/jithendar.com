name: infra

# AWS resources of jithendar.com (infra/, Terraform): ECR repositories jithendar-com, practice-executor,
# practice-sandbox, and role github-jithendar-com-ci that the image workflows assume.
#
# check → pull requests and pushes: fmt, validate (no AWS credentials)
# apply → default branch only, in GitHub environment "aws-infra": plan, then apply that plan. Signs in through
#         GitHub OIDC as role github-jithendar-com-terraform (repository variable AWS_TERRAFORM_ROLE_ARN), which
#         infra/bootstrap creates; it trusts only jobs in that environment, may only manage this site's ECR
#         repositories and roles that carry the jithendar-com-ci-boundary policy, and cannot edit itself.
#
# Requires manual configuration (once): apply infra/bootstrap with admin credentials, create environment
# "aws-infra" restricted to the master branch, set variable AWS_TERRAFORM_ROLE_ARN. See infra/README.md.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  push:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

# Never cancel a running apply.
concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

# bash -eo pipefail: a failing `terraform plan | tee` must fail the step.
defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  AWS_REGION: us-east-1

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for dir in infra infra/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false -no-color >/dev/null
            terraform -chdir="$dir" validate -no-color
          done

  apply:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws-infra
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: infra-apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: Sign in to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: jithendar-com-terraform-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Init
        run: terraform -chdir=infra init -input=false -no-color
      - name: Plan
        run: |
          umask 077
          terraform -chdir=infra plan -input=false -no-color -lock-timeout=5m -out=tf.tfplan | tee "$RUNNER_TEMP/plan.txt"
          { echo '### Terraform plan'; echo '```'; grep -E '^  # |^Plan:|^No changes' "$RUNNER_TEMP/plan.txt" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Apply
        run: terraform -chdir=infra apply -input=false -no-color -lock-timeout=5m tf.tfplan
      - name: Outputs
        run: |
          { echo '### Outputs'; echo '```'; terraform -chdir=infra output -no-color; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # The plan can hold sensitive values; do not leave it on the runner.
      - name: Remove saved plan
        if: always()
        run: rm -f infra/tf.tfplan "$RUNNER_TEMP/plan.txt"
