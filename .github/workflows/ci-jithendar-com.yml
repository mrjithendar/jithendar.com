name: jithendar.com

# check   → pull requests: lint, typecheck, test, build, render manifests
# release → default branch: npm ci once; lint, tests and the production build (in turn); package the
#           build into an arm64 image, smoke-test the image, push it to Harbor as
#           registry.jithendar.com/jithendar/jithendar-com:latest (the only tag), then
#           `kubectl rollout restart deploy/jithendar-com` so the cluster pulls the new :latest
#
# CI's only cluster access is that restart (kubeconfig template .github/jithendar-ci-deployer.yaml, filled
# from variables MK4_API_SERVER, MK4_CA_DATA and secret MK4_CI_TOKEN set by scripts/setup-ci-deployer.sh); it
# never applies manifests. ./deploy.sh applies minikube/ for manifest changes (see minikube/README.md). The site always
# runs :latest; there is no digest pinning.
#
# Both jobs run on GitHub-hosted runners, never on the mk4 server: builds there competed with the cluster
# for memory and disk and froze the host (2026-10-29). The release job logs in to Harbor as robot
# robot$jithendar+jithendar-com (repository secrets HARBOR_USERNAME and HARBOR_PASSWORD, set by the tools
# repository's deploy/minikube/harbor/registry.py ci-robots; push and pull in project jithendar only).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'www/**'
      - 'minikube/**'
      - '.github/workflows/ci-jithendar-com.yml'
  push:
    paths:
      - 'www/**'
      - '.github/workflows/ci-jithendar-com.yml'

permissions:
  contents: read

# Builds for the same ref run one at a time.
concurrency:
  group: jithendar-com-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: www

jobs:
  check:
    # Pull requests from forks never run CI here (nothing in it needs them). Branches of this repository,
    # including Dependabot's, still run.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: www/.nvmrc
          cache: npm
          cache-dependency-path: www/package-lock.json
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          APP_ENV: production
      - name: Render production manifests
        run: kubectl kustomize ../minikube > /dev/null

  release:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    # Native arm64, like the cluster nodes (sharp's prebuilt binaries match the image).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      REGISTRY_IMAGE: registry.jithendar.com/jithendar/jithendar-com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: www/.nvmrc
          cache: npm
          cache-dependency-path: www/package-lock.json
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: v1.35.0
      - run: npm ci --no-audit --no-fund
      # One step each, in sequence: output streams live and a failure names its step. (Running them in parallel
      # only paid off on the shared self-hosted server; on a fresh VM it just stacks three memory peaks.)
      - run: npm run lint
      # Tests rely on development fallbacks (e.g. SETTINGS_ENCRYPTION_KEY); only the build is production.
      - run: npm test
      # The production build type-checks the whole project, so no separate typecheck is needed here.
      - run: npm run build
        env:
          APP_ENV: production
      # cancelled() too: a step ended by "The operation was canceled" does not count as failure().
      - name: Diagnostics (only when a step above failed or was canceled)
        if: failure() || cancelled()
        run: |
          free -m || true
          sudo dmesg --ctime 2>/dev/null | grep -iE "oom|killed process|out of memory" | tail -20 || true
          journalctl --no-pager -u systemd-oomd --since "-30 min" 2>/dev/null | tail -20 || true
      - name: Render production manifests
        run: kubectl kustomize ../minikube > /dev/null
      - name: Log in to Harbor
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$HARBOR_USERNAME" && -n "$HARBOR_PASSWORD" ]] || { echo "::error::Secrets HARBOR_USERNAME and HARBOR_PASSWORD must be set"; exit 1; }
          printf '%s' "$HARBOR_PASSWORD" | docker login registry.jithendar.com --username "$HARBOR_USERNAME" --password-stdin
      - name: Package image
        run: docker build --platform linux/arm64 --provenance=false -f Dockerfile.ci --build-arg "GIT_SHA=$GITHUB_SHA" -t "$REGISTRY_IMAGE:latest" .
      # Never push an image that cannot start or optimise images.
      - name: Smoke-test the image
        env:
          IMAGE: ${{ env.REGISTRY_IMAGE }}:latest
        run: |
          set -euo pipefail
          name="jithendar-smoke-$GITHUB_RUN_ID"
          docker run -d --rm --name "$name" -p 127.0.0.1::3000 "$IMAGE" >/dev/null
          trap 'docker logs "$name" | tail -50; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "$name" 3000/tcp | head -1 | sed 's/.*://')"
          for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:$port/api/health" >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS "http://127.0.0.1:$port/api/health" | grep -q "\"version\":\"$GITHUB_SHA\""
          type="$(curl -fsS -o /dev/null -w '%{content_type}' -H 'Accept: image/avif,image/webp' \
            "http://127.0.0.1:$port/_next/image?url=%2Fimages%2Froboshop-ai%2Fcart.jpg&w=640&q=75")"
          [[ "$type" == image/avif* || "$type" == image/webp* ]] || { echo "Image optimiser returned: $type" >&2; exit 1; }
          echo "Image healthy; optimiser served $type"
      - name: Push
        # One tag, latest; the commit is inside the image (/api/health reports it).
        run: docker push --quiet "$REGISTRY_IMAGE:latest"
      # The live deployment runs jithendar-com:latest with imagePullPolicy Always, so a restart pulls the image
      # just pushed. Signs in as ServiceAccount jithendar/github-ci-deployer, which may only restart and watch
      # deployment/jithendar-com: the template .github/jithendar-ci-deployer.yaml filled in with the values that
      # scripts/setup-ci-deployer.sh stored.
      - name: Restart jithendar-com
        env:
          MK4_API_SERVER: ${{ vars.MK4_API_SERVER }}
          MK4_CA_DATA: ${{ vars.MK4_CA_DATA }}
          MK4_CI_TOKEN: ${{ secrets.MK4_CI_TOKEN }}
        run: |
          set -euo pipefail
          for v in MK4_API_SERVER MK4_CA_DATA MK4_CI_TOKEN; do
            [[ -n "${!v}" ]] || { echo "::error::$v is not set; run scripts/setup-ci-deployer.sh"; exit 1; }
          done
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          (umask 077; perl -pe 's/\$\{(MK4_[A-Z_]+)\}/$ENV{$1}/g' ../.github/jithendar-ci-deployer.yaml > "$KUBECONFIG")
          kubectl -n jithendar rollout restart deploy/jithendar-com
          if ! kubectl -n jithendar rollout status deploy/jithendar-com --timeout=5m; then
            echo "::error::Rollout of jithendar-com did not finish within 5 minutes"
            exit 1
          fi
      - name: Record image
        run: |
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY_IMAGE:latest")"
          {
            echo '### jithendar.com image'
            echo
            echo "- Tag: \`$REGISTRY_IMAGE:latest\` (commit \`$GITHUB_SHA\`)"
            echo "- Digest: \`$digest\`"
            echo
            echo "Deployed: deploy/jithendar-com restarted on \`:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
