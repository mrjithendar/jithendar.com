name: jithendar.com

# check   → pull requests: lint, typecheck, test, build, render manifests
# release → default branch: npm ci once; lint, tests and the production build in parallel; package the
#           build into an arm64 image, smoke-test the image, push jithendar-com:<commit-sha> to ECR
#
# CI does not deploy and has no cluster access. ./deploy.sh resolves the image digest
# from ECR, pins it in www/deploy/production and applies it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'www/**'
      - '.github/workflows/ci-jithendar-com.yml'
  push:
    paths:
      - 'www/**'
      - '.github/workflows/ci-jithendar-com.yml'

permissions:
  contents: read

# Builds for the same ref run one at a time.
concurrency:
  group: jithendar-com-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: www

jobs:
  check:
    # This repository is public and the runners are self-hosted (with AWS access): never run code from
    # pull requests opened from forks on them. Branches of this repository (including Dependabot's) still run.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: www/.nvmrc
          cache: npm
          cache-dependency-path: www/package-lock.json
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.35.0
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          APP_ENV: production
      - name: Render production manifests
        run: kubectl kustomize deploy/production > /dev/null

  release:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-1
      REPOSITORY: jithendar-com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: www/.nvmrc
          cache: npm
          cache-dependency-path: www/package-lock.json
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.35.0
      - run: npm ci --no-audit --no-fund
      # The production build type-checks the whole project, so no separate typecheck is needed here.
      # Only the build is production: tests rely on development fallbacks (e.g. SETTINGS_ENCRYPTION_KEY).
      - name: Lint, test and build (in parallel)
        run: |
          set -uo pipefail
          npm run lint > lint.log 2>&1 & lint=$!
          npm test > test.log 2>&1 & tests=$!
          APP_ENV=production npm run build > build.log 2>&1 & build=$!
          rc=0
          for job in "lint:$lint" "test:$tests" "build:$build"; do
            if ! wait "${job#*:}"; then echo "::error::${job%%:*} failed"; rc=1; fi
          done
          for log in lint test build; do echo "::group::$log"; cat "$log.log"; echo "::endgroup::"; done
          exit "$rc"
      - name: Render production manifests
        run: kubectl kustomize deploy/production > /dev/null
      # Concurrent runners share HOME; isolate Docker login settings.
      - name: Isolate Docker configuration for this job
        run: echo "DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/docker-config.XXXXXX")" >> "$GITHUB_ENV"
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - name: Package image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }}
        run: docker build --platform linux/arm64 --provenance=false -f Dockerfile.ci --build-arg "GIT_SHA=$GITHUB_SHA" -t "$IMAGE" .
      # Never push an image that cannot start or optimise images.
      - name: Smoke-test the image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }}
        run: |
          set -euo pipefail
          name="jithendar-smoke-$GITHUB_RUN_ID"
          docker run -d --rm --name "$name" -p 127.0.0.1::3000 "$IMAGE" >/dev/null
          trap 'docker logs "$name" | tail -50; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "$name" 3000/tcp | head -1 | sed 's/.*://')"
          for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:$port/api/health" >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS "http://127.0.0.1:$port/api/health" | grep -q "\"version\":\"$GITHUB_SHA\""
          type="$(curl -fsS -o /dev/null -w '%{content_type}' -H 'Accept: image/avif,image/webp' \
            "http://127.0.0.1:$port/_next/image?url=%2Fimages%2Froboshop-ai%2Fcart.jpg&w=640&q=75")"
          [[ "$type" == image/avif* || "$type" == image/webp* ]] || { echo "Image optimiser returned: $type" >&2; exit 1; }
          echo "Image healthy; optimiser served $type"
      - name: Push
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }}
        run: docker push --quiet "$IMAGE"
      - name: Record image
        env:
          REGISTRY_IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}
        run: |
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY_IMAGE:$GITHUB_SHA")"
          {
            echo '### jithendar.com image'
            echo
            echo "- Tag: \`$REGISTRY_IMAGE:$GITHUB_SHA\`"
            echo "- Digest: \`$digest\`"
            echo
            echo "Deploy: \`./deploy.sh\` (latest) or \`./deploy.sh $GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the runner's Docker storage bounded
        if: always()
        run: |
          docker image prune --force --filter "until=72h" --filter "label!=keep" >/dev/null || true
          docker builder prune --force --keep-storage 10GB >/dev/null || true
