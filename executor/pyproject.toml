[project]
name = "practice-executor"
version = "1.0.0"
description = "Sandboxed Python execution for jithendar.com Python practice (API + dispatcher)."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "redis==8.1.0",
  "httpx==0.28.1",
  "pydantic==2.14.2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Only the service package is installable. sandbox/ (runner.py, copied into its own image) and tools/ are scripts;
# without this, setuptools refuses to build ("Multiple top-level packages discovered in a flat-layout").
[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
test = ["pytest==9.2.0", "fakeredis==2.40.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
