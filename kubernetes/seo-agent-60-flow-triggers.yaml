# Flow triggers (docs/seo/FLOWS.md "Scheduling"): one CronJob per scheduled CrewAI flow. Each runs only
# `python -m app.trigger <flow>`, which POSTs /flows/{flow}/kickoff with the service token and triggered_by=cron, then
# lets the Istio sidecar exit. No business logic here: the flows (one active run per flow + target, advisory locks,
# idempotent steps) live in seo-agent. The schedules are configuration: edit them here (or patch the CronJob) without
# a code change. They replace the web app's in-process schedule for these job types, which it skips when
# SEO_ORCHESTRATOR=crewai, so each job runs once. Rollback: suspend these (kubectl patch … -p '{"spec":{"suspend":true}}')
# and set SEO_ORCHESTRATOR=legacy. Applied by a person with the rest of the seo-agent group; CI never applies CronJobs.
---
# Daily Search Console sync (06:10 UTC)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: seo-flow-gsc-sync
  namespace: jithendar
  labels: { app: seo-agent-trigger, app.kubernetes.io/part-of: jithendar-com }
spec:
  schedule: "10 6 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: { app: seo-agent-trigger, app.kubernetes.io/part-of: jithendar-com }
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          imagePullSecrets: [{ name: harbor-pull }]
          securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: trigger
              image: registry.jithendar.com/jithendar/seo-agent:latest
              imagePullPolicy: Always
              command: ["python", "-m", "app.trigger", "gsc_sync_flow"]
              env:
                - { name: SEO_AGENT_URL, value: "http://seo-agent.jithendar:8080" }
                - name: SEO_AGENT_TOKEN
                  valueFrom: { secretKeyRef: { name: seo-agent-env, key: SEO_AGENT_TOKEN } }
              resources:
                requests: { cpu: 10m, memory: 48Mi }
                limits: { cpu: 200m, memory: 128Mi }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
