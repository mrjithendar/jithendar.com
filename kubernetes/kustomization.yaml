# jithendar.com site on mk4, applied by .github/workflows/deploy-kubernetes.yml when a pull request is merged
# (by hand: kubectl apply -k kubernetes). Only the 00-…85- files are
# listed; seo-agent-*.yaml and news-agent-*.yaml are separate groups (README.md, scripts/manifests.sh). The practice executor is deployed
# from moks-tech/practice-programming.
# Secrets (jithendar-com-env, harbor-pull) are created separately and never committed. PostgreSQL is the shared
# CloudNativePG cluster in namespace postgres-db (miniKube repo), whose Secret postgres-db-credentials Terraform writes
# here. The site uses no REDIS_URL; its cache bus (pub/sub only, redis-site-cachebus-credentials, optional) and the
# practice executor (redis-practice-credentials) use the shared Valkey.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No `namespace:` here: every namespaced manifest sets namespace jithendar itself.


resources:
- 00-namespace.yaml
- 30-jithendar-com.yaml
- 60-istio-routing.yaml
- 70-observability.yaml
- 75-mesh.yaml
- 80-ci-deployer.yaml
- 81-ci-deployer-admission.yaml
- 85-ci-applier.yaml

# 30-jithendar-com.yaml names the moks-cms release the site runs (moks-cms:pr-<number>, applied as written). No digest
# pinning. Articles and images are not in the cluster's manifests or any image: content.yml pushes them through the
# site's API.

# site.json and config/*.json, mounted at /app/site. The name gets a hash of the contents, so a change to these files
# rolls the Deployment when deploy-kubernetes.yml applies it. The files sit outside this folder: scripts/manifests.sh
# renders with --load-restrictor=LoadRestrictionsNone. Keys are flat (config.<name>.json); the volume in
# 30-jithendar-com.yaml maps each back to config/<name>.json (scripts/tests/test_site_configmap.py keeps the three in
# step).
configMapGenerator:
- name: jithendar-com-site
  namespace: jithendar
  options:
    labels:
      app.kubernetes.io/part-of: jithendar-com
  files:
  - site.json=../site.json
  - config.gone.json=../config/gone.json
  - config.hire-me-profile.json=../config/hire-me-profile.json
  - config.redirects.json=../config/redirects.json
