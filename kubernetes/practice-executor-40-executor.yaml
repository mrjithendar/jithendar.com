# API (no Kubernetes credentials, never runs code) and dispatcher (starts sandbox pods). Same image, two commands.
# Secret practice-executor-env (created by scripts/create-practice-executor-secrets.sh, never committed):
#   EXECUTOR_API_TOKEN. The queue is the shared Valkey: EXECUTOR_REDIS_URL from redis-practice-credentials (Terraform).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: practice-executor-config
  namespace: jithendar
data:
  EXECUTOR_ENV: production
  EXECUTOR_BACKEND: kubernetes
  EXECUTOR_SANDBOX_NAMESPACE: jithendar
  EXECUTOR_RUNTIME_CLASS: gvisor-nonet
  EXECUTOR_SANDBOX_SERVICE_ACCOUNT: practice-sandbox
  EXECUTOR_IMAGE_PULL_SECRET: harbor-pull
  EXECUTOR_DISPATCHER_CONCURRENCY: "4"
  EXECUTOR_PER_USER_CONCURRENCY: "2"
  EXECUTOR_PER_USER_PER_MINUTE: "30"
  EXECUTOR_MAX_QUEUE: "200"
  # Runtime id → sandbox image (ids must match Admin → Python practice → Runtimes). Always :latest; the dispatcher
  # starts sandbox pods with imagePullPolicy Always, and CI moves :latest on every release.
  EXECUTOR_RUNTIMES: '{"python-3.13": "registry.jithendar.com/jithendar/practice-sandbox:latest"}'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-executor-api
  namespace: jithendar
  labels: { app: practice-executor-api, app.kubernetes.io/part-of: python-practice }
spec:
  # 0 until mk4 has the sandbox layer again (gVisor, practice-executor-05/-10/-15/-20 and verify-practice-sandbox.sh,
  # all applied by a person; CI never applies them). Without its ServiceAccount the pods cannot be created and the
  # deploy workflow fails waiting for them. Set back to 2 once scripts/verify-practice-sandbox.sh passes.
  replicas: 0
  selector: { matchLabels: { app: practice-executor-api } }
  template:
    metadata:
      labels: { app: practice-executor-api, app.kubernetes.io/part-of: python-practice }
    spec:
      serviceAccountName: practice-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets: [{ name: harbor-pull }]
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: registry.jithendar.com/jithendar/practice-executor:pr-92
          # Said out loud: the default is Always only for :latest, and CI sets this image to pr-<number>.
          imagePullPolicy: Always
          command: ["python", "-m", "app.main"]
          env:
            # Shared Valkey (namespace redis, ACL user practice, database 1; Terraform in the miniKube repo).
            - name: EXECUTOR_REDIS_URL
              valueFrom: { secretKeyRef: { name: redis-practice-credentials, key: uri } }
          envFrom:
            - configMapRef: { name: practice-executor-config }
            - secretRef: { name: practice-executor-env }
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: practice-dispatcher
  namespace: jithendar
  labels: { app: practice-dispatcher, app.kubernetes.io/part-of: python-practice }
spec:
  # 0 until mk4 has the sandbox layer again (gVisor, practice-executor-05/-10/-15/-20 and verify-practice-sandbox.sh,
  # all applied by a person; CI never applies them). Without its ServiceAccount the pods cannot be created and the
  # deploy workflow fails waiting for them. Set back to 1 once scripts/verify-practice-sandbox.sh passes.
  replicas: 0
  selector: { matchLabels: { app: practice-dispatcher } }
  template:
    metadata:
      labels: { app: practice-dispatcher, app.kubernetes.io/part-of: python-practice }
    spec:
      serviceAccountName: practice-dispatcher
      enableServiceLinks: false
      imagePullSecrets: [{ name: harbor-pull }]
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: dispatcher
          image: registry.jithendar.com/jithendar/practice-executor:pr-92
          # Said out loud: the default is Always only for :latest, and CI sets this image to pr-<number>.
          imagePullPolicy: Always
          command: ["python", "-m", "app.dispatcher"]
          env:
            # Shared Valkey (namespace redis, ACL user practice, database 1; Terraform in the miniKube repo).
            - name: EXECUTOR_REDIS_URL
              valueFrom: { secretKeyRef: { name: redis-practice-credentials, key: uri } }
          envFrom:
            - configMapRef: { name: practice-executor-config }
            - secretRef: { name: practice-executor-env }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata:
  name: practice-executor
  namespace: jithendar
spec:
  selector: { app: practice-executor-api }
  ports: [{ name: http, port: 80, targetPort: http }]
