# TLS certificate for jithendar.com (cert-manager)
# Exported from the live mk4 cluster (namespace jithendar) on 2026-10-29; cluster-generated fields removed.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jithendar-com
  namespace: jithendar
spec:
  dnsNames:
  - jithendar.com
  - www.jithendar.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-prod
  secretName: jithendar-com-tls
