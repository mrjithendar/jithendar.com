# Allowed traffic. mk4's kindnet (v20260820) DOES enforce NetworkPolicy (verified 2026-11-02: the site's egress
# rule blocked it from the executor until it allowed app=practice-executor-api). Sandbox isolation still does not
# rely on these: runsc network=none (practice-executor-05-runtimeclass.yaml) gives sandbox pods only a loopback interface.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: practice-sandbox, namespace: jithendar }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: practice-sandbox } }
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: practice-executor-api, namespace: jithendar }
spec:
  podSelector: { matchLabels: { app: practice-executor-api } }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: jithendar-com } } }]
      ports: [{ port: 8080, protocol: TCP }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: practice-redis } } }]
      ports: [{ port: 6379, protocol: TCP }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: practice-dispatcher, namespace: jithendar }
spec:
  podSelector: { matchLabels: { app: practice-dispatcher } }
  policyTypes: ["Ingress", "Egress"]
  egress:
    - to: [{ podSelector: { matchLabels: { app: practice-redis } } }]
      ports: [{ port: 6379, protocol: TCP }]
    # Kubernetes API server (in-cluster service and the node addresses minikube uses).
    - ports: [{ port: 443, protocol: TCP }, { port: 8443, protocol: TCP }, { port: 6443, protocol: TCP }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: practice-redis, namespace: jithendar }
spec:
  podSelector: { matchLabels: { app: practice-redis } }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: practice-executor-api } }
        - podSelector: { matchLabels: { app: practice-dispatcher } }
      ports: [{ port: 6379, protocol: TCP }]
